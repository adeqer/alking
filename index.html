<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>ALHYTHAM QR - ماسح رمز الاستجابة السريعة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 24px;
        }

        p {
            color: #64748b;
            margin-bottom: 25px;
        }

        #outdiv {
            width: 100%;
            aspect-ratio: 4/3;
            background-color: #000;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
            border: 4px solid var(--primary-color);
        }

        video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            font-size: 14px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
        }

        .btn-outline:hover {
            background-color: #eff6ff;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #94a3b8;
        }

        .footer a {
            color: var(--primary-color);
            text-decoration: none;
        }

        /* Scan Animation */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, #ff0000, transparent);
            box-shadow: 0 0 8px #ff0000;
            animation: scan 2s linear infinite;
            z-index: 10;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        @font-face {
            font-family: 'fontello';
            src: url('./font/fontello.eot?14907215');
            src: url('./font/fontello.eot?14907215#iefix') format('embedded-opentype'),
                 url('./font/fontello.woff?14907215') format('woff'),
                 url('./font/fontello.ttf?14907215') format('truetype'),
                 url('./font/fontello.svg?14907215#fontello') format('svg');
            font-weight: normal;
            font-style: normal;
        }

        .icon {
            font-family: "fontello";
            font-style: normal;
            font-weight: normal;
            display: inline-block;
            text-decoration: inherit;
            width: 1em;
            text-align: center;
        }
    </style>
    <script type="text/javascript" src="llqrcode.js"></script>
    <script type="text/javascript" src="mikhmon_webqr.js?v1"></script>
</head>
<body>
    <div class="container">
        <h1>ALHYTHAM QR</h1>
        <p>امسح رمز QR لتسجيل الدخول إلى الشبكة</p>
        
        <div id="outdiv">
            <div class="scan-line"></div>
        </div>

        <div class="button-group">
            <button class="btn btn-primary" onclick="location.reload();">
                <i class="icon">&#xe800;</i> تحديث الكاميرا
            </button>
            <a class="btn btn-outline" href="intent://laksa19.github.io/myqr#Intent;scheme=http;package=com.android.chrome;end">
                <i class="icon">&#xf268;</i> فتح في كروم
            </a>
        </div>

        <div class="footer">
            ALHYTHAM QR &copy; 2026 <br>
            مدعوم بواسطة <a href="http://www.webqr.com">webqr.com</a>
        </div>
    </div>

    <canvas style="display:none;" id="qr-canvas" width="800" height="600"></canvas>
    <script type="text/javascript">load();</script>
</body>
</html>
