<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Pro Reader - Elite Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #F1C40F;
            --gold-dark: #996515;
            --bg-dark: #060606;
            --bg-card: #0f0f12;
            --bg-secondary: #1a1a1f;
            --text: #ffffff;
            --text-dim: #a0a0a5;
            --text-light: #d0d0d5;
            --border: rgba(212, 175, 55, 0.2);
            --font: 'Outfit', 'Cairo', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font);
            background: linear-gradient(135deg, var(--bg-dark) 0%, #0a0a0e 50%, var(--bg-dark) 100%);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            background-attachment: fixed;
        }

        @keyframes rainbow-gold {
            0% { filter: hue-rotate(0deg) brightness(1.2); }
            50% { filter: hue-rotate(180deg) brightness(1.5); }
            100% { filter: hue-rotate(360deg) brightness(1.2); }
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 5px 15px rgba(212, 175, 55, 0.1); }
            50% { box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 5px 25px rgba(212, 175, 55, 0.3); }
        }

        @keyframes lineGlide {
            0% { top: 10%; }
            50% { top: 90%; }
            100% { top: 10%; }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            height: 98vh;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 48px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            animation: slideIn 0.6s ease-out;
        }

        /* Header */
        .header-section {
            padding: 24px 20px 16px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .title {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700 0%, #D4AF37 50%, #B8860B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow-gold 5s linear infinite;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 12px;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Navigation */
        .nav-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 12px 16px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid var(--border);
        }

        .nav-item {
            padding: 12px 8px;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-dim);
            border-radius: 16px;
            cursor: pointer;
            font-weight: 700;
            font-size: 11px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-family: inherit;
        }

        .nav-item:hover {
            color: var(--gold);
            background: rgba(212, 175, 55, 0.08);
        }

        .nav-item.active {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: #000;
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
            border-color: var(--gold);
        }

        .nav-icon {
            font-size: 20px;
        }

        /* Content */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            scrollbar-width: thin;
            scrollbar-color: rgba(212, 175, 55, 0.3) transparent;
        }

        .content::-webkit-scrollbar {
            width: 6px;
        }

        .content::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.3);
            border-radius: 10px;
        }

        .panel {
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .panel.active {
            display: flex;
            animation: slideIn 0.4s ease-out;
        }

        /* Scanner */
        .scanner-box {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: #000;
            border-radius: 32px;
            overflow: hidden;
            border: 2px solid var(--gold);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            animation: pulse-glow 3s ease-in-out infinite;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
            box-shadow: 0 0 20px var(--gold);
            animation: lineGlide 3s infinite ease-in-out;
        }

        .zoom-controls {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 20;
        }

        .zoom-btn {
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--border);
            border-radius: 50%;
            color: var(--gold);
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .zoom-btn:hover {
            background: rgba(212, 175, 55, 0.2);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        /* Controls */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            padding: 12px;
            border: 1px solid var(--border);
            background: rgba(212, 175, 55, 0.08);
            color: var(--gold);
            border-radius: 16px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn:hover {
            background: rgba(212, 175, 55, 0.15);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: #000;
            border: none;
            grid-column: 1 / -1;
            padding: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary:hover {
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
        }

        /* Result Card */
        .result-card {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, rgba(212, 175, 55, 0.02) 100%);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px;
            display: none;
            animation: slideIn 0.4s ease-out;
        }

        .result-card.show {
            display: block;
        }

        .result-title {
            font-size: 12px;
            color: var(--gold);
            font-weight: 800;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .result-text {
            font-size: 14px;
            color: var(--text-light);
            word-break: break-all;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .result-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        /* Input */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-label {
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-field {
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 14px;
            color: var(--text);
            font-family: inherit;
            font-size: 13px;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-field:focus {
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--gold);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.2);
        }

        textarea.input-field {
            min-height: 80px;
            resize: vertical;
        }

        /* File Upload */
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 20px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(212, 175, 55, 0.02);
        }

        .upload-area:hover {
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.08);
        }

        .upload-area.drag {
            border-color: var(--gold-light);
            background: rgba(212, 175, 55, 0.15);
        }

        .upload-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .upload-text {
            font-size: 13px;
            color: var(--text);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .upload-hint {
            font-size: 11px;
            color: var(--text-dim);
        }

        #fileInput {
            display: none;
        }

        /* Canvas */
        #canvas {
            width: 100%;
            border-radius: 20px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
            display: none;
        }

        /* QR Box */
        #qrBox {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 240px;
            background: rgba(212, 175, 55, 0.05);
            border-radius: 20px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
        }

        #qrBox img {
            max-width: 100%;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
        }

        /* History */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, rgba(212, 175, 55, 0.02) 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: right;
        }

        .history-item:hover {
            border-color: var(--gold);
            transform: translateX(-4px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.15);
        }

        .history-date {
            font-size: 10px;
            color: var(--gold);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .history-text {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-dim);
        }

        .empty-icon {
            font-size: 40px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        /* Modal */
        .modal {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            z-index: 1000;
            border-radius: 48px;
            backdrop-filter: blur(5px);
        }

        .modal.show {
            display: flex;
            animation: slideIn 0.3s ease-out;
        }

        .modal-box {
            background: var(--bg-card);
            border: 2px solid var(--gold);
            border-radius: 28px;
            padding: 32px 20px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.2);
        }

        .modal-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 900;
            color: var(--gold);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .modal-text {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 20px;
            word-break: break-all;
            line-height: 1.5;
        }

        .modal-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .modal-btn {
            padding: 12px;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            font-size: 12px;
            text-transform: uppercase;
        }

        .modal-btn-primary {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: #000;
        }

        .modal-btn-primary:hover {
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
        }

        .modal-btn-secondary {
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold);
            border: 1px solid var(--border);
        }

        .modal-btn-secondary:hover {
            background: rgba(212, 175, 55, 0.2);
        }

        /* Toast */
        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: #000;
            padding: 14px 28px;
            border-radius: 20px;
            font-weight: 800;
            z-index: 2000;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
            font-size: 13px;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 480px) {
            .main-container {
                max-width: 100%;
                border-radius: 24px;
            }

            .title {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Header -->
        <div class="header-section">
            <div class="title">QR Pro</div>
            <div class="subtitle">Elite Edition</div>
        </div>

        <!-- Navigation -->
        <div class="nav-bar">
            <button class="nav-item active" onclick="switchTab('scan', this)">
                <span class="nav-icon">📷</span>
                <span>الماسح</span>
            </button>
            <button class="nav-item" onclick="switchTab('audit', this)">
                <span class="nav-icon">🔍</span>
                <span>التدقيق</span>
            </button>
            <button class="nav-item" onclick="switchTab('generate', this)">
                <span class="nav-icon">✨</span>
                <span>الإنشاء</span>
            </button>
            <button class="nav-item" onclick="switchTab('history', this)">
                <span class="nav-icon">📜</span>
                <span>السجل</span>
            </button>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Scanner Tab -->
            <div class="panel active" id="scan">
                <div class="scanner-box">
                    <video id="video" playsinline></video>
                    <div class="scan-line"></div>
                    <div class="zoom-controls">
                        <button class="zoom-btn" onclick="zoomIn()">➕</button>
                        <button class="zoom-btn" onclick="zoomOut()">➖</button>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn" onclick="toggleFlash()">💡 الفلاش</button>
                    <button class="btn" onclick="switchCamera()">🔄 تبديل</button>
                </div>

                <div class="result-card" id="scanResult">
                    <div class="result-title">✅ تم القراءة</div>
                    <div class="result-text" id="scanText"></div>
                    <div class="result-actions">
                        <button class="btn" onclick="copyScan()">📋 نسخ</button>
                        <button class="btn" onclick="shareScan()">🔗 مشاركة</button>
                    </div>
                </div>
            </div>

            <!-- Audit Tab -->
            <div class="panel" id="audit">
                <div class="input-group">
                    <label class="input-label">رفع الصورة</label>
                    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                        <div class="upload-icon">📸</div>
                        <div class="upload-text">اسحب الصورة هنا أو انقر</div>
                        <div class="upload-hint">PNG, JPG - حتى 10MB</div>
                    </div>
                    <input type="file" id="fileInput" accept="image/*" onchange="loadImage(this)">
                </div>

                <canvas id="canvas"></canvas>

                <div class="input-group">
                    <label class="input-label">التباين</label>
                    <input type="range" id="contrast" min="50" max="200" value="100" class="input-field" style="cursor: pointer;">
                </div>

                <button class="btn btn-primary" onclick="analyzeImage()">🔬 تحليل الصورة</button>

                <div class="result-card" id="auditResult">
                    <div class="result-title">📊 النتيجة</div>
                    <div class="result-text" id="auditText"></div>
                    <div class="result-actions">
                        <button class="btn" onclick="copyAudit()">📋 نسخ</button>
                        <button class="btn" onclick="openAuditURL()">🔗 فتح</button>
                    </div>
                </div>
            </div>

            <!-- Generate Tab -->
            <div class="panel" id="generate">
                <div class="input-group">
                    <label class="input-label">النص أو الرابط</label>
                    <textarea class="input-field" id="qrInput" placeholder="أدخل النص أو الرابط..."></textarea>
                </div>

                <button class="btn btn-primary" onclick="generateQR()">✨ إنشاء QR</button>

                <div id="qrBox"></div>

                <button class="btn" id="saveBtn" style="display: none; grid-column: 1 / -1;" onclick="downloadQR()">💾 حفظ</button>
            </div>

            <!-- History Tab -->
            <div class="panel" id="history">
                <div class="controls">
                    <button class="btn" onclick="exportJSON()">📥 JSON</button>
                    <button class="btn" onclick="exportCSV()">📥 CSV</button>
                </div>

                <button class="btn" style="background: rgba(255, 0, 0, 0.1); border-color: rgba(255, 0, 0, 0.3); color: #ff6b6b; grid-column: 1 / -1;" onclick="clearHistory()">🗑️ مسح</button>

                <div class="history-list" id="historyList"></div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-box">
            <div class="modal-icon" id="modalIcon">🔗</div>
            <div class="modal-title" id="modalTitle">رابط</div>
            <div class="modal-text" id="modalText"></div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-primary" onclick="openURL()">فتح الرابط</button>
                <button class="modal-btn modal-btn-secondary" onclick="closeModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.0/dist/confetti.browser.min.js"></script>

    <script>
        // ==================== STATE ====================
        let stream = null;
        let isScanning = true;
        let currentZoom = 1;
        let history = JSON.parse(localStorage.getItem('qr_history') || '[]');
        let lastScanned = null;
        let lastAudit = null;
        let uploadedImage = null;

        // ==================== INITIALIZATION ====================
        async function initCamera() {
            try {
                const constraints = {
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                };
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('video').srcObject = stream;
                startScanning();
                showToast('📷 تم تفعيل الكاميرا');
            } catch (e) {
                showToast('❌ لا يمكن الوصول للكاميرا');
                console.error(e);
            }
        }

        // ==================== SCANNING ====================
        function startScanning() {
            if (!isScanning) return;
            
            const video = document.getElementById('video');
            if (video.readyState !== video.HAVE_ENOUGH_DATA) {
                requestAnimationFrame(startScanning);
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);

            try {
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);
                
                if (code && code.data) {
                    handleScanned(code.data);
                    return;
                }
            } catch (e) {}

            requestAnimationFrame(startScanning);
        }

        function handleScanned(data) {
            lastScanned = data;
            isScanning = false;
            playSound();
            saveHistory(data);

            if (isURL(data)) {
                showURLModal(data);
            } else {
                showScanResult(data);
            }
        }

        function showScanResult(data) {
            document.getElementById('scanText').textContent = data;
            document.getElementById('scanResult').classList.add('show');
            showToast('✅ تم قراءة QR Code');
        }

        function showURLModal(url) {
            document.getElementById('modalIcon').textContent = '🔗';
            document.getElementById('modalTitle').textContent = 'رابط مكتشف';
            document.getElementById('modalText').textContent = url;
            document.getElementById('modal').classList.add('show');
        }

        function isURL(str) {
            try {
                new URL(str);
                return true;
            } catch (_) {
                return false;
            }
        }

        function openURL() {
            let url = lastScanned;
            if (!url.startsWith('http')) url = 'https://' + url;
            window.open(url, '_blank');
            closeModal();
            showToast('🌐 تم فتح الرابط');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
            setTimeout(() => {
                isScanning = true;
                startScanning();
            }, 300);
        }

        function copyScan() {
            navigator.clipboard.writeText(lastScanned);
            showToast('📋 تم النسخ');
        }

        function shareScan() {
            if (navigator.share) {
                navigator.share({ title: 'QR Pro', text: lastScanned });
            } else {
                copyScan();
            }
        }

        // ==================== IMAGE AUDIT ====================
        function loadImage(input) {
            if (!input.files[0]) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    uploadedImage = img;
                    const canvas = document.getElementById('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    canvas.style.display = 'block';
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    showToast('📸 تم تحميل الصورة');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }

        function analyzeImage() {
            if (!uploadedImage) {
                showToast('❌ حمل صورة أولاً');
                return;
            }

            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const contrast = document.getElementById('contrast').value / 100;

            ctx.filter = `contrast(${contrast}) brightness(1.1)`;
            ctx.drawImage(uploadedImage, 0, 0);

            showToast('🔬 جاري التحليل...');

            setTimeout(() => {
                try {
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);

                    if (code && code.data) {
                        lastAudit = code.data;
                        document.getElementById('auditText').textContent = code.data;
                        document.getElementById('auditResult').classList.add('show');
                        showToast('✅ تم العثور على QR Code');
                    } else {
                        showToast('⚠️ لم يتم العثور على QR Code');
                    }
                } catch (e) {
                    showToast('❌ خطأ في التحليل');
                }
            }, 300);
        }

        function copyAudit() {
            if (lastAudit) {
                navigator.clipboard.writeText(lastAudit);
                showToast('📋 تم النسخ');
            }
        }

        function openAuditURL() {
            if (lastAudit && isURL(lastAudit)) {
                let url = lastAudit;
                if (!url.startsWith('http')) url = 'https://' + url;
                window.open(url, '_blank');
                showToast('🌐 تم فتح الرابط');
            }
        }

        // ==================== QR GENERATION ====================
        function generateQR() {
            const text = document.getElementById('qrInput').value.trim();
            if (!text) {
                showToast('❌ أدخل نص أو رابط');
                return;
            }

            const box = document.getElementById('qrBox');
            box.innerHTML = '';

            try {
                new QRCode(box, {
                    text: text,
                    width: 220,
                    height: 220,
                    colorDark: '#D4AF37',
                    colorLight: '#0f0f12',
                    correctLevel: QRCode.CorrectLevel.H
                });
                document.getElementById('saveBtn').style.display = 'block';
                saveHistory(text);
                confetti({ particleCount: 50, colors: ['#D4AF37', '#FFD700'] });
                showToast('✨ تم الإنشاء بنجاح');
            } catch (e) {
                showToast('❌ خطأ في الإنشاء');
            }
        }

        function downloadQR() {
            const img = document.querySelector('#qrBox img');
            if (img) {
                const link = document.createElement('a');
                link.download = 'QR_' + Date.now() + '.png';
                link.href = img.src;
                link.click();
                showToast('💾 تم الحفظ');
            }
        }

        // ==================== HISTORY ====================
        function saveHistory(text) {
            history.unshift({
                text,
                date: new Date().toLocaleString('ar-EG'),
                id: Date.now()
            });
            if (history.length > 100) history.pop();
            localStorage.setItem('qr_history', JSON.stringify(history));
        }

        function drawHistory() {
            const list = document.getElementById('historyList');
            if (history.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="empty-icon">📜</div><div>السجل فارغ</div></div>';
                return;
            }

            list.innerHTML = history.map(item => `
                <div class="history-item" onclick="copyHistory('${item.text.replace(/'/g, "\\'")}')">
                    <div class="history-date">${item.date}</div>
                    <div class="history-text">${item.text}</div>
                </div>
            `).join('');
        }

        function copyHistory(text) {
            navigator.clipboard.writeText(text);
            showToast('📋 تم النسخ');
        }

        function clearHistory() {
            if (confirm('هل تريد مسح السجل؟')) {
                history = [];
                localStorage.removeItem('qr_history');
                drawHistory();
                showToast('🗑️ تم المسح');
            }
        }

        function exportJSON() {
            const data = JSON.stringify(history, null, 2);
            downloadFile(data, 'qr_history.json', 'application/json');
        }

        function exportCSV() {
            const data = history.map(h => `"${h.date}","${h.text}"`).join('\n');
            downloadFile(data, 'qr_history.csv', 'text/csv');
        }

        function downloadFile(content, filename, type) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            link.click();
            showToast('📥 تم التصدير');
        }

        // ==================== CONTROLS ====================
        function zoomIn() {
            currentZoom = Math.min(currentZoom + 0.5, 5);
            applyZoom();
        }

        function zoomOut() {
            currentZoom = Math.max(currentZoom - 0.5, 1);
            applyZoom();
        }

        function applyZoom() {
            const video = document.getElementById('video');
            video.style.transform = `scale(${currentZoom})`;
        }

        function toggleFlash() {
            if (!stream) return;
            const track = stream.getVideoTracks()[0];
            if (track.getCapabilities && track.getCapabilities().torch) {
                const settings = track.getSettings();
                track.applyConstraints({ advanced: [{ torch: !settings.torch }] });
                showToast(settings.torch ? '💡 إيقاف' : '💡 تشغيل');
            } else {
                showToast('❌ الفلاش غير مدعوم');
            }
        }

        function switchCamera() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
            }
            initCamera();
            showToast('🔄 تم التبديل');
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            btn.classList.add('active');

            if (tab === 'scan' && !isScanning) {
                isScanning = true;
                startScanning();
            }

            if (tab === 'history') {
                drawHistory();
            }
        }

        // ==================== UTILITIES ====================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function playSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 1500;
                gain.gain.value = 0.05;
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch (e) {}
        }

        // ==================== DRAG & DROP ====================
        const uploadArea = document.querySelector('.upload-area');
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                document.getElementById('fileInput').files = files;
                loadImage(document.getElementById('fileInput'));
            }
        });

        // ==================== STARTUP ====================
        window.addEventListener('load', () => {
            initCamera();
            drawHistory();
        });

        window.addEventListener('beforeunload', () => {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
            }
        });
    </script>
</body>
</html>
