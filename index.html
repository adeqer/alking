<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALHYTHAM QR Scanner - Professional Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --accent: #f59e0b;
            --success: #10b981;
            --error: #ef4444;
            --dark-bg: #0f172a;
            --dark-card: #1e293b;
            --dark-border: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-tertiary: #94a3b8;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Poppins', 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1f3a 50%, var(--dark-bg) 100%);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--dark-card);
            border-radius: 32px;
            border: 1px solid var(--dark-border);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        /* Header */
        .header {
            padding: 24px 20px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(236, 72, 153, 0.05) 100%);
            border-bottom: 1px solid var(--dark-border);
            text-align: center;
        }

        .header-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #6366f1 0%, #ec4899 50%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-subtitle {
            font-size: 11px;
            color: var(--text-tertiary);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.5);
            border-bottom: 1px solid var(--dark-border);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .tab-btn {
            flex-shrink: 0;
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--dark-border);
            color: var(--text-secondary);
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            font-family: 'Poppins', sans-serif;
        }

        .tab-btn:hover {
            border-color: var(--primary-light);
            color: var(--primary-light);
            background: rgba(99, 102, 241, 0.1);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-color: transparent;
            color: white;
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
        }

        /* Content */
        .content {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 16px;
        }

        .tab-content {
            display: none;
            flex: 1;
            width: 100%;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        /* Camera Box */
        .camera-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--dark-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .scanner-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75%;
            height: 75%;
            border: 2px solid var(--primary);
            border-radius: 16px;
            box-shadow: inset 0 0 0 1000px rgba(0, 0, 0, 0.3);
            pointer-events: none;
        }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            top: 0;
            animation: scanMove 2s infinite ease-in-out;
        }

        @keyframes scanMove {
            0%, 100% { top: 10%; }
            50% { top: 90%; }
        }

        /* Controls */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .control-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 14px 10px;
            background: var(--dark-card);
            border: 1px solid var(--dark-border);
            border-radius: 12px;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .control-btn:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary-light);
        }

        .control-btn.active {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(236, 72, 153, 0.1) 100%);
            border-color: var(--primary);
            color: var(--primary-light);
        }

        .control-icon {
            font-size: 20px;
        }

        /* Zoom Control */
        .zoom-control {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: var(--dark-card);
            border: 1px solid var(--dark-border);
            border-radius: 12px;
        }

        .zoom-label {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .zoom-slider {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        .zoom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary-light);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
        }

        .zoom-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary-light);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
        }

        .zoom-value {
            font-size: 11px;
            color: var(--primary-light);
            font-weight: 600;
            min-width: 30px;
            text-align: center;
        }

        /* Result Box */
        .result-box {
            background: var(--dark-card);
            border: 1px solid var(--dark-border);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            margin-top: auto;
        }

        .result-box.success {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.08);
        }

        .result-box.error {
            border-color: var(--error);
            background: rgba(239, 68, 68, 0.08);
        }

        .result-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .result-text {
            color: var(--text-primary);
            font-weight: 600;
            word-break: break-all;
            font-size: 11px;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .result-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 6px 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        /* History */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            background: var(--dark-card);
            border: 1px solid var(--dark-border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .history-item:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .history-info {
            flex: 1;
            min-width: 0;
        }

        .history-time {
            font-size: 10px;
            color: var(--text-tertiary);
            margin-bottom: 4px;
        }

        .history-text {
            font-size: 11px;
            color: var(--text-primary);
            word-break: break-all;
            line-height: 1.3;
        }

        .history-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            padding: 6px;
            transition: color 0.3s ease;
            flex-shrink: 0;
        }

        .history-btn:hover {
            color: var(--primary-light);
        }

        /* Upload Area */
        .upload-area {
            border: 2px dashed var(--dark-border);
            border-radius: 16px;
            padding: 32px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(99, 102, 241, 0.05);
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .upload-area.dragover {
            border-color: var(--secondary);
            background: rgba(236, 72, 153, 0.1);
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .upload-text {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .upload-hint {
            font-size: 10px;
            color: var(--text-tertiary);
        }

        /* Enhancement Controls */
        .enhancement-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .enhancement-btn {
            flex: 1;
            min-width: 70px;
            padding: 8px 10px;
            background: var(--dark-card);
            border: 1px solid var(--dark-border);
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .enhancement-btn:hover {
            border-color: var(--primary);
            color: var(--primary-light);
            background: rgba(99, 102, 241, 0.1);
        }

        .enhancement-btn.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-color: transparent;
            color: white;
        }

        /* Image Preview */
        .image-preview {
            width: 100%;
            max-height: 250px;
            border-radius: 12px;
            border: 1px solid var(--dark-border);
            object-fit: contain;
            background: rgba(0, 0, 0, 0.3);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            color: var(--text-tertiary);
            padding: 40px 20px;
            font-size: 12px;
        }

        /* Footer */
        .footer {
            padding: 12px;
            border-top: 1px solid var(--dark-border);
            text-align: center;
            font-size: 9px;
            color: var(--text-tertiary);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border: 1px solid var(--primary-light);
            border-radius: 10px;
            padding: 12px 20px;
            color: white;
            font-size: 11px;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
            z-index: 1000;
            transition: transform 0.3s ease;
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            border-color: var(--success);
        }

        .toast.error {
            background: linear-gradient(135deg, var(--error) 0%, #dc2626 100%);
            border-color: var(--error);
        }

        /* Scrollbar */
        .content::-webkit-scrollbar {
            width: 6px;
        }

        .content::-webkit-scrollbar-track {
            background: transparent;
        }

        .content::-webkit-scrollbar-thumb {
            background: var(--dark-border);
            border-radius: 3px;
        }

        .content::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* WiFi Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--dark-card);
            border: 1px solid var(--dark-border);
            border-radius: 20px;
            padding: 24px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .modal-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 16px;
            text-align: center;
        }

        .modal-info {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid var(--primary);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .modal-info-item {
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .modal-label {
            color: var(--primary-light);
            font-weight: 600;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-btn.primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .modal-btn.primary:hover {
            transform: translateY(-2px);
        }

        .modal-btn.secondary {
            background: var(--dark-card);
            border: 1px solid var(--dark-border);
            color: var(--text-secondary);
        }

        .modal-btn.secondary:hover {
            border-color: var(--primary);
            color: var(--primary-light);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                border-radius: 24px;
            }

            .header-title {
                font-size: 24px;
            }

            .controls {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .processing {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--primary-light);
            font-size: 11px;
            font-weight: 600;
        }

        .spinner {
            width: 12px;
            height: 12px;
            border: 2px solid var(--dark-border);
            border-top-color: var(--primary-light);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-title">ALHYTHAM QR</div>
            <div class="header-subtitle">Professional Scanner</div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('scan', this)">📡 مسح</button>
            <button class="tab-btn" onclick="switchTab('history', this)">📋 السجل</button>
            <button class="tab-btn" onclick="switchTab('upload', this)">📤 رفع</button>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Scan Tab -->
            <div id="scan" class="tab-content active">
                <div class="camera-container">
                    <video id="video" playsinline autoplay></video>
                    <div class="scanner-frame">
                        <div class="scan-line"></div>
                    </div>
                </div>

                <div class="zoom-control">
                    <span class="zoom-label">🔍</span>
                    <input type="range" id="zoomSlider" class="zoom-slider" min="1" max="5" step="0.1" value="1" oninput="updateZoom(this.value)">
                    <span class="zoom-value" id="zoomValue">1.0x</span>
                </div>

                <div class="controls">
                    <button class="control-btn" id="torchBtn" onclick="toggleTorch()">
                        <span class="control-icon">💡</span>
                        <span>فلاش</span>
                    </button>
                    <button class="control-btn" onclick="toggleCamera()">
                        <span class="control-icon">🔄</span>
                        <span>تبديل</span>
                    </button>
                    <button class="control-btn" onclick="restartScanner()">
                        <span class="control-icon">♻️</span>
                        <span>تحديث</span>
                    </button>
                </div>

                <div id="result" class="result-box">
                    جاري البحث عن أكواد QR...
                </div>
            </div>

            <!-- History Tab -->
            <div id="history" class="tab-content">
                <div class="history-list" id="historyList">
                    <div class="empty-state">السجل فارغ</div>
                </div>
                <button class="control-btn" style="width: 100%; margin-top: auto;" onclick="clearHistory()">
                    <span class="control-icon">🗑️</span>
                    <span>مسح السجل</span>
                </button>
            </div>

            <!-- Upload Tab -->
            <div id="upload" class="tab-content">
                <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-icon">📸</div>
                    <div class="upload-text">اختر صورة تحتوي على كود QR</div>
                    <div class="upload-hint">اسحب أو انقر للاختيار</div>
                </div>
                <input type="file" id="fileInput" style="display: none;" accept="image/*" onchange="handleFileUpload(event)">
                
                <div id="uploadPreview" style="display: none;">
                    <img id="previewImage" class="image-preview" alt="معاينة الصورة">
                    <div class="enhancement-controls">
                        <button class="enhancement-btn" onclick="enhanceImage('auto')">🎨 تحسين</button>
                        <button class="enhancement-btn" onclick="enhanceImage('contrast')">📊 تباين</button>
                        <button class="enhancement-btn" onclick="enhanceImage('brightness')">☀️ إضاءة</button>
                    </div>
                </div>

                <div id="uploadResult" class="result-box" style="margin-top: 16px;">
                    انتظار اختيار ملف...
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            ALHYTHAM QR © 2026 | PROFESSIONAL EDITION
        </div>
    </div>

    <!-- WiFi Modal -->
    <div id="wifiModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">🌐 اتصال شبكة WiFi</div>
            <div class="modal-info">
                <div class="modal-info-item">
                    <span class="modal-label">الشبكة:</span>
                    <span id="wifiSSID">-</span>
                </div>
                <div class="modal-info-item">
                    <span class="modal-label">الأمان:</span>
                    <span id="wifiSecurity">-</span>
                </div>
                <div class="modal-info-item">
                    <span class="modal-label">كلمة المرور:</span>
                    <span id="wifiPassword">-</span>
                </div>
            </div>
            <div class="modal-actions">
                <button class="modal-btn primary" onclick="connectToWiFi()">🔗 اتصل</button>
                <button class="modal-btn secondary" onclick="closeWiFiModal()">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Hidden Canvas -->
    <canvas id="canvas" style="display:none;"></canvas>
    <canvas id="enhancedCanvas" style="display:none;"></canvas>

    <!-- ZXing Library -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>

    <script>
        // DOM Elements
        const video = document.getElementById('video');
        const resultPanel = document.getElementById('result');
        const zoomSlider = document.getElementById('zoomSlider');
        const zoomValue = document.getElementById('zoomValue');
        const torchBtn = document.getElementById('torchBtn');
        const historyList = document.getElementById('historyList');
        const toast = document.getElementById('toast');
        const uploadArea = document.getElementById('uploadArea');
        const wifiModal = document.getElementById('wifiModal');

        // State
        let codeReader = new ZXing.BrowserQRCodeReader();
        let currentStream = null;
        let selectedDeviceId = null;
        let isTorchOn = false;
        let isScanning = true;
        let history = JSON.parse(localStorage.getItem('qr_history') || '[]');
        let currentUploadedImage = null;
        let currentWiFiData = null;

        // Utility Functions
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function showToast(message, type = 'default') {
            toast.textContent = message;
            toast.classList.remove('success', 'error');
            if (type !== 'default') toast.classList.add(type);
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch (e) {}
        }

        // Tab Switching
        function switchTab(tabName, button) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabName).classList.add('active');
            button.classList.add('active');

            if (tabName === 'history') renderHistory();
            if (tabName === 'scan') {
                isScanning = true;
                startScanning();
            }
        }

        // Camera Functions
        async function initCamera() {
            try {
                const devices = await codeReader.listVideoInputDevices();
                if (devices.length === 0) {
                    resultPanel.innerHTML = 'لا توجد كاميرا متاحة';
                    return;
                }
                selectedDeviceId = devices[devices.length - 1].deviceId;
                startScanning();
            } catch (err) {
                resultPanel.innerHTML = 'خطأ في الوصول للكاميرا';
            }
        }

        async function startScanning() {
            if (currentStream) currentStream.getTracks().forEach(track => track.stop());
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { deviceId: selectedDeviceId ? { exact: selectedDeviceId } : undefined, facingMode: 'environment' }
                });
                video.srcObject = currentStream;

                const hints = new Map();
                hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
                codeReader.decodeFromVideoDevice(selectedDeviceId, 'video', (result, err) => {
                    if (result && isScanning) onScanSuccess(result.text);
                }, hints);

                setTimeout(checkCapabilities, 1000);
            } catch (err) {
                resultPanel.innerHTML = 'خطأ في الوصول للكاميرا';
            }
        }

        function checkCapabilities() {
            if (!currentStream) return;
            const track = currentStream.getVideoTracks()[0];
            if (!track?.getCapabilities?.().torch) {
                torchBtn.style.opacity = '0.5';
                torchBtn.disabled = true;
            }
        }

        function updateZoom(val) {
            zoomValue.textContent = parseFloat(val).toFixed(1) + 'x';
            if (!currentStream) return;
            const track = currentStream.getVideoTracks()[0];
            if (track?.getCapabilities?.().zoom) {
                track.applyConstraints({ advanced: [{ zoom: val }] });
            } else {
                video.style.transform = `scale(${val})`;
            }
        }

        async function toggleTorch() {
            if (!currentStream) return;
            const track = currentStream.getVideoTracks()[0];
            if (!track) return;
            isTorchOn = !isTorchOn;
            try {
                await track.applyConstraints({ advanced: [{ torch: isTorchOn }] });
                torchBtn.classList.toggle('active');
                showToast(isTorchOn ? 'الفلاش مُفعّل' : 'الفلاش مُطفأ', 'success');
            } catch (e) {
                showToast('الفلاش غير متاح', 'error');
            }
        }

        async function toggleCamera() {
            isScanning = false;
            try {
                const devices = await codeReader.listVideoInputDevices();
                const idx = devices.findIndex(d => d.deviceId === selectedDeviceId);
                selectedDeviceId = devices[(idx + 1) % devices.length].deviceId;
                startScanning();
                showToast('تم تبديل الكاميرا', 'success');
            } catch (e) {
                showToast('خطأ في تبديل الكاميرا', 'error');
            }
        }

        function restartScanner() {
            isScanning = false;
            startScanning();
            showToast('تم تحديث الماسح', 'success');
        }

        // WiFi Functions
        function parseWiFiQR(text) {
            if (!text.startsWith('WIFI:')) return null;
            const data = { ssid: '', password: '', security: 'WPA', hidden: false };
            text.substring(5).split(';').forEach(part => {
                if (part.startsWith('T:')) data.security = part.substring(2) || 'WPA';
                else if (part.startsWith('S:')) data.ssid = part.substring(2);
                else if (part.startsWith('P:')) data.password = part.substring(2);
                else if (part.startsWith('H:')) data.hidden = part.substring(2) === 'true';
            });
            return data.ssid ? data : null;
        }

        function showWiFiModal(wifiData) {
            currentWiFiData = wifiData;
            document.getElementById('wifiSSID').textContent = wifiData.ssid;
            document.getElementById('wifiSecurity').textContent = wifiData.security;
            document.getElementById('wifiPassword').textContent = wifiData.password || 'بدون كلمة مرور';
            wifiModal.classList.add('show');
        }

        function closeWiFiModal() {
            wifiModal.classList.remove('show');
        }

        function connectToWiFi() {
            if (!currentWiFiData) return;
            showToast(`جاري الاتصال بـ ${currentWiFiData.ssid}...`, 'success');
            if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
                window.location.href = `prefs:root=WIFI`;
            } else if (/Android/.test(navigator.userAgent)) {
                window.location.href = `intent://net.wifi.SSID#Intent;scheme=android-app;end`;
            }
            closeWiFiModal();
        }

        // Scan Success
        function onScanSuccess(text) {
            if (navigator.vibrate) navigator.vibrate(100);
            playBeep();

            const wifiData = parseWiFiQR(text);
            if (wifiData) {
                showWiFiResult(wifiData);
                showWiFiModal(wifiData);
                addToHistory(`WiFi: ${wifiData.ssid}`);
                isScanning = false;
                setTimeout(() => { isScanning = true; }, 3000);
                return;
            }

            const type = text.startsWith('http') ? 'رابط' : 'نص';
            const html = `
                <div class="result-content">
                    <div class="result-badge">${type}</div>
                    <div class="result-text">${escapeHtml(text)}</div>
                    <div class="result-actions">
                        ${text.startsWith('http') ? `<button class="action-btn" onclick="window.open('${escapeHtml(text)}', '_blank')">فتح</button>` : ''}
                        <button class="action-btn" onclick="navigator.clipboard.writeText('${escapeHtml(text)}'); showToast('تم النسخ', 'success')">نسخ</button>
                    </div>
                </div>
            `;
            resultPanel.innerHTML = html;
            resultPanel.classList.add('success');
            resultPanel.classList.remove('error');
            addToHistory(text);
            isScanning = false;
            setTimeout(() => { isScanning = true; }, 2000);
        }

        function showWiFiResult(wifiData) {
            const html = `
                <div class="result-content">
                    <div class="result-badge">🌐 WiFi</div>
                    <div class="result-text">شبكة: ${escapeHtml(wifiData.ssid)}</div>
                    <div class="result-actions">
                        <button class="action-btn" onclick="showWiFiModal(currentWiFiData)">🔗 اتصل</button>
                        <button class="action-btn" onclick="navigator.clipboard.writeText('${escapeHtml(wifiData.ssid)}'); showToast('تم النسخ', 'success')">نسخ</button>
                    </div>
                </div>
            `;
            resultPanel.innerHTML = html;
            resultPanel.classList.add('success');
        }

        // History Functions
        function addToHistory(text) {
            if (history[0]?.text === text) return;
            history.unshift({ text, time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }), date: new Date().toLocaleDateString('ar-EG') });
            if (history.length > 50) history.pop();
            localStorage.setItem('qr_history', JSON.stringify(history));
        }

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = '<div class="empty-state">السجل فارغ</div>';
                return;
            }
            historyList.innerHTML = history.map((item, idx) => `
                <div class="history-item">
                    <div class="history-info">
                        <div class="history-time">${item.time} • ${item.date}</div>
                        <div class="history-text">${item.text.startsWith('http') ? `<a href="${escapeHtml(item.text)}" target="_blank" style="color: var(--primary-light); text-decoration: none;">${escapeHtml(item.text)}</a>` : escapeHtml(item.text)}</div>
                    </div>
                    <button class="history-btn" onclick="navigator.clipboard.writeText('${escapeHtml(item.text)}'); showToast('تم النسخ', 'success')">📋</button>
                </div>
            `).join('');
        }

        function clearHistory() {
            if (confirm('هل تريد مسح السجل بالكامل؟')) {
                history = [];
                localStorage.removeItem('qr_history');
                renderHistory();
                showToast('تم مسح السجل', 'success');
            }
        }

        // Upload Functions
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                document.getElementById('fileInput').files = e.dataTransfer.files;
                handleFileUpload({ target: { files: e.dataTransfer.files } });
            }
        });

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const uploadResult = document.getElementById('uploadResult');
            uploadResult.innerHTML = '<div class="processing"><div class="spinner"></div><span>جاري التحليل...</span></div>';

            try {
                const img = await decodeImage(file);
                currentUploadedImage = img;
                document.getElementById('previewImage').src = img.src;
                document.getElementById('uploadPreview').style.display = 'block';
                await decodeQRFromImage(img);
            } catch (err) {
                uploadResult.innerHTML = 'خطأ في تحليل الصورة';
                uploadResult.classList.add('error');
                showToast('خطأ في تحليل الصورة', 'error');
            }
        }

        async function decodeQRFromImage(img) {
            try {
                const result = await codeReader.decodeFromImageElement(img);
                if (result) {
                    displayUploadResult(result.text, true);
                } else {
                    enhanceImage('auto');
                }
            } catch (err) {
                document.getElementById('uploadResult').innerHTML = 'لم يتم العثور على كود QR - جاري التحسين...';
                setTimeout(() => enhanceImage('auto'), 1000);
            }
        }

        function enhanceImage(mode) {
            if (!currentUploadedImage) return;
            const canvas = document.getElementById('enhancedCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = currentUploadedImage.width;
            canvas.height = currentUploadedImage.height;
            ctx.drawImage(currentUploadedImage, 0, 0);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            if (mode === 'auto' || mode === 'contrast') {
                let min = 255, max = 0;
                for (let i = 0; i < data.length; i += 4) {
                    const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
                    min = Math.min(min, gray);
                    max = Math.max(max, gray);
                }
                const range = max - min || 1;
                for (let i = 0; i < data.length; i += 4) {
                    data[i] = ((data[i] - min) / range) * 255;
                    data[i + 1] = ((data[i + 1] - min) / range) * 255;
                    data[i + 2] = ((data[i + 2] - min) / range) * 255;
                }
            }

            if (mode === 'auto' || mode === 'brightness') {
                for (let i = 0; i < data.length; i += 4) {
                    data[i] = Math.min(255, data[i] * 1.2);
                    data[i + 1] = Math.min(255, data[i + 1] * 1.2);
                    data[i + 2] = Math.min(255, data[i + 2] * 1.2);
                }
            }

            if (mode === 'auto') {
                for (let i = 0; i < data.length; i += 4) {
                    const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
                    data[i] = data[i + 1] = data[i + 2] = gray;
                }
            }

            ctx.putImageData(imageData, 0, 0);
            canvas.toBlob((blob) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('previewImage').src = e.target.result;
                    decodeQRFromCanvas();
                };
                reader.readAsDataURL(blob);
            });

            showToast('جاري تحسين الصورة...', 'success');
        }

        async function decodeQRFromCanvas() {
            try {
                const canvas = document.getElementById('enhancedCanvas');
                const result = await codeReader.decodeFromCanvas(canvas);
                if (result) {
                    displayUploadResult(result.text, true);
                } else {
                    document.getElementById('uploadResult').innerHTML = 'لم يتم العثور على كود QR';
                    document.getElementById('uploadResult').classList.add('error');
                }
            } catch (err) {
                document.getElementById('uploadResult').innerHTML = 'لم يتم العثور على كود QR';
                document.getElementById('uploadResult').classList.add('error');
            }
        }

        function displayUploadResult(text, success = false) {
            const uploadResult = document.getElementById('uploadResult');
            const wifiData = parseWiFiQR(text);

            if (wifiData) {
                const html = `
                    <div class="result-content">
                        <div class="result-badge">🌐 WiFi</div>
                        <div class="result-text">شبكة: ${escapeHtml(wifiData.ssid)}</div>
                        <div class="result-actions">
                            <button class="action-btn" onclick="showWiFiModal(currentWiFiData)">🔗 اتصل</button>
                            <button class="action-btn" onclick="navigator.clipboard.writeText('${escapeHtml(wifiData.ssid)}'); showToast('تم النسخ', 'success')">نسخ</button>
                        </div>
                    </div>
                `;
                uploadResult.innerHTML = html;
                currentWiFiData = wifiData;
                addToHistory(`WiFi: ${wifiData.ssid}`);
                showToast('تم قراءة شبكة WiFi بنجاح!', 'success');
                return;
            }

            const type = text.startsWith('http') ? 'رابط' : 'نص';
            const html = `
                <div class="result-content">
                    <div class="result-badge">${type}</div>
                    <div class="result-text">${escapeHtml(text)}</div>
                    <div class="result-actions">
                        ${text.startsWith('http') ? `<button class="action-btn" onclick="window.open('${escapeHtml(text)}', '_blank')">فتح</button>` : ''}
                        <button class="action-btn" onclick="navigator.clipboard.writeText('${escapeHtml(text)}'); showToast('تم النسخ', 'success')">نسخ</button>
                    </div>
                </div>
            `;
            uploadResult.innerHTML = html;
            if (success) {
                uploadResult.classList.add('success');
                uploadResult.classList.remove('error');
                addToHistory(text);
                showToast('تم قراءة الباركود بنجاح!', 'success');
            }
        }

        function decodeImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = () => reject(new Error('خطأ في تحميل الصورة'));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error('خطأ في قراءة الملف'));
                reader.readAsDataURL(file);
            });
        }

        // Initialize
        window.addEventListener('load', initCamera);
        window.addEventListener('beforeunload', () => {
            if (currentStream) currentStream.getTracks().forEach(track => track.stop());
        });
    </script>
</body>
</html>
