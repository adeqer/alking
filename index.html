<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="ماسح QR ذكي، سريع، وآمن. يدعم الصور، الكاميرا، وتحليل الروابط تلقائياً بجودة عالية.">
  <title>ALHYTHAM.NET | ماسح الكود الذكي HD</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --text-muted: #64748b;
      --primary: #4f46e5; --primary-hover: #4338ca; --border: #e2e8f0;
      --radius: 16px; --shadow: 0 8px 20px -4px rgb(0 0 0 / 0.1);
      --glass: rgba(255, 255, 255, 0.85); --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      --btn-bg: var(--surface); --btn-text: var(--text); --btn-border: var(--border);
    }
    .style-gradient { --primary: linear-gradient(135deg, #6366f1, #8b5cf6); --primary-hover: linear-gradient(135deg, #4f46e5, #7c3aed); }
    .style-glass { --surface: rgba(255, 255, 255, 0.65); --glass: rgba(255, 255, 255, 0.5); --border: rgba(255, 255, 255, 0.4); backdrop-filter: blur(16px); }
    .style-neumorphism { --surface: #e0e5ec; --bg: #e0e5ec; --text: #374151; --btn-bg: #e0e5ec; --btn-border: transparent; --shadow: 6px 6px 12px #b8babe, -6px -6px 12px #ffffff; --glass: transparent; }
    .style-dark { --bg: #0b1120; --surface: #151e32; --text: #f8fafc; --text-muted: #94a3b8; --primary: #818cf8; --primary-hover: #6366f1; --border: #1e293b; --glass: rgba(21, 30, 50, 0.85); --btn-bg: #1e293b; --btn-text: #f1f5f9; }
    
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
      transition: background var(--transition), color var(--transition);
    }

    header {
      padding: 0.8rem 1.2rem; display: flex; justify-content: space-between; align-items: center;
      background: var(--glass); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
    }
    .brand { font-weight: 800; font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem; }
    .brand span {
      background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #8a2be2, #ff0000);
      background-size: 400% 400%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbow-flow 5s ease infinite;
    }
    @keyframes rainbow-flow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

    .header-actions { display: flex; gap: 0.6rem; }
    .icon-btn {
      background: var(--btn-bg); color: var(--text); border: 1px solid var(--btn-border);
      width: 38px; height: 38px; border-radius: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 1rem;
      transition: var(--transition); box-shadow: var(--shadow);
    }
    .icon-btn:hover { transform: scale(1.05); border-color: var(--primary); }

    main { flex: 1; padding: 1.2rem; max-width: 640px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 1.2rem; }

    .scanner-card {
      background: var(--surface); border-radius: var(--radius); padding: 0.8rem;
      box-shadow: var(--shadow); border: 1px solid var(--border); position: relative;
      overflow: hidden;
    }
    #reader {
      width: 100%; min-height: 260px; border-radius: 12px; overflow: hidden;
      background: #000; position: relative;
    }
    /* تحسين عرض الفيديو ليكون عالي الجودة */
    #reader video { 
      width: 100% !important; 
      height: 100% !important; 
      object-fit: cover; 
      border-radius: 12px;
      image-rendering: -webkit-optimize-contrast;
    }
    #reader > div:not(video), #reader a, #reader button { display: none !important; }
    
    .scan-overlay {
      position: absolute; inset: 0.8rem; border: 2px solid rgba(99, 102, 241, 0.4);
      border-radius: 10px; pointer-events: none; z-index: 2;
    }
    .scan-overlay::before, .scan-overlay::after {
      content: ""; position: absolute; width: 20px; height: 20px;
      border: 3px solid var(--primary); transition: var(--transition);
    }
    .scan-overlay::before { top: -1px; right: -1px; border-width: 3px 3px 0 0; border-radius: 0 8px 0 0; }
    .scan-overlay::after { bottom: -1px; left: -1px; border-width: 0 0 3px 3px; border-radius: 0 0 0 8px; }
    
    .scan-line {
      position: absolute; top: 0; left: 15%; right: 15%; height: 2px;
      background: var(--primary); box-shadow: 0 0 12px var(--primary);
      animation: scan 2.2s linear infinite; border-radius: 2px; z-index: 3;
    }
    @keyframes scan { 0%,100% { top: 10%; opacity: 0.5; } 50% { top: 90%; opacity: 1; } }

    .upload-btn {
      background: var(--primary); color: #fff; border: none; padding: 1rem;
      border-radius: 14px; font-weight: 700; font-size: 1.05rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
      transition: var(--transition); box-shadow: 0 6px 16px rgba(99, 102, 241, 0.3);
      width: 100%;
    }
    .upload-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
    #file-input { display: none; }

    .control-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.7rem;
    }
    .ctrl-btn {
      background: var(--btn-bg); color: var(--btn-text); border: 1px solid var(--btn-border);
      padding: 0.9rem 0.5rem; border-radius: 12px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.3rem;
      font-size: 0.8rem; font-weight: 600; transition: var(--transition); box-shadow: var(--shadow);
    }
    .ctrl-btn i { font-size: 1.2rem; }
    .ctrl-btn:hover { transform: translateY(-3px); border-color: var(--primary); }
    .ctrl-btn.active { background: var(--primary); color: #fff; border-color: transparent; }

    .zoom-container { padding: 0.7rem; }
    .zoom-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; font-size: 0.85rem; }
    #zoom-slider { width: 100%; cursor: pointer; accent-color: var(--primary); }

    .result-panel {
      background: var(--surface); border-radius: var(--radius); padding: 1.2rem;
      box-shadow: var(--shadow); border: 1px solid var(--border);
      display: none; animation: slideUp 0.4s ease;
    }
    .result-panel.show { display: block; }
    .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; }
    .result-type { font-size: 0.8rem; padding: 0.25rem 0.7rem; background: rgba(99, 102, 241, 0.15); color: var(--primary); border-radius: 20px; font-weight: 600; }
    .result-content {
      word-break: break-all; background: var(--bg); padding: 0.8rem; border-radius: 10px;
      font-family: monospace; font-size: 0.9rem; border: 1px dashed var(--border);
      max-height: 150px; overflow-y: auto;
    }
    .result-actions { display: flex; gap: 0.6rem; margin-top: 0.8rem; }
    .res-btn {
      flex: 1; background: var(--btn-bg); color: var(--btn-text);
      border: 1px solid var(--btn-border); padding: 0.6rem; border-radius: 10px;
      font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.4rem;
    }
    .res-btn.primary { background: var(--primary); color: #fff; border: none; }

    .history-panel { margin-top: 0.5rem; }
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.7rem; font-weight: 700; }
    .history-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .hist-item {
      padding: 0.8rem; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }
    .hist-item:hover { border-color: var(--primary); }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: var(--transition); z-index: 200; backdrop-filter: blur(4px);
    }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    .modal { background: var(--surface); width: 90%; max-width: 360px; border-radius: 18px; padding: 1.5rem; }
    .style-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-bottom: 1rem; }
    .style-opt { padding: 0.8rem; border: 2px solid var(--border); border-radius: 12px; cursor: pointer; text-align: center; font-weight: 600; }
    .style-opt.selected { border-color: var(--primary); background: rgba(99, 102, 241, 0.05); }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--text); color: var(--bg); padding: 0.7rem 1.3rem; border-radius: 50px;
      opacity: 0; transition: var(--transition); z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 420px) { .control-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <header>
    <div class="brand">🌟 <span>ALHYTHAM.NET</span></div>
    <div class="header-actions">
      <button class="icon-btn" id="reload-btn" title="إعادة تحميل الكاميرا"><i class="fa-solid fa-arrows-rotate"></i></button>
      <button class="icon-btn" id="style-btn" title="تغيير الستايل"><i class="fa-solid fa-palette"></i></button>
      <button class="icon-btn" id="theme-btn" title="الوضع الليلي"><i class="fa-solid fa-moon"></i></button>
    </div>
  </header>

  <main>
    <div class="scanner-card">
      <div id="reader">
        <div class="scan-overlay"><div class="scan-line"></div></div>
      </div>
    </div>

    <button class="upload-btn" id="upload-btn">
      <i class="fa-solid fa-image"></i> رفع صورة QR من المعرض
    </button>
    <input type="file" id="file-input" accept="image/*">

    <div class="control-grid">
      <button class="ctrl-btn" id="switch-cam-btn"><i class="fa-solid fa-camera-rotate"></i> تبديل</button>
      <button class="ctrl-btn" id="torch-btn"><i class="fa-solid fa-bolt"></i> إضاءة</button>
      <div class="ctrl-btn zoom-container" id="zoom-box">
        <div class="zoom-header">
          <i class="fa-solid fa-magnifying-glass-plus"></i>
          <span id="zoom-val">1.0x</span>
        </div>
        <input type="range" id="zoom-slider" min="1" max="5" step="0.1" value="1" disabled>
      </div>
      <button class="ctrl-btn" id="sound-btn"><i class="fa-solid fa-volume-high"></i> صوت</button>
      <button class="ctrl-btn" id="copy-all-btn"><i class="fa-solid fa-clipboard"></i> نسخ</button>
      <button class="ctrl-btn" id="open-chrome-btn"><i class="fa-brands fa-chrome"></i> كروم</button>
    </div>

    <div class="result-panel" id="result-panel">
      <div class="result-header">
        <h3>📦 نتيجة المسح</h3>
        <span class="result-type" id="res-type">نص</span>
      </div>
      <div class="result-content" id="res-text"></div>
      <div class="result-actions">
        <button class="res-btn primary" id="open-res"><i class="fa-solid fa-up-right-from-square"></i> فتح</button>
        <button class="res-btn" id="share-res"><i class="fa-solid fa-share-nodes"></i> مشاركة</button>
      </div>
    </div>

    <div class="history-panel">
      <div class="history-header">
        <span>🕒 سجل المسح</span>
        <button class="ctrl-btn" style="padding:0.4rem 0.8rem; font-size:0.75rem" id="clear-hist">حذف</button>
      </div>
      <div class="history-list" id="hist-list"></div>
    </div>
  </main>

  <footer style="text-align:center;padding:1.5rem 1rem;color:var(--text-muted);font-size:0.8rem;border-top:1px solid var(--border);margin-top:auto;">
    © 2026 ALHYTHAM.NET | ماسح الكود الذكي HD
  </footer>

  <div class="toast" id="toast"></div>

  <div class="modal-overlay" id="style-modal">
    <div class="modal">
      <h3>🎨 اختر ستايل الواجهة</h3>
      <div class="style-grid">
        <div class="style-opt selected" data-style="">📱 كلاسيكي</div>
        <div class="style-opt" data-style="style-gradient">🌈 تدرج لوني</div>
        <div class="style-opt" data-style="style-glass">💎 زجاجي</div>
        <div class="style-opt" data-style="style-neumorphism">🕳️ نيومورفيزم</div>
      </div>
      <button class="upload-btn" id="close-style">إغلاق</button>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const qr = new Html5Qrcode("reader");
      let camMode = 'environment';
      let lastRes = '';
      let isPaused = false;
      let soundOn = true;
      let track = null;

      const $ = id => document.getElementById(id);
      const toast = $('toast');
      const toastFn = msg => { toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2200); };

      // وظيفة جلب أعلى دقة متاحة للكاميرا
      const getBestConstraints = (facing) => {
        return {
          facingMode: facing,
          width: { ideal: 4096 }, // طلب دقة 4K إذا أمكن
          height: { ideal: 2160 },
          frameRate: { ideal: 30, max: 60 }
        };
      };

      const startCam = async (facing) => {
        try { await qr.stop(); } catch(e) {}
        isPaused = false;
        
        const constraints = getBestConstraints(facing);
        
        try {
          // استخدام qrbox أكبر لتحسين التركيز
          await qr.start(constraints, { fps: 30, qrbox: { width: 280, height: 280 } }, onScan, () => {});
          
          const vid = document.querySelector('#reader video');
          if (vid && vid.srcObject) {
            track = vid.srcObject.getVideoTracks()[0];
            const settings = track.getSettings();
            console.log("Camera resolution:", settings.width, "x", settings.height);
            
            // تفعيل الزوم إذا كان مدعوماً
            const caps = track.getCapabilities();
            if (caps.zoom) {
              $('zoom-slider').disabled = false;
              $('zoom-slider').min = caps.zoom.min;
              $('zoom-slider').max = caps.zoom.max;
              $('zoom-slider').step = caps.zoom.step;
              $('zoom-slider').value = settings.zoom || 1;
              $('zoom-val').textContent = (settings.zoom || 1).toFixed(1) + 'x';
            }
          }
        } catch(e) {
          console.error(e);
          toastFn('⚠️ فشل تشغيل الكاميرا بدقة عالية');
          // محاولة تشغيل بدقة عادية كحل احتياطي
          try { await qr.start({ facingMode: facing }, { fps: 20, qrbox: 250 }, onScan); } catch(err) {}
        }
      };

      const onScan = (decoded) => {
        if (isPaused || decoded === lastRes) return;
        isPaused = true;
        lastRes = decoded;
        
        if (soundOn) {
          const audio = new AudioContext();
          const osc = audio.createOscillator();
          const gain = audio.createGain();
          osc.connect(gain); gain.connect(audio.destination);
          osc.frequency.value = 880; gain.gain.value = 0.1;
          osc.start(); osc.stop(audio.currentTime + 0.1);
        }
        
        $('res-text').textContent = decoded;
        $('result-panel').classList.add('show');
        saveHist(decoded);
        toastFn('✅ تم المسح بنجاح');
        
        setTimeout(() => { isPaused = false; lastRes = ''; }, 3000);
      };

      // الأزرار والوظائف
      $('reload-btn').onclick = () => location.reload();
      $('switch-cam-btn').onclick = () => { camMode = camMode === 'environment' ? 'user' : 'environment'; startCam(camMode); };
      
      $('torch-btn').onclick = async () => {
        if (!track) return;
        const state = track.getSettings().torch;
        try {
          await track.applyConstraints({ advanced: [{ torch: !state }] });
          $('torch-btn').classList.toggle('active', !state);
        } catch(e) { toastFn('🔦 الفلاش غير مدعوم'); }
      };

      $('zoom-slider').oninput = async (e) => {
        const val = parseFloat(e.target.value);
        $('zoom-val').textContent = val.toFixed(1) + 'x';
        if (track) await track.applyConstraints({ advanced: [{ zoom: val }] });
      };

      $('upload-btn').onclick = () => $('file-input').click();
      $('file-input').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const res = await qr.scanFile(file, true);
          onScan(res);
        } catch(e) { toastFn('❌ لم يتم العثور على كود'); }
      };

      $('open-chrome-btn').onclick = () => {
        const url = "intent://" + location.host + location.pathname + "#Intent;scheme=http;package=com.android.chrome;end";
        window.location.href = url;
      };

      $('copy-all-btn').onclick = () => {
        const text = $('res-text').textContent;
        if (!text) return;
        navigator.clipboard.writeText(text);
        toastFn('📋 تم النسخ');
      };

      $('open-res').onclick = () => {
        const text = $('res-text').textContent;
        if (text.startsWith('http')) window.open(text, '_blank');
        else window.open('https://www.google.com/search?q=' + encodeURIComponent(text), '_blank');
      };

      // السجل
      const saveHist = (t) => {
        let h = JSON.parse(localStorage.getItem('qr_history') || '[]');
        h.unshift({ t, d: new Date().toLocaleString('ar-EG') });
        h = h.slice(0, 10);
        localStorage.setItem('qr_history', JSON.stringify(h));
        renderHist();
      };

      const renderHist = () => {
        const h = JSON.parse(localStorage.getItem('qr_history') || '[]');
        $('hist-list').innerHTML = h.map(i => `
          <div class="hist-item" onclick="document.getElementById('res-text').textContent='${i.t}';document.getElementById('result-panel').classList.add('show');">
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%">${i.t}</span>
            <small style="color:var(--text-muted)">${i.d.split(' ')[1]}</small>
          </div>
        `).join('');
      };

      $('clear-hist').onclick = () => { localStorage.removeItem('qr_history'); renderHist(); };

      // الثيم والستايل
      $('theme-btn').onclick = () => {
        document.body.classList.toggle('style-dark');
        const isDark = document.body.classList.contains('style-dark');
        $('theme-btn').innerHTML = isDark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
      };

      $('style-btn').onclick = () => $('style-modal').classList.add('active');
      $('close-style').onclick = () => $('style-modal').classList.remove('active');
      
      document.querySelectorAll('.style-opt').forEach(opt => {
        opt.onclick = () => {
          document.querySelectorAll('.style-opt').forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
          document.body.className = document.body.className.replace(/style-\w+/g, '');
          if (opt.dataset.style) document.body.classList.add(opt.dataset.style);
        };
      });

      renderHist();
      startCam(camMode);
    });
  </script>
</body>
</html>
