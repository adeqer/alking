<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHYTHAM QR - ماسح الأكواد الاحترافي</title>
    <style>
        :root {
            --primary: #00d4ff;
            --secondary: #0099ff;
            --accent: #00ff88;
            --danger: #ff3366;
            --bg-dark: #0a0e27;
            --bg-card: #1a1f3a;
            --bg-light: #2a2f4a;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --border-color: rgba(0, 212, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a0033 50%, var(--bg-dark) 100%);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
        }

        .main-container {
            width: 100%;
            max-width: 700px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: rgba(26, 31, 58, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 100px rgba(0, 212, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .brand-title {
            font-size: 3.2rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(90deg, 
                #ff0080, #ff8c00, #40e0d0, #ff0080, 
                #0080ff, #ff0080, #00ff88, #ff0080);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbowShift 4s linear infinite;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }

        @keyframes rainbowShift {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
            margin-top: 8px;
        }

        .mode-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .mode-btn {
            padding: 10px 20px;
            border: 2px solid var(--border-color);
            background: rgba(0, 212, 255, 0.05);
            color: var(--text-secondary);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: var(--primary);
            color: var(--bg-dark);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        }

        .mode-btn:hover:not(.active) {
            border-color: var(--primary);
            background: rgba(0, 212, 255, 0.1);
        }

        .content-section {
            display: none;
            position: relative;
            z-index: 1;
        }

        .content-section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .camera-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 25px;
            border: 2px solid var(--primary);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }

        #cameraVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scan-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 70%;
            border: 3px solid var(--accent);
            border-radius: 16px;
            box-shadow: inset 0 0 0 2000px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            box-shadow: 0 0 20px var(--accent);
            animation: scanMove 2s linear infinite;
        }

        @keyframes scanMove {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 3px solid var(--primary);
        }

        .corner.top-left {
            top: -3px;
            left: -3px;
            border-right: none;
            border-bottom: none;
        }

        .corner.top-right {
            top: -3px;
            right: -3px;
            border-left: none;
            border-bottom: none;
        }

        .corner.bottom-left {
            bottom: -3px;
            left: -3px;
            border-right: none;
            border-top: none;
        }

        .corner.bottom-right {
            bottom: -3px;
            right: -3px;
            border-left: none;
            border-top: none;
        }

        .upload-zone {
            border: 3px dashed var(--primary);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            background: rgba(0, 212, 255, 0.05);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }

        .upload-zone:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }

        .upload-zone.dragover {
            background: rgba(0, 212, 255, 0.15);
            border-color: var(--accent);
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .upload-text {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .upload-subtext {
            font-size: 0.85rem;
            color: var(--text-secondary);
            opacity: 0.7;
        }

        #imageInput {
            display: none;
        }

        .preview-image {
            width: 100%;
            max-height: 400px;
            border-radius: 16px;
            margin-bottom: 20px;
            display: none;
            border: 2px solid var(--primary);
        }

        .preview-image.show {
            display: block;
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .btn {
            padding: 14px 20px;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.95rem;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transition: left 0.3s ease;
            z-index: -1;
        }

        .btn:hover::before {
            left: 0;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--bg-dark);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.5);
        }

        .btn-secondary {
            background: rgba(0, 212, 255, 0.1);
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-secondary:hover {
            background: rgba(0, 212, 255, 0.2);
            transform: translateY(-3px);
        }

        .btn-icon {
            width: 50px;
            height: 50px;
            padding: 0;
            border-radius: 12px;
            font-size: 1.3rem;
        }

        .result-box {
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 212, 255, 0.05);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .result-box.success {
            background: rgba(0, 255, 136, 0.1);
            border-color: var(--accent);
        }

        .result-box.error {
            background: rgba(255, 51, 102, 0.1);
            border-color: var(--danger);
        }

        .result-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .result-link {
            color: var(--primary);
            text-decoration: none;
            word-break: break-all;
            font-weight: 600;
        }

        .result-link:hover {
            text-decoration: underline;
            color: var(--accent);
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(0, 212, 255, 0.3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            position: relative;
            z-index: 1;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--bg-card);
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 15px 20px;
            color: var(--text-primary);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: slideInRight 0.3s ease;
            z-index: 1000;
            max-width: 300px;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 600px) {
            .card { padding: 25px; }
            .brand-title { font-size: 2.2rem; }
            .button-group { grid-template-columns: 1fr; }
            .mode-selector { flex-direction: column; }
            .mode-btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="card">
            <div class="header">
                <h1 class="brand-title">ALHYTHAM QR</h1>
                <p class="subtitle">ماسح الأكواد الاحترافي</p>
            </div>

            <div class="mode-selector">
                <button class="mode-btn active" onclick="switchMode('camera')">📷 الكاميرا</button>
                <button class="mode-btn" onclick="switchMode('upload')">📁 رفع صورة</button>
            </div>

            <!-- وضع الكاميرا -->
            <div id="cameraMode" class="content-section active">
                <div class="camera-wrapper">
                    <video id="cameraVideo" autoplay playsinline></video>
                    <div class="scan-frame">
                        <div class="scan-line"></div>
                        <div class="corner top-left"></div>
                        <div class="corner top-right"></div>
                        <div class="corner bottom-left"></div>
                        <div class="corner bottom-right"></div>
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn btn-primary" onclick="reloadCamera()">
                        <span>🔄</span> إعادة تحميل
                    </button>
                    <button class="btn btn-secondary btn-icon" id="cameraToggle" onclick="toggleCamera()" title="تبديل الكاميرا">
                        🔀
                    </button>
                </div>

                <div id="cameraResult" class="result-box">
                    <span class="result-text">جاهز للمسح...</span>
                </div>
            </div>

            <!-- وضع رفع الصور -->
            <div id="uploadMode" class="content-section">
                <div class="upload-zone" onclick="document.getElementById('imageInput').click()">
                    <div class="upload-icon">📸</div>
                    <div class="upload-text">اسحب صورة هنا أو انقر للاختيار</div>
                    <div class="upload-subtext">صيغ مدعومة: JPG, PNG, GIF, WebP</div>
                </div>

                <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)">

                <img id="previewImage" class="preview-image" alt="معاينة الصورة">

                <div id="uploadResult" class="result-box">
                    <span class="result-text">اختر صورة تحتوي على كود QR</span>
                </div>

                <div id="uploadLoading" class="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 10px;">جاري المسح...</p>
                </div>

                <div class="button-group" style="margin-top: 20px;">
                    <button class="btn btn-primary" onclick="document.getElementById('imageInput').click()">
                        <span>📁</span> اختر صورة
                    </button>
                    <button class="btn btn-secondary" onclick="resetUpload()">
                        <span>🗑️</span> مسح
                    </button>
                </div>
            </div>

            <div class="footer">
                ALHYTHAM QR © 2026 | ماسح أكواد احترافي
            </div>
        </div>
    </div>

    <canvas id="qrCanvas" style="display:none;"></canvas>

    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script>
        let codeReader = null;
        let currentStream = null;
        let facingMode = 'environment';
        let isScanning = false;

        // تهيئة مكتبة ZXing
        function initZXing() {
            if (!codeReader) {
                codeReader = new ZXing.BrowserQRCodeReader();
            }
        }

        // بدء الكاميرا
        async function startCamera() {
            try {
                initZXing();
                const video = document.getElementById('cameraVideo');
                const constraints = {
                    video: { facingMode: facingMode },
                    audio: false
                };

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                currentStream = stream;
                video.srcObject = stream;

                // بدء المسح
                startScanning();
                showNotification('تم تشغيل الكاميرا بنجاح', 'success');
            } catch (error) {
                showResult('cameraResult', 'خطأ: ' + error.message, 'error');
                showNotification('فشل الوصول للكاميرا', 'error');
            }
        }

        // بدء عملية المسح
        function startScanning() {
            if (isScanning) return;
            isScanning = true;

            const video = document.getElementById('cameraVideo');
            const canvas = document.getElementById('qrCanvas');
            const ctx = canvas.getContext('2d');

            function scan() {
                if (!isScanning || !video.srcObject) return;

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                if (canvas.width && canvas.height) {
                    ctx.drawImage(video, 0, 0);

                    try {
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const luminanceSource = new ZXing.HTMLCanvasElementLuminanceSource(canvas);
                        const binaryBitmap = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(luminanceSource));
                        const result = new ZXing.MultiFormatReader().decode(binaryBitmap);

                        if (result) {
                            handleQRDetected(result.text);
                            return;
                        }
                    } catch (e) {
                        // لا توجد نتيجة في هذا الإطار
                    }
                }

                requestAnimationFrame(scan);
            }

            scan();
        }

        // إيقاف المسح
        function stopScanning() {
            isScanning = false;
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
        }

        // تبديل الكاميرا
        async function toggleCamera() {
            stopScanning();
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            await startCamera();
            showNotification(facingMode === 'environment' ? 'الكاميرا الخلفية' : 'الكاميرا الأمامية', 'info');
        }

        // إعادة تحميل الكاميرا
        async function reloadCamera() {
            stopScanning();
            await startCamera();
        }

        // التبديل بين الأوضاع
        function switchMode(mode) {
            document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.mode-btn').forEach(el => el.classList.remove('active'));

            if (mode === 'camera') {
                document.getElementById('cameraMode').classList.add('active');
                document.querySelector('[onclick="switchMode(\'camera\')"]').classList.add('active');
                stopScanning();
                startCamera();
            } else {
                document.getElementById('uploadMode').classList.add('active');
                document.querySelector('[onclick="switchMode(\'upload\')"]').classList.add('active');
                stopScanning();
            }
        }

        // معالجة رفع الصور
        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                const img = new Image();
                img.onload = async () => {
                    const preview = document.getElementById('previewImage');
                    preview.src = img.src;
                    preview.classList.add('show');

                    showLoading(true);
                    await decodeImageQR(img);
                    showLoading(false);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // فك تشفير QR من الصورة
        async function decodeImageQR(img) {
            try {
                initZXing();
                const canvas = document.getElementById('qrCanvas');
                const ctx = canvas.getContext('2d');

                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);

                const luminanceSource = new ZXing.HTMLCanvasElementLuminanceSource(canvas);
                const binaryBitmap = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(luminanceSource));
                const result = new ZXing.MultiFormatReader().decode(binaryBitmap);

                if (result) {
                    handleQRDetected(result.text, 'upload');
                } else {
                    showResult('uploadResult', 'لم يتم العثور على كود QR في الصورة', 'error');
                }
            } catch (error) {
                showResult('uploadResult', 'خطأ في مسح الصورة: ' + error.message, 'error');
            }
        }

        // معالجة الكود المكتشف
        function handleQRDetected(data, mode = 'camera') {
            const resultId = mode === 'camera' ? 'cameraResult' : 'uploadResult';
            
            if (data.startsWith('http://') || data.startsWith('https://')) {
                showResult(resultId, `<a href="${data}" target="_blank" class="result-link">${data}</a>`, 'success');
                showNotification('تم العثور على رابط!', 'success');
                
                // فتح الرابط تلقائياً بعد ثانية
                setTimeout(() => {
                    window.open(data, '_blank');
                }, 500);
            } else {
                showResult(resultId, `<span class="result-link">${data}</span>`, 'success');
                showNotification('تم قراءة الكود بنجاح!', 'success');
            }

            if (mode === 'camera') {
                stopScanning();
                setTimeout(() => startScanning(), 2000);
            }
        }

        // إعادة تعيين وضع الرفع
        function resetUpload() {
            document.getElementById('imageInput').value = '';
            document.getElementById('previewImage').classList.remove('show');
            showResult('uploadResult', 'اختر صورة تحتوي على كود QR', 'default');
        }

        // عرض النتيجة
        function showResult(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<span class="result-text">${message}</span>`;
            element.classList.remove('success', 'error');
            if (type !== 'default') {
                element.classList.add(type);
            }
        }

        // عرض التحميل
        function showLoading(show) {
            document.getElementById('uploadLoading').style.display = show ? 'block' : 'none';
        }

        // عرض الإشعارات
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            notification.style.borderColor = type === 'error' ? 'var(--danger)' : 'var(--primary)';
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.animation = 'slideInRight 0.3s ease reverse';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // دعم السحب والإفلات
        const uploadZone = document.querySelector('.upload-zone');
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                document.getElementById('imageInput').files = files;
                handleImageUpload({ target: { files: files } });
            }
        });

        // بدء التطبيق
        window.addEventListener('load', () => {
            initZXing();
            startCamera();
        });

        // إيقاف الكاميرا عند إغلاق الصفحة
        window.addEventListener('beforeunload', () => {
            stopScanning();
        });
    </script>
</body>
</html>
