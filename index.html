<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ALHYTHAM QR</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Cairo', sans-serif;
            overflow: hidden;
            position: fixed;
        }

        #video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        #canvas {
            display: none;
        }

        .ui {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .header {
            padding: 30px 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            text-align: center;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            color: #a855f7;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(168,85,247,0.6);
            margin: 0;
        }

        .subtitle {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .scanner {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .frame {
            width: 280px;
            height: 280px;
            border: 2px solid rgba(168,85,247,0.5);
            border-radius: 20px;
            position: relative;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
        }

        .corner {
            position: absolute;
            width: 35px;
            height: 35px;
            border: 3px solid #a855f7;
        }

        .corner.tl {
            top: -8px;
            left: -8px;
            border-right: none;
            border-bottom: none;
            border-radius: 8px 0 0 0;
        }

        .corner.tr {
            top: -8px;
            right: -8px;
            border-left: none;
            border-bottom: none;
            border-radius: 0 8px 0 0;
        }

        .corner.bl {
            bottom: -8px;
            left: -8px;
            border-right: none;
            border-top: none;
            border-radius: 0 0 0 8px;
        }

        .corner.br {
            bottom: -8px;
            right: -8px;
            border-left: none;
            border-top: none;
            border-radius: 0 0 8px 0;
        }

        .line {
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 3px;
            background: #a855f7;
            box-shadow: 0 0 20px #a855f7;
            animation: scan 2s ease-in-out infinite;
        }

        @keyframes scan {
            0%, 100% { top: 10%; opacity: 0.3; }
            50% { top: 90%; opacity: 1; }
        }

        .footer {
            padding: 30px 20px;
            background: linear-gradient(0deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            display: flex;
            justify-content: center;
            gap: 15px;
            pointer-events: auto;
        }

        .btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:active {
            background: #a855f7;
            transform: scale(0.9);
        }

        #loading {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status {
            color: #a855f7;
            font-weight: 600;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

<video id="video" playsinline></video>
<canvas id="canvas"></canvas>

<div class="ui">
    <div class="header">
        <h1 class="title">ALHYTHAM QR</h1>
        <p class="subtitle">الماسح الضوئي الاحترافي</p>
    </div>

    <div class="scanner">
        <div class="frame">
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>
            <div class="line"></div>
        </div>
    </div>

    <div class="footer">
        <button class="btn" onclick="location.reload()" title="تحديث">
            ↻
        </button>
        <button class="btn" onclick="document.getElementById('fileInput').click()" title="صورة">
            🖼️
        </button>
    </div>
</div>

<div id="loading">
    <div class="spinner"></div>
    <p class="status">جاري تشغيل الكاميرا...</p>
</div>

<input type="file" id="fileInput" accept="image/*" onchange="scanImage(event)">

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const loading = document.getElementById('loading');
    let isScanning = true;

    async function init() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
            });

            video.srcObject = stream;
            video.onloadedmetadata = () => {
                video.play();
                loading.style.display = 'none';
                startScanning();
            };
        } catch (err) {
            loading.innerHTML = '<p class="status">❌ خطأ: تحقق من إذن الكاميرا</p>';
        }
    }

    function startScanning() {
        if (!isScanning) return;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);

        if (code) {
            handleSuccess(code.data);
            return;
        }

        requestAnimationFrame(startScanning);
    }

    function handleSuccess(result) {
        isScanning = false;
        
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

        const isUrl = /^(https?:\/\/|www\.|[a-z0-9-]+\.[a-z]{2,})/i.test(result);

        if (isUrl) {
            const url = result.startsWith('http') ? result : (result.startsWith('www') ? 'https://' + result : 'https://' + result);
            window.location.href = url;
        } else {
            alert('النتيجة:\n' + result);
            isScanning = true;
            startScanning();
        }
    }

    function scanImage(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);
                
                if (code) {
                    handleSuccess(code.data);
                } else {
                    alert('لم يتم العثور على رمز QR');
                }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
