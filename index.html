<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHYTHAM QR - ماسح رمز الاستجابة السريعة</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- HTML5 QR Code Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- jsQR Library for image scanning -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #a855f7;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #22d3ee;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent),
                              radial-gradient(circle at bottom left, rgba(168, 85, 247, 0.15), transparent);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.8s ease-out;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        main {
            width: 100%;
            max-width: 600px;
            animation: fadeInUp 0.8s ease-out;
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            background: rgba(15, 23, 42, 0.5);
            padding: 6px;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .scanner-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(99, 102, 241, 0.2);
        }

        #reader {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
        }

        #reader video {
            object-fit: cover !important;
        }

        .upload-area {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 300px;
            border: 2px dashed rgba(99, 102, 241, 0.3);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .upload-area i {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            min-width: 140px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn:active {
            transform: translateY(0);
        }

        .result-card {
            display: none;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            animation: slideIn 0.5s ease-out;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .result-label {
            font-weight: 700;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #result-text {
            word-break: break-all;
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .result-actions {
            display: flex;
            gap: 10px;
        }

        footer {
            margin-top: auto;
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
            .card { padding: 16px; }
            .btn { font-size: 0.9rem; padding: 10px 15px; }
        }

        /* Scan line animation */
        .scanner-container::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
            animation: scan 3s infinite linear;
            z-index: 10;
            display: none;
        }

        .scanning.scanner-container::after {
            display: block;
        }

        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }

        canvas#qr-canvas {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-icon">
                <i data-lucide="qr-code" color="white"></i>
            </div>
            <h1>ALHYTHAM QR</h1>
        </div>
        <p class="subtitle">مسح ضوئي سريع، آمن، واحترافي</p>
    </header>

    <main>
        <div class="card">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('camera')">
                    <i data-lucide="camera" size="18"></i>
                    الكاميرا
                </button>
                <button class="tab-btn" onclick="switchTab('upload')">
                    <i data-lucide="image" size="18"></i>
                    رفع صورة
                </button>
            </div>

            <div id="camera-section">
                <div id="scanner-wrapper" class="scanner-container scanning">
                    <div id="reader"></div>
                </div>
                
                <div class="controls">
                    <button class="btn btn-secondary" onclick="reloadCamera()">
                        <i data-lucide="refresh-cw" size="18"></i>
                        إعادة تحميل
                    </button>
                    <button class="btn btn-secondary" id="switch-camera-btn" onclick="switchCamera()">
                        <i data-lucide="flip-horizontal" size="18"></i>
                        تبديل الكاميرا
                    </button>
                </div>
            </div>

            <div id="upload-section" style="display: none;">
                <div class="upload-area" onclick="document.getElementById('file-input').click()">
                    <i data-lucide="upload-cloud"></i>
                    <p>اضغط هنا أو اسحب الصورة للمسح</p>
                    <span style="font-size: 0.8rem; color: var(--text-muted); margin-top: 10px;">يدعم PNG, JPG, JPEG</span>
                </div>
                <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="scanImage(this)">
                <canvas id="qr-canvas"></canvas>
            </div>

            <div id="result-container" class="result-card">
                <div class="result-header">
                    <span class="result-label">
                        <i data-lucide="check-circle" size="18"></i>
                        تم العثور على نتيجة:
                    </span>
                </div>
                <div id="result-text"></div>
                <div class="result-actions">
                    <button class="btn btn-primary" onclick="copyResult()">
                        <i data-lucide="copy" size="18"></i>
                        نسخ
                    </button>
                    <a id="open-link-btn" href="#" target="_blank" class="btn btn-secondary" style="display: none;">
                        <i data-lucide="external-link" size="18"></i>
                        فتح الرابط
                    </a>
                </div>
            </div>

            <div class="controls" style="margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
                <button class="btn btn-secondary" onclick="openInChrome()" style="width: 100%; flex: none;">
                    <i data-lucide="chrome" size="18"></i>
                    Open in Chrome
                </button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ALHYTHAM QR. جميع الحقوق محفوظة.</p>
    </footer>

    <script>
        // Initialize Icons
        lucide.createIcons();

        let html5QrCode;
        let currentFacingMode = "environment";
        const resultContainer = document.getElementById('result-container');
        const resultText = document.getElementById('result-text');
        const openLinkBtn = document.getElementById('open-link-btn');

        // Tab Switching
        function switchTab(tab) {
            const camBtn = document.querySelector('.tab-btn:nth-child(1)');
            const uploadBtn = document.querySelector('.tab-btn:nth-child(2)');
            const camSection = document.getElementById('camera-section');
            const uploadSection = document.getElementById('upload-section');

            if (tab === 'camera') {
                camBtn.classList.add('active');
                uploadBtn.classList.remove('active');
                camSection.style.display = 'block';
                uploadSection.style.display = 'none';
                startCamera();
            } else {
                uploadBtn.classList.add('active');
                camBtn.classList.remove('active');
                uploadSection.style.display = 'block';
                camSection.style.display = 'none';
                stopCamera();
            }
        }

        // Camera Logic
        async function startCamera() {
            if (html5QrCode) {
                await html5QrCode.stop().catch(() => {});
            }
            
            html5QrCode = new Html5Qrcode("reader");
            // إعدادات الدقة العالية
            const config = { 
                fps: 20, 
                qrbox: { width: 280, height: 280 },
                aspectRatio: 1.0,
                videoConstraints: {
                    facingMode: currentFacingMode,
                    width: { ideal: 1280 },
                    height: { ideal: 720 },
                    frameRate: { ideal: 30 }
                }
            };
            
            try {
                await html5QrCode.start(
                    { facingMode: currentFacingMode }, 
                    config, 
                    onScanSuccess
                );
                document.getElementById('scanner-wrapper').classList.add('scanning');
            } catch (err) {
                console.error("Error starting camera", err);
                alert("تعذر الوصول إلى الكاميرا. يرجى التأكد من منح الصلاحيات.");
            }
        }

        async function stopCamera() {
            if (html5QrCode && html5QrCode.isScanning) {
                await html5QrCode.stop();
                document.getElementById('scanner-wrapper').classList.remove('scanning');
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            handleResult(decodedText);
            // Vibrate if supported
            if (navigator.vibrate) navigator.vibrate(100);
        }

        function handleResult(text) {
            resultContainer.style.display = 'block';
            resultText.innerText = text;
            
            // Check if URL
            if (text.startsWith('http://') || text.startsWith('https://')) {
                openLinkBtn.style.display = 'flex';
                openLinkBtn.href = text;
            } else {
                openLinkBtn.style.display = 'none';
            }
            
            // Scroll to result
            resultContainer.scrollIntoView({ behavior: 'smooth' });
        }

        function reloadCamera() {
            startCamera();
        }

        function switchCamera() {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            startCamera();
        }

        // Image Scanning Logic (using jsQR)
        function scanImage(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.getElementById('qr-canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0, img.width, img.height);
                        
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const code = jsQR(imageData.data, imageData.width, imageData.height);
                        
                        if (code) {
                            handleResult(code.data);
                        } else {
                            alert("لم يتم العثور على رمز QR في هذه الصورة.");
                        }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // Utilities
        function copyResult() {
            const text = resultText.innerText;
            navigator.clipboard.writeText(text).then(() => {
                const copyBtn = document.querySelector('.result-actions .btn-primary');
                const originalContent = copyBtn.innerHTML;
                copyBtn.innerHTML = '<i data-lucide="check" size="18"></i> تم النسخ';
                lucide.createIcons();
                setTimeout(() => {
                    copyBtn.innerHTML = originalContent;
                    lucide.createIcons();
                }, 2000);
            });
        }

        function openInChrome() {
            const url = window.location.href;
            if (navigator.userAgent.match(/iPhone|iPad|iPod/i)) {
                window.location.href = `googlechrome://${url.split('://')[1]}`;
            } else {
                window.location.href = `intent://${url.split('://')[1]}#Intent;scheme=https;package=com.android.chrome;end`;
            }
        }

        // Start camera on load
        window.addEventListener('load', () => {
            startCamera();
        });
    </script>
</body>
</html>
