<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta http-equiv="Content-type" content="text/html;charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="description" content="ALHYTHAM QR Code Scanner - تطبيق متقدم لمسح رموز QR">
  
  <title>ALHYTHAM QR CODE SCANNER</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #00d4ff 0%, #0099ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .header p {
      font-size: 0.95rem;
      color: #b0b0b0;
      font-weight: 300;
    }

    .camera-section {
      margin: 30px 0;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 212, 255, 0.2);
      background: #000000;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100% !important;
      height: auto !important;
      display: block;
      max-height: 400px;
    }

    canvas {
      display: none;
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 25px;
    }

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      outline: none;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00d4ff 0%, #0099ff 100%);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #00d4ff;
      border: 2px solid #00d4ff;
    }

    .btn-secondary:hover {
      background: rgba(0, 212, 255, 0.1);
      transform: translateY(-2px);
    }

    .btn-secondary:active {
      transform: translateY(0);
    }

    .icon {
      font-size: 1.2rem;
    }

    .result-box {
      background: rgba(0, 212, 255, 0.1);
      border: 2px solid #00d4ff;
      border-radius: 10px;
      padding: 15px;
      margin-top: 20px;
      display: none;
      animation: slideIn 0.3s ease;
    }

    .result-box.show {
      display: block;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-box h3 {
      color: #00d4ff;
      margin-bottom: 10px;
      font-size: 1.1rem;
    }

    .result-box p {
      word-break: break-all;
      color: #e0e0e0;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.9rem;
      color: #808080;
    }

    .footer a {
      color: #00d4ff;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .footer a:hover {
      color: #0099ff;
      text-decoration: underline;
    }

    .status-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #00d4ff;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    .error-message {
      background: rgba(255, 100, 100, 0.1);
      border: 2px solid #ff6464;
      border-radius: 10px;
      padding: 15px;
      margin-top: 20px;
      display: none;
      color: #ff6464;
      animation: slideIn 0.3s ease;
    }

    .error-message.show {
      display: block;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }

      .header h1 {
        font-size: 2rem;
      }

      .button-group {
        grid-template-columns: 1fr;
      }

      .btn {
        width: 100%;
      }
    }

    .loading {
      text-align: center;
      color: #00d4ff;
      margin-top: 20px;
      display: none;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      border: 3px solid rgba(0, 212, 255, 0.2);
      border-top: 3px solid #00d4ff;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .camera {
      width: 95%;
    }

    @font-face {
      font-family: 'fontello';
      src: url('./font/fontello.eot?14907215');
      src: url('./font/fontello.eot?14907215#iefix') format('embedded-opentype'),
           url('./font/fontello.woff?14907215') format('woff'),
           url('./font/fontello.ttf?14907215') format('truetype'),
           url('./font/fontello.svg?14907215#fontello') format('svg');
      font-weight: normal;
      font-style: normal;
    }

    .icon-fontello {
      font-family: "fontello";
      font-style: normal;
      font-weight: normal;
      speak: none;
      display: inline-block;
      text-decoration: inherit;
      width: 1em;
      margin-right: .2em;
      text-align: center;
      font-variant: normal;
      text-transform: none;
      line-height: 1em;
      margin-left: .2em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>

  <script type="text/javascript" src="llqrcode.js"></script>
  <script type="text/javascript" src="mikhmon_webqr.js?v1"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔍 ALHYTHAM QR</h1>
      <p>تطبيق متقدم لمسح رموز QR بسهولة وسرعة</p>
    </div>

    <div class="camera-section camera" id="outdiv"></div>

    <div class="button-group">
      <button class="btn btn-primary" id="reload" onclick="location.reload();">
        <span class="icon">🔄</span>
        <span>إعادة تحميل الكاميرا</span>
      </button>
      <a class="btn btn-secondary" href="intent://alhytham-qr.app#Intent;scheme=https;package=com.android.chrome;end" id="chromeBtn">
        <span class="icon">📱</span>
        <span>فتح في Chrome</span>
      </a>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>جاري تحميل الكاميرا...</p>
    </div>

    <div class="error-message" id="errorMessage"></div>

    <div class="result-box" id="resultBox">
      <h3>✓ تم قراءة الرمز</h3>
      <p id="resultText"></p>
    </div>
  </div>

  <div class="footer">
    <p><span class="status-indicator"></span>ALHYTHAM QR CODE SCANNER</p>
    <p>تم تطويره بواسطة <a href="#">ALHYTHAM</a> | مدعوم من <a href="http://www.webqr.com">webqr.com</a></p>
  </div>

  <canvas style="display:none;" id="qr-canvas" width="800" height="600"></canvas>

  <script type="text/javascript">
    // تهيئة الماسح عند تحميل الصفحة
    function initializeScanner() {
      const loading = document.getElementById('loading');
      loading.classList.add('show');
      
      // استدعاء دالة التحميل من mikhmon_webqr.js
      try {
        if (typeof load === 'function') {
          load();
        }
        setTimeout(() => {
          loading.classList.remove('show');
        }, 2000);
      } catch (error) {
        console.error('خطأ في تهيئة الماسح:', error);
        loading.classList.remove('show');
      }
    }

    // تحميل الماسح عند فتح الصفحة
    window.addEventListener('load', initializeScanner);

    // دالة لعرض النتائج
    function showResult(text) {
      const resultBox = document.getElementById('resultBox');
      const resultText = document.getElementById('resultText');
      resultText.textContent = text;
      resultBox.classList.add('show');
    }

    // دالة لعرض الأخطاء
    function showError(message) {
      const errorBox = document.getElementById('errorMessage');
      errorBox.textContent = message;
      errorBox.classList.add('show');
      setTimeout(() => {
        errorBox.classList.remove('show');
      }, 5000);
    }
  </script>
</body>
</html>
