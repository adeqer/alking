<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALHYTHAM QR - Dark Neon Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-purple: #a855f7;
            --neon-purple-light: #c084fc;
            --neon-gold: #fbbf24;
            --neon-gold-dark: #f59e0b;
            --dark-bg: #0a0a0f;
            --dark-secondary: #1a1a2e;
            --dark-tertiary: #16213e;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border-purple: rgba(168, 85, 247, 0.5);
            --border-gold: rgba(251, 191, 36, 0.6);
            --glow-purple: 0 0 20px rgba(168, 85, 247, 0.6);
            --glow-gold: 0 0 15px rgba(251, 191, 36, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Poppins', 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a0a2e 50%, var(--dark-secondary) 100%);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .app-wrapper {
            width: 100%;
            height: 100%;
            max-width: 500px;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--dark-secondary);
            border-radius: 40px;
            border: 2px solid var(--border-purple);
            box-shadow: var(--glow-purple), 0 25px 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
        }

        .app-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 0%, rgba(168, 85, 247, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .header-bar {
            padding: 16px 20px;
            background: linear-gradient(180deg, rgba(168, 85, 247, 0.15) 0%, transparent 100%);
            border-bottom: 1px solid var(--border-purple);
            text-align: center;
        }

        .app-title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--neon-purple-light) 0%, var(--neon-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.4));
            margin-bottom: 4px;
        }

        .app-subtitle {
            font-size: 11px;
            color: var(--text-secondary);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .tabs-bar {
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            background: rgba(26, 26, 46, 0.8);
            border-bottom: 1px solid var(--border-purple);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .tab-btn {
            flex-shrink: 0;
            padding: 8px 16px;
            background: transparent;
            border: 1.5px solid var(--border-purple);
            color: var(--text-secondary);
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
            font-family: 'Poppins', sans-serif;
        }

        .tab-btn:hover {
            border-color: var(--neon-purple);
            color: var(--neon-purple-light);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--neon-purple) 0%, var(--neon-purple-light) 100%);
            border-color: var(--neon-purple-light);
            color: white;
            box-shadow: var(--glow-purple);
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .content-section {
            display: none;
            flex: 1;
            width: 100%;
        }

        .content-section.active {
            display: flex;
            flex-direction: column;
        }

        .camera-box {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 2px solid var(--border-purple);
            box-shadow: var(--glow-purple);
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .scanner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .scan-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75%;
            height: 75%;
            border: 2px solid var(--neon-purple);
            border-radius: 20px;
            box-shadow: inset 0 0 0 1000px rgba(0, 0, 0, 0.4), var(--glow-purple);
        }

        .scan-corner {
            position: absolute;
            width: 35px;
            height: 35px;
            border: 3px solid var(--neon-purple-light);
        }

        .scan-corner.top-left {
            top: -8px;
            left: -8px;
            border-right: none;
            border-bottom: none;
            border-radius: 10px 0 0 0;
        }

        .scan-corner.top-right {
            top: -8px;
            right: -8px;
            border-left: none;
            border-bottom: none;
            border-radius: 0 10px 0 0;
        }

        .scan-corner.bottom-left {
            bottom: -8px;
            left: -8px;
            border-right: none;
            border-top: none;
            border-radius: 0 0 0 10px;
        }

        .scan-corner.bottom-right {
            bottom: -8px;
            right: -8px;
            border-left: none;
            border-top: none;
            border-radius: 0 0 10px 0;
        }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-purple-light), transparent);
            box-shadow: var(--glow-purple);
            top: 0;
            animation: scannerMove 2.5s infinite ease-in-out;
        }

        @keyframes scannerMove {
            0%, 100% { top: 5%; opacity: 0.3; }
            50% { top: 95%; opacity: 1; }
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .control-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px 10px;
            background: rgba(26, 26, 46, 0.6);
            border: 1.5px solid var(--border-purple);
            border-radius: 18px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 11px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
        }

        .control-btn:active {
            transform: scale(0.92);
        }

        .control-btn:hover {
            background: rgba(168, 85, 247, 0.1);
            border-color: var(--neon-purple-light);
            color: var(--neon-purple-light);
            box-shadow: var(--glow-purple);
        }

        .control-btn.active {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.3) 0%, rgba(192, 132, 252, 0.2) 100%);
            border-color: var(--neon-purple-light);
            color: var(--neon-purple-light);
            box-shadow: var(--glow-purple);
        }

        .control-icon {
            font-size: 24px;
        }

        .zoom-box {
            background: rgba(26, 26, 46, 0.6);
            border: 1.5px solid var(--border-purple);
            border-radius: 18px;
            padding: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .zoom-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .zoom-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 5px;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--neon-purple) 0%, var(--neon-gold) 100%);
            outline: none;
            cursor: pointer;
        }

        .zoom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
            border: 2px solid var(--neon-purple);
        }

        .zoom-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
            border: 2px solid var(--neon-purple);
        }

        .zoom-value {
            font-size: 12px;
            color: var(--neon-purple-light);
            font-weight: 700;
            min-width: 40px;
            text-align: right;
        }

        .result-box {
            background: rgba(26, 26, 46, 0.6);
            border: 1.5px solid var(--border-purple);
            border-radius: 18px;
            padding: 18px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            word-break: break-all;
            transition: all 0.3s ease;
        }

        .result-box.success {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.5);
            color: #10b981;
        }

        .result-box.error {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.5);
            color: #ef4444;
        }

        .result-content {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .result-badge {
            display: inline-block;
            padding: 5px 14px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.3) 0%, rgba(251, 191, 36, 0.2) 100%);
            border: 1px solid var(--border-purple);
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
            color: var(--neon-purple-light);
            width: fit-content;
            margin: 0 auto;
        }

        .result-text {
            font-size: 13px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .result-link {
            color: var(--neon-purple-light);
            text-decoration: none;
            font-weight: 600;
        }

        .result-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
        }

        .action-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, var(--neon-purple) 0%, var(--neon-purple-light) 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            box-shadow: var(--glow-purple);
        }

        .action-btn:hover {
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.8);
            transform: translateY(-2px);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            background: rgba(26, 26, 46, 0.6);
            border: 1px solid var(--border-purple);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .history-item:hover {
            background: rgba(168, 85, 247, 0.1);
            border-color: var(--neon-purple-light);
        }

        .history-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .history-time {
            font-size: 10px;
            color: var(--text-tertiary);
        }

        .history-text {
            font-size: 12px;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-link {
            color: var(--neon-purple-light);
            text-decoration: none;
        }

        .history-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 16px;
            padding: 8px;
            transition: color 0.3s ease;
        }

        .history-btn:hover {
            color: var(--neon-purple-light);
        }

        .upload-area {
            border: 2px dashed var(--border-purple);
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(168, 85, 247, 0.05);
        }

        .upload-area:hover {
            border-color: var(--neon-purple-light);
            background: rgba(168, 85, 247, 0.1);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .upload-text {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .upload-hint {
            font-size: 11px;
            color: var(--text-tertiary);
        }

        .footer-text {
            padding: 16px;
            border-top: 1px solid var(--border-purple);
            text-align: center;
            font-size: 10px;
            color: var(--text-tertiary);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(150px);
            background: linear-gradient(135deg, var(--neon-purple) 0%, var(--neon-purple-light) 100%);
            border: 1px solid var(--border-purple);
            border-radius: 14px;
            padding: 12px 24px;
            color: white;
            font-size: 12px;
            font-weight: 600;
            box-shadow: var(--glow-purple);
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .content-area::-webkit-scrollbar {
            width: 6px;
        }

        .content-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .content-area::-webkit-scrollbar-thumb {
            background: var(--border-purple);
            border-radius: 3px;
        }

        .content-area::-webkit-scrollbar-thumb:hover {
            background: var(--neon-purple);
        }

        @media (max-width: 480px) {
            .app-wrapper {
                border-radius: 30px;
            }

            .app-title {
                font-size: 28px;
            }

            .camera-box {
                aspect-ratio: 9/10;
            }

            .controls-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .empty-state {
            text-align: center;
            color: var(--text-tertiary);
            padding: 40px 20px;
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <div class="header-bar">
            <div class="app-title">ALHYTHAM QR</div>
            <div class="app-subtitle">Premium QR Scanner</div>
        </div>

        <div class="tabs-bar">
            <button class="tab-btn active" onclick="switchTab('scan')">📡 مسح</button>
            <button class="tab-btn" onclick="switchTab('history')">📋 السجل</button>
            <button class="tab-btn" onclick="switchTab('upload')">📤 رفع</button>
        </div>

        <div class="content-area">
            <!-- Scan Section -->
            <div id="scan-section" class="content-section active">
                <div class="camera-box">
                    <video id="video" playsinline autoplay></video>
                    <div class="scanner-overlay">
                        <div class="scan-frame">
                            <div class="scan-corner top-left"></div>
                            <div class="scan-corner top-right"></div>
                            <div class="scan-corner bottom-left"></div>
                            <div class="scan-corner bottom-right"></div>
                            <div class="scan-line"></div>
                        </div>
                    </div>
                </div>

                <div class="zoom-box">
                    <span class="zoom-label">🔍</span>
                    <input type="range" id="zoomSlider" class="zoom-slider" min="1" max="5" step="0.1" value="1" oninput="updateZoom(this.value)">
                    <span class="zoom-value" id="zoomValue">1.0x</span>
                </div>

                <div class="controls-grid">
                    <button class="control-btn" id="torchBtn" onclick="toggleTorch()">
                        <span class="control-icon">💡</span>
                        <span>فلاش</span>
                    </button>
                    <button class="control-btn" onclick="toggleCamera()">
                        <span class="control-icon">🔄</span>
                        <span>تبديل</span>
                    </button>
                    <button class="control-btn" onclick="restartScanner()">
                        <span class="control-icon">♻️</span>
                        <span>تحديث</span>
                    </button>
                </div>

                <div id="result" class="result-box">
                    جاري البحث عن أكواد QR...
                </div>
            </div>

            <!-- History Section -->
            <div id="history-section" class="content-section">
                <div class="history-list" id="historyList">
                    <div class="empty-state">السجل فارغ</div>
                </div>
                <button class="control-btn" style="width: 100%; margin-top: auto;" onclick="clearHistory()">
                    <span class="control-icon">🗑️</span>
                    <span>مسح السجل</span>
                </button>
            </div>

            <!-- Upload Section -->
            <div id="upload-section" class="content-section">
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-icon">📸</div>
                    <div class="upload-text">اختر صورة تحتوي على كود QR</div>
                    <div class="upload-hint">اسحب أو انقر للاختيار</div>
                </div>
                <input type="file" id="fileInput" style="display: none;" accept="image/*" onchange="handleFileUpload(event)">
                <div id="uploadResult" class="result-box" style="margin-top: 20px;">
                    انتظار اختيار ملف...
                </div>
            </div>
        </div>

        <div class="footer-text">
            ALHYTHAM QR © 2026 | PROFESSIONAL SCANNER
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <canvas id="canvas" style="display:none;"></canvas>

    <script src="https://unpkg.com/@zxing/library@latest"></script>

    <script>
        const video = document.getElementById('video');
        const resultPanel = document.getElementById('result');
        const zoomSlider = document.getElementById('zoomSlider');
        const zoomValue = document.getElementById('zoomValue');
        const torchBtn = document.getElementById('torchBtn');
        const historyList = document.getElementById('historyList');
        const toast = document.getElementById('toast');

        let codeReader = new ZXing.BrowserQRCodeReader();
        let currentStream = null;
        let selectedDeviceId = null;
        let isTorchOn = false;
        let isScanning = true;
        let history = JSON.parse(localStorage.getItem('qr_history') || '[]');

        async function initCamera() {
            try {
                const devices = await codeReader.listVideoInputDevices();
                const backCamera = devices.find(d => d.label.toLowerCase().includes('back')) || devices[devices.length - 1];
                selectedDeviceId = backCamera.deviceId;
                startScanning();
            } catch (err) {
                showResult('خطأ: ' + err.message, 'error');
            }
        }

        async function startScanning() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                const constraints = {
                    video: {
                        deviceId: selectedDeviceId ? { exact: selectedDeviceId } : undefined,
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        facingMode: 'environment'
                    }
                };

                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;

                const hints = new Map();
                hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
                hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.QR_CODE]);

                isScanning = true;
                codeReader.decodeFromVideoDevice(selectedDeviceId, 'video', (result, err) => {
                    if (result && isScanning) {
                        onScanSuccess(result.text);
                    }
                }, hints);

                setTimeout(checkCapabilities, 1000);
            } catch (err) {
                showResult('خطأ في الوصول للكاميرا', 'error');
            }
        }

        function checkCapabilities() {
            const track = currentStream.getVideoTracks()[0];
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};

            if (!capabilities.torch) {
                torchBtn.style.opacity = '0.5';
                torchBtn.disabled = true;
            }
        }

        function updateZoom(val) {
            zoomValue.textContent = parseFloat(val).toFixed(1) + 'x';
            const track = currentStream.getVideoTracks()[0];

            if (track.getCapabilities().zoom) {
                track.applyConstraints({ advanced: [{ zoom: val }] });
            } else {
                video.style.transform = `scale(${val})`;
            }
        }

        async function toggleTorch() {
            const track = currentStream.getVideoTracks()[0];
            isTorchOn = !isTorchOn;
            try {
                await track.applyConstraints({ advanced: [{ torch: isTorchOn }] });
                torchBtn.classList.toggle('active');
                showToast(isTorchOn ? 'الفلاش مُفعّل' : 'الفلاش مُطفأ');
            } catch (e) {
                showToast('الفلاش غير متاح');
            }
        }

        async function toggleCamera() {
            isScanning = false;
            const devices = await codeReader.listVideoInputDevices();
            const currentIndex = devices.findIndex(d => d.deviceId === selectedDeviceId);
            const nextIndex = (currentIndex + 1) % devices.length;
            selectedDeviceId = devices[nextIndex].deviceId;
            startScanning();
            showToast('تم تبديل الكاميرا');
        }

        function restartScanner() {
            isScanning = false;
            startScanning();
            showToast('تم تحديث الماسح');
        }

        function onScanSuccess(text) {
            if (navigator.vibrate) navigator.vibrate(100);
            playBeep();

            const type = text.startsWith('http') ? 'رابط' : 'نص';
            const resultHTML = `
                <div class="result-content">
                    <div class="result-badge">${type}</div>
                    <div class="result-text">${text}</div>
                    <div class="result-actions">
                        ${text.startsWith('http') ? `<button class="action-btn" onclick="window.open('${text}', '_blank')">فتح الرابط</button>` : ''}
                        <button class="action-btn" onclick="copyToClipboard('${text}')">نسخ</button>
                    </div>
                </div>
            `;

            resultPanel.innerHTML = resultHTML;
            resultPanel.classList.add('success');
            resultPanel.classList.remove('error');

            addToHistory(text);
            isScanning = false;
            setTimeout(() => { isScanning = true; }, 2000);
        }

        function showResult(message, type = 'default') {
            resultPanel.innerHTML = message;
            resultPanel.classList.remove('success', 'error');
            if (type !== 'default') resultPanel.classList.add(type);
        }

        function addToHistory(text) {
            if (history[0]?.text === text) return;

            const item = {
                text: text,
                time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
                date: new Date().toLocaleDateString('ar-EG')
            };

            history.unshift(item);
            if (history.length > 50) history.pop();
            localStorage.setItem('qr_history', JSON.stringify(history));
        }

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = '<div class="empty-state">السجل فارغ</div>';
                return;
            }

            historyList.innerHTML = history.map((item, idx) => `
                <div class="history-item">
                    <div class="history-info">
                        <div class="history-time">${item.time} • ${item.date}</div>
                        <div class="history-text">
                            ${item.text.startsWith('http') ? `<a href="${item.text}" target="_blank" class="history-link">${item.text}</a>` : item.text}
                        </div>
                    </div>
                    <button class="history-btn" onclick="copyFromHistory(${idx})">📋</button>
                </div>
            `).join('');
        }

        function copyFromHistory(idx) {
            navigator.clipboard.writeText(history[idx].text);
            showToast('تم النسخ من السجل');
        }

        function clearHistory() {
            if (confirm('هل تريد مسح السجل بالكامل؟')) {
                history = [];
                localStorage.removeItem('qr_history');
                renderHistory();
                showToast('تم مسح السجل');
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.getElementById(tab + '-section').classList.add('active');

            if (tab === 'history') renderHistory();
        }

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const uploadResult = document.getElementById('uploadResult');
            uploadResult.innerHTML = 'جاري التحليل...';

            try {
                const img = await decodeImage(file);
                const result = await codeReader.decodeFromImageElement(img);
                if (result) {
                    const text = result.text;
                    const type = text.startsWith('http') ? 'رابط' : 'نص';
                    uploadResult.innerHTML = `
                        <div class="result-content">
                            <div class="result-badge">${type}</div>
                            <div class="result-text">${text}</div>
                            <div class="result-actions">
                                ${text.startsWith('http') ? `<button class="action-btn" onclick="window.open('${text}', '_blank')">فتح</button>` : ''}
                                <button class="action-btn" onclick="copyToClipboard('${text}')">نسخ</button>
                            </div>
                        </div>
                    `;
                    uploadResult.classList.add('success');
                    uploadResult.classList.remove('error');
                    addToHistory(text);
                } else {
                    uploadResult.innerHTML = 'لم يتم العثور على كود QR';
                    uploadResult.classList.add('error');
                    uploadResult.classList.remove('success');
                }
            } catch (err) {
                uploadResult.innerHTML = 'خطأ في تحليل الصورة';
                uploadResult.classList.add('error');
                uploadResult.classList.remove('success');
            }
        }

        function decodeImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            showToast('تم النسخ بنجاح');
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function playBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch (e) {}
        }

        window.addEventListener('load', initCamera);
        window.addEventListener('beforeunload', () => {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
