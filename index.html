<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALHYTHAM QR - التوجيه السريع</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
        }

        /* حاوية الكاميرا الصافية */
        #reader {
            width: 100% !important;
            height: 100% !important;
            position: fixed;
            top: 0;
            left: 0;
        }

        #reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }

        /* إخفاء كل شيء يخص المكتبة */
        #reader__dashboard_section_csr, 
        #reader__dashboard_section_fsit,
        #reader__header_message,
        #reader__status_span,
        #reader img {
            display: none !important;
        }

        /* واجهة المستخدم المخصصة والشفافة */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .header {
            padding: 40px 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            text-align: center;
        }

        .header h1 {
            color: #a855f7;
            font-size: 28px;
            font-weight: 700;
            margin: 0;
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
        }

        .header p {
            color: #ddd;
            font-size: 14px;
            margin-top: 5px;
        }

        /* إطار المسح */
        .scan-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .finder {
            width: 260px;
            height: 260px;
            border: 2px solid rgba(168, 85, 247, 0.4);
            border-radius: 30px;
            position: relative;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.5);
        }

        /* زوايا الإطار */
        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 4px solid #a855f7;
            border-radius: 10px;
        }
        .tl { top: -5px; left: -5px; border-right: 0; border-bottom: 0; }
        .tr { top: -5px; right: -5px; border-left: 0; border-bottom: 0; }
        .bl { bottom: -5px; left: -5px; border-right: 0; border-top: 0; }
        .br { bottom: -5px; right: -5px; border-left: 0; border-top: 0; }

        .scan-line {
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 4px;
            background: #a855f7;
            box-shadow: 0 0 20px #a855f7;
            border-radius: 2px;
            animation: moveLine 2.5s ease-in-out infinite;
        }

        @keyframes moveLine {
            0%, 100% { top: 10%; opacity: 0.3; }
            50% { top: 90%; opacity: 1; }
        }

        .footer {
            padding: 40px 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            display: flex;
            justify-content: center;
            gap: 20px;
            pointer-events: auto;
        }

        .btn-round {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s;
        }

        .btn-round:active {
            transform: scale(0.9);
            background: #a855f7;
        }

        /* شاشة التحميل والتوجيه */
        #statusOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #FFF;
            border-bottom-color: #a855f7;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="reader"></div>

    <div class="overlay">
        <div class="header">
            <h1>ALHYTHAM QR</h1>
            <p>سيتم توجيهك للرابط تلقائياً عند المسح</p>
        </div>

        <div class="scan-area">
            <div class="finder">
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
                <div class="scan-line"></div>
            </div>
        </div>

        <div class="footer">
            <button onclick="location.reload()" class="btn-round" title="تحديث">
                <i class="fas fa-sync-alt"></i>
            </button>
            <button onclick="openInChrome()" class="btn-round" title="Chrome">
                <i class="fab fa-chrome"></i>
            </button>
        </div>
    </div>

    <div id="statusOverlay">
        <span class="loader"></span>
        <p id="statusText" class="mt-4 text-purple-400 font-bold">جاري تشغيل الكاميرا...</p>
    </div>

    <script>
        let html5QrCode;
        const statusOverlay = document.getElementById('statusOverlay');
        const statusText = document.getElementById('statusText');

        async function startApp() {
            try {
                // استخدام Html5Qrcode مباشرة بدلاً من Scanner UI لمنع "التشويش"
                html5QrCode = new Html5Qrcode("reader");
                
                const config = { 
                    fps: 25, 
                    qrbox: { width: 260, height: 260 },
                    aspectRatio: 1.0
                };

                await html5QrCode.start(
                    { facingMode: "environment" }, 
                    config,
                    onScanSuccess
                );
                
                // إخفاء شاشة التحميل بمجرد عمل الكاميرا
                setTimeout(() => {
                    statusOverlay.style.opacity = '0';
                    setTimeout(() => statusOverlay.style.display = 'none', 500);
                }, 1000);

            } catch (err) {
                console.error(err);
                statusText.innerText = "خطأ: يرجى السماح بالوصول للكاميرا";
                statusText.classList.replace('text-purple-400', 'text-red-500');
            }
        }

        function onScanSuccess(decodedText) {
            // 1. اهتزاز فوري للتنبيه
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

            // 2. إظهار شاشة التوجيه
            statusOverlay.style.display = 'flex';
            statusOverlay.style.opacity = '1';
            statusText.innerText = "تم المسح! جاري التوجيه...";
            
            // 3. إيقاف الكاميرا فوراً
            html5QrCode.stop().then(() => {
                // 4. التوجيه المباشر
                const targetUrl = decodedText.startsWith('http') ? decodedText : 'https://' + decodedText;
                
                // التحقق إذا كان الرابط صالحاً
                try {
                    new URL(targetUrl);
                    window.location.href = targetUrl;
                } catch (e) {
                    // إذا لم يكن رابطاً، اعرضه كنص
                    alert("النتيجة: " + decodedText);
                    location.reload();
                }
            });
        }

        function openInChrome() {
            const url = window.location.href.split('://')[1];
            window.location.href = `intent://${url}#Intent;scheme=https;package=com.android.chrome;end`;
        }

        // بدء التشغيل
        window.addEventListener('DOMContentLoaded', startApp);
    </script>
</body>
</html>
