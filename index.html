<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>HYTHAM QR - النسخة الاحترافية</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --primary: #d4af37;
            --primary-glow: rgba(212, 175, 55, 0.4);
            --bg-dark: #0a0a0c;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #d4af37;
        }

        /* [Themes] */
        body[data-theme="neon"] {
            --primary: #a855f7;
            --primary-glow: rgba(168, 85, 247, 0.4);
            --accent: #ec4899;
        }
        body[data-theme="blue"] {
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --accent: #06b6d4;
        }
        body[data-theme="white"] {
            --primary: #ffffff;
            --primary-glow: rgba(255, 255, 255, 0.2);
            --bg-dark: #f0f0f0;
            --glass: rgba(0, 0, 0, 0.05);
            --glass-border: rgba(0, 0, 0, 0.1);
            color: #000 !important;
        }
        body[data-theme="white"] .title-group span { filter: none !important; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-dark);
            font-family: 'Tajawal', sans-serif;
            color: #fff;
            display: flex; flex-direction: column; align-items: center;
            transition: background 0.5s ease;
        }

        .bg-mesh {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at 20% 30%, var(--primary-glow) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(99, 102, 241, 0.05) 0%, transparent 40%);
        }

        .container {
            width: 92%; max-width: 480px; text-align: center; z-index: 10;
            padding: 40px 0 100px;
        }

        /* [Elite Title] */
        .title-group { margin-bottom: 30px; }
        .elite-title {
            font-size: 2.8rem; font-family: 'Outfit', sans-serif; font-weight: 950;
            color: var(--primary);
            text-shadow: 0 0 20px var(--primary-glow);
            letter-spacing: -1px;
            margin: 0;
        }

        /* [Scanner Card] */
        .scanner-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 35px;
            padding: 15px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.4);
            position: relative;
            margin-bottom: 25px;
        }

        .scanner-inner {
            width: 100%; aspect-ratio: 1; border-radius: 25px; overflow: hidden; position: relative;
            background: #000;
            border: 2px solid var(--glass-border);
        }

        #reader { width: 100% !important; border: none !important; }
        #reader video { object-fit: cover !important; }

        .scan-laser {
            position: absolute; width: 100%; height: 3px;
            background: linear-gradient(to right, transparent, var(--primary), transparent);
            box-shadow: 0 0 20px var(--primary);
            z-index: 20; animation: scanMove 3s infinite;
        }
        @keyframes scanMove { 0%, 100% { top: 0%; } 50% { top: 100%; } }

        /* [Toolbar] */
        .premium-toolbar {
            display: flex; gap: 15px; justify-content: center;
        }
        .tool-btn {
            background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
            width: 60px; height: 60px; border-radius: 20px; color: #fff;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s; backdrop-filter: blur(10px);
        }
        .tool-btn:hover { background: rgba(212, 175, 55, 0.1); transform: translateY(-5px); border-color: var(--primary); }
        .tool-btn svg { width: 24px; height: 24px; }

        /* [History Modal] */
        .side-modal {
            position: fixed; bottom: -100%; left: 0; width: 100%; height: 70%;
            background: rgba(10, 10, 12, 0.98); backdrop-filter: blur(30px);
            z-index: 200; border-top-left-radius: 40px; border-top-right-radius: 40px;
            transition: bottom 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 30px; box-sizing: border-box; border-top: 2px solid var(--glass-border);
        }
        .side-modal.open { bottom: 0; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        .history-list { height: calc(100% - 80px); overflow-y: auto; padding-right: 10px; }
        .history-item {
            background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
            margin-bottom: 12px; padding: 15px; border-radius: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* [Theme Picker] */
        .theme-picker {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--glass); border-radius: 30px; padding: 5px 15px;
            border: 1px solid var(--glass-border); display: flex; gap: 10px; z-index: 100;
        }
        .theme-dot { width: 16px; height: 16px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(255,255,255,0.2); }

        .hidden { display: none !important; }

        /* [Animations] */
        .fade-in { animation: fadeIn 0.8s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body dir="rtl" data-theme="gold">
    <div class="bg-mesh"></div>

    <div class="theme-picker">
        <div class="theme-dot" style="background: #d4af37;" onclick="setTheme('gold')"></div>
        <div class="theme-dot" style="background: #a855f7;" onclick="setTheme('neon')"></div>
        <div class="theme-dot" style="background: #3b82f6;" onclick="setTheme('blue')"></div>
        <div class="theme-dot" style="background: #fff;" onclick="setTheme('white')"></div>
    </div>

    <div class="container fade-in">
        <div class="title-group">
            <h1 class="rainbow-title">HYTHAM QR</h1>
            <p style="opacity:0.6; font-size: 0.85rem; letter-spacing: 2px;">PREMIUM EDITION</p>
        </div>

        <div class="scanner-card">
            <div class="scanner-inner">
                <div id="reader"></div>
                <div class="scan-laser" id="laser"></div>
            </div>
        </div>

        <div class="premium-toolbar">
            <div class="tool-btn" id="toggleFlash" title="كشاف">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
            </div>
            <div class="tool-btn" id="uploadBtn" title="رفع">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            </div>
            <div class="tool-btn" onclick="toggleHistory()" title="السجل">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <div class="tool-btn" onclick="location.href='login.html'" title="خروج">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4m7 14l5-5-5-5m5 5H9"></path></svg>
            </div>
        </div>

        <input type="file" id="file-input" accept="image/*" class="hidden">
    </div>

    <!-- History Modal -->
    <div id="history-modal" class="side-modal">
        <div class="modal-header">
            <h3 style="margin:0; font-weight:900;">سجل الاتصالات</h3>
            <div style="display:flex; gap:10px;">
                <button onclick="clearHistory()" style="background:rgba(255,0,0,0.1); border:1px solid rgba(255,0,0,0.2); color:#ff4d4d; border-radius:10px; padding:5px 12px; font-weight:800; cursor:pointer;">مسح الكل</button>
                <button onclick="toggleHistory()" style="background:transparent; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button>
            </div>
        </div>
        <div class="history-list" id="history-items">
            <!-- Items injected here -->
        </div>
    </div>

    <form name="qrLogin" action="login" method="post" class="hidden">
        <input type="hidden" name="username" id="qrUser">
        <input type="hidden" name="password" id="qrPass">
    </form>

    <script>
        const html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 20, qrbox: { width: 220, height: 220 } };

        function setTheme(t) {
            document.body.setAttribute('data-theme', t);
            localStorage.setItem('qr-theme', t);
        }
        
        const savedTheme = localStorage.getItem('qr-theme');
        if (savedTheme) setTheme(savedTheme);

        const onScanSuccess = (decodedText) => {
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            
            // Save to history
            saveHistory(decodedText);
            
            html5QrCode.stop().then(() => {
                const url = decodedText.includes('?') ? new URL(decodedText) : null;
                const params = url ? new URLSearchParams(url.search) : null;
                const u = params ? (params.get('username') || params.get('user')) : decodedText.split(':')[0];
                const p = params ? (params.get('password') || params.get('pass') || "") : decodedText.split(':')[1] || "";
                
                document.getElementById('qrUser').value = u;
                document.getElementById('qrPass').value = p;
                
                // Show Animation before redirect
                document.body.style.opacity = '0';
                document.body.style.transition = 'opacity 0.8s';
                setTimeout(() => document.qrLogin.submit(), 500);
            });
        };

        const saveHistory = (data) => {
            let history = JSON.parse(localStorage.getItem('qr-history') || '[]');
            history.unshift({ data: data, time: new Date().toLocaleString('ar-EG') });
            if (history.length > 20) history.pop();
            localStorage.setItem('qr-history', JSON.stringify(history));
            renderHistory();
        };

        const renderHistory = () => {
            const list = document.getElementById('history-items');
            const history = JSON.parse(localStorage.getItem('qr-history') || '[]');
            if (history.length === 0) {
                list.innerHTML = '<div style="text-align:center; opacity:0.4; margin-top:50px;">لا يوجد سجل حالياً</div>';
                return;
            }
            list.innerHTML = history.map((item, index) => `
                <div class="history-item">
                    <div style="text-align:right">
                        <div style="font-weight:800; font-size:0.9rem; color:var(--primary)">${item.data.length > 25 ? item.data.substring(0,25)+'...' : item.data}</div>
                        <div style="font-size:0.7rem; opacity:0.5;">${item.time}</div>
                    </div>
                    <button onclick="reconnect('${item.data}')" style="background:var(--primary); border:none; color:#000; border-radius:8px; padding:5px 12px; font-weight:900; font-size:0.7rem;">اتصال</button>
                </div>
            `).join('');
        };

        function reconnect(data) {
            onScanSuccess(data);
        }

        function clearHistory() {
            if(confirm('هل أنت متأكد من مسح جميع السجلات؟')) {
                localStorage.removeItem('qr-history');
                renderHistory();
            }
        }

        function toggleHistory() {
            document.getElementById('history-modal').classList.toggle('open');
            renderHistory();
        }

        // Scanner Start
        html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess).catch(e => console.log(e));

        // File/Flash logic
        const fileInput = document.getElementById('file-input');
        document.getElementById('uploadBtn').onclick = () => fileInput.click();
        fileInput.onchange = e => {
            if (e.target.files.length > 0) {
                html5QrCode.scanFile(e.target.files[0], true).then(onScanSuccess).catch(err => alert("لم يتم العثور على رمز QR"));
            }
        };

        let flash = false;
        document.getElementById('toggleFlash').onclick = async () => {
            const track = html5QrCode.getRunningTrack();
            if(track) {
                flash = !flash;
                try { await track.applyConstraints({ advanced: [{ torch: flash }] }); } catch(e) {}
            }
        };
    </script>
</body>
</html>
