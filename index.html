<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALHYTHAM QR - النسخة النهائية المستقرة</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- استخدام مكتبة html5-qrcode بإصدار مستقر جداً -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #3b82f6;
            --bg: #000000;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: #fff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .glass {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #reader {
            width: 100% !important;
            border: none !important;
            border-radius: 24px;
            overflow: hidden;
            background: #000;
        }
        #reader video {
            object-fit: cover !important;
            border-radius: 24px;
        }
        /* تحسين شكل أزرار المكتبة الافتراضية */
        #reader__dashboard_section_csr button {
            background: #3b82f6 !important;
            color: white !important;
            border: none !important;
            padding: 10px 20px !important;
            border-radius: 12px !important;
            font-family: 'Cairo' !important;
            font-weight: bold !important;
            margin: 5px !important;
        }
        .nav-btn.active {
            color: #3b82f6;
            border-bottom: 3px solid #3b82f6;
        }
        /* Switch */
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333; transition: .4s; border-radius: 22px;
        }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px;
            left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #3b82f6; }
        input:checked + .slider:before { transform: translateX(22px); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="p-5 flex justify-between items-center glass sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <i class="fas fa-qrcode text-blue-500 text-2xl"></i>
            <h1 class="text-xl font-black tracking-tighter">ALHYTHAM QR</h1>
        </div>
        <div class="flex gap-3">
            <button onclick="location.reload()" class="text-zinc-400 p-2"><i class="fas fa-sync-alt"></i></button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-4 pb-28 space-y-6">
        
        <!-- Scanner Section -->
        <section id="section-scan" class="tab-content space-y-5">
            <div class="relative bg-zinc-900 rounded-[32px] overflow-hidden border border-zinc-800 shadow-2xl">
                <div id="reader" class="w-full aspect-square"></div>
                
                <!-- Floating Controls -->
                <div class="absolute bottom-5 left-5 right-5 flex justify-between items-center z-10">
                    <div class="flex gap-2">
                        <button onclick="toggleCamera()" class="w-12 h-12 rounded-2xl glass flex items-center justify-center text-white shadow-lg"><i class="fas fa-camera-rotate"></i></button>
                        <button onclick="toggleFlash()" id="flash-btn" class="w-12 h-12 rounded-2xl glass flex items-center justify-center text-white shadow-lg"><i class="fas fa-bolt"></i></button>
                    </div>
                    <label class="w-12 h-12 rounded-2xl bg-blue-600 flex items-center justify-center text-white shadow-lg cursor-pointer">
                        <i class="fas fa-image"></i>
                        <input type="file" accept="image/*" class="hidden" onchange="scanFile(this)">
                    </label>
                </div>
            </div>

            <!-- Settings & Chrome Intent -->
            <div class="grid grid-cols-1 gap-3">
                <div class="glass p-4 rounded-2xl flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <i class="fas fa-bolt-lightning text-yellow-500"></i>
                        <span class="text-sm font-bold">الفتح التلقائي للروابط</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="auto-open" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <a href="intent://#Intent;scheme=http;package=com.android.chrome;end" id="chrome-btn" class="glass p-4 rounded-2xl flex items-center justify-center gap-3 text-blue-400 font-bold border-blue-500/20">
                    <i class="fab fa-chrome"></i>
                    <span>فتح في متصفح كروم (لحل مشاكل الكاميرا)</span>
                </a>
            </div>

            <!-- Result Card -->
            <div id="result-card" class="hidden glass p-6 rounded-3xl border-r-4 border-blue-500 animate-pulse-once">
                <p class="text-xs font-black text-blue-500 mb-2 uppercase">النتيجة المكتشفة</p>
                <p id="result-text" class="text-lg font-mono break-all mb-6 text-left dir-ltr"></p>
                <div class="flex gap-3">
                    <button onclick="copyResult()" class="flex-1 bg-zinc-800 py-3 rounded-xl font-bold">نسخ</button>
                    <a id="result-link" href="#" target="_blank" class="hidden flex-1 bg-blue-600 py-3 rounded-xl font-bold text-center">زيارة الرابط</a>
                </div>
            </div>
        </section>

        <!-- Create Section -->
        <section id="section-create" class="tab-content hidden space-y-6">
            <div class="glass p-6 rounded-3xl space-y-4">
                <textarea id="qr-input" rows="4" class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl p-4 outline-none focus:border-blue-500 transition-all text-right" placeholder="أدخل النص أو الرابط هنا..."></textarea>
                <button onclick="generateQR()" class="w-full bg-blue-600 py-4 rounded-2xl font-black text-lg">توليد كود QR</button>
                <div id="qr-output" class="hidden flex flex-col items-center gap-6 pt-6 border-t border-zinc-800">
                    <div id="qrcode" class="p-4 bg-white rounded-2xl"></div>
                    <button onclick="downloadQR()" class="text-blue-400 font-bold">تحميل الصورة</button>
                </div>
            </div>
        </section>

        <!-- History Section -->
        <section id="section-history" class="tab-content hidden space-y-3">
            <div class="flex justify-between items-center px-2">
                <h3 class="font-bold">السجل الأخير</h3>
                <button onclick="clearHistory()" class="text-red-500 text-xs">مسح الكل</button>
            </div>
            <div id="history-list" class="space-y-2"></div>
        </section>

    </main>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 left-0 right-0 h-20 glass flex items-center justify-around z-50 px-4">
        <button onclick="showTab('scan')" id="nav-scan" class="nav-btn active flex-1 flex flex-col items-center gap-1 py-2">
            <i class="fas fa-expand"></i><span class="text-[10px] font-bold">ماسح</span>
        </button>
        <button onclick="showTab('create')" id="nav-create" class="nav-btn flex-1 flex flex-col items-center gap-1 py-2 text-zinc-500">
            <i class="fas fa-plus-circle"></i><span class="text-[10px] font-bold">إنشاء</span>
        </button>
        <button onclick="showTab('history')" id="nav-history" class="nav-btn flex-1 flex flex-col items-center gap-1 py-2 text-zinc-500">
            <i class="fas fa-history"></i><span class="text-[10px] font-bold">سجل</span>
        </button>
    </nav>

    <script>
        let html5QrCode = null;
        let cameras = [];
        let currentCameraId = null;
        let isFlashOn = false;

        // --- Scanner Logic ---
        async function initScanner() {
            if (html5QrCode && html5QrCode.isScanning) return;
            
            html5QrCode = new Html5QrCode("reader");
            
            try {
                // محاكاة طريقة الموقع المرجعي في طلب الصلاحيات
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                stream.getTracks().forEach(track => track.stop());

                cameras = await Html5QrCode.getCameras();
                if (cameras && cameras.length > 0) {
                    // اختيار الكاميرا الخلفية تلقائياً كما في الموقع المرجعي
                    const backCam = cameras.find(c => c.label.toLowerCase().includes('back') || c.label.toLowerCase().includes('environment'));
                    currentCameraId = backCam ? backCam.id : cameras[0].id;
                    startScanner(currentCameraId);
                } else {
                    showError("لم يتم العثور على كاميرا.");
                }
            } catch (err) {
                showError("يرجى السماح بالوصول للكاميرا أو فتح الموقع في متصفح كروم.");
            }
        }

        function startScanner(cameraId) {
            html5QrCode.start(
                cameraId, 
                { fps: 15, qrbox: { width: 250, height: 250 } },
                onScanSuccess
            ).catch(err => console.error(err));
        }

        function onScanSuccess(text) {
            if (navigator.vibrate) navigator.vibrate(100);
            
            // الفتح التلقائي الفوري
            if (document.getElementById('auto-open').checked && text.startsWith('http')) {
                window.location.href = text;
                return;
            }

            document.getElementById('result-card').classList.remove('hidden');
            document.getElementById('result-text').innerText = text;
            const link = document.getElementById('result-link');
            if (text.startsWith('http')) {
                link.href = text;
                link.classList.remove('hidden');
            } else {
                link.classList.add('hidden');
            }
            saveHistory(text);
            document.getElementById('result-card').scrollIntoView({ behavior: 'smooth' });
        }

        async function toggleCamera() {
            if (!html5QrCode || cameras.length < 2) return;
            await html5QrCode.stop();
            const idx = cameras.findIndex(c => c.id === currentCameraId);
            currentCameraId = cameras[(idx + 1) % cameras.length].id;
            startScanner(currentCameraId);
        }

        async function toggleFlash() {
            if (!html5QrCode || !html5QrCode.isScanning) return;
            try {
                isFlashOn = !isFlashOn;
                await html5QrCode.applyVideoConstraints({ advanced: [{ torch: isFlashOn }] });
                document.getElementById('flash-btn').classList.toggle('text-yellow-500');
            } catch (e) {
                Swal.fire({ toast: true, title: "الكشاف غير مدعوم", icon: "info", showConfirmButton: false, timer: 1500 });
            }
        }

        // --- File Scan (Fixed & Fast) ---
        async function scanFile(input) {
            if (!input.files.length) return;
            const file = input.files[0];
            const tempScanner = new Html5QrCode("reader");
            Swal.fire({ title: 'جاري فحص الصورة...', didOpen: () => Swal.showLoading() });
            
            try {
                const result = await tempScanner.scanFile(file, true);
                Swal.close();
                onScanSuccess(result);
            } catch (err) {
                Swal.fire("خطأ", "لم يتم العثور على كود في الصورة", "error");
            }
        }

        // --- UI & Tabs ---
        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active', 'text-blue-500'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.add('text-zinc-500'));

            document.getElementById(`section-${id}`).classList.remove('hidden');
            document.getElementById(`nav-${id}`).classList.add('active', 'text-blue-500');
            document.getElementById(`nav-${id}`).classList.remove('text-zinc-500');

            if (id === 'scan') initScanner();
            else if (html5QrCode) html5QrCode.stop().catch(() => {});
            
            if (id === 'history') renderHistory();
        }

        function generateQR() {
            const val = document.getElementById('qr-input').value;
            if (!val) return;
            const out = document.getElementById('qrcode');
            out.innerHTML = '';
            new QRCode(out, { text: val, width: 200, height: 200 });
            document.getElementById('qr-output').classList.remove('hidden');
        }

        function saveHistory(text) {
            let h = JSON.parse(localStorage.getItem('alhytham_h') || '[]');
            h.unshift({ text, date: new Date().toLocaleString('ar-EG') });
            localStorage.setItem('alhytham_h', JSON.stringify(h.slice(0, 20)));
        }

        function renderHistory() {
            const h = JSON.parse(localStorage.getItem('alhytham_h') || '[]');
            const list = document.getElementById('history-list');
            list.innerHTML = h.map(i => `
                <div class="glass p-4 rounded-2xl flex justify-between items-center">
                    <div class="truncate flex-1 text-xs font-mono text-left dir-ltr mr-3">${i.text}</div>
                    <button onclick="copyRaw('${i.text}')" class="text-blue-500"><i class="fas fa-copy"></i></button>
                </div>
            `).join('') || '<p class="text-center text-zinc-600 py-10">السجل فارغ</p>';
        }

        function copyResult() { copyRaw(document.getElementById('result-text').innerText); }
        function copyRaw(t) {
            navigator.clipboard.writeText(t);
            Swal.fire({ toast: true, title: "تم النسخ", icon: "success", showConfirmButton: false, timer: 1000 });
        }

        function downloadQR() {
            const img = document.querySelector('#qrcode img');
            const a = document.createElement('a');
            a.href = img.src;
            a.download = 'ALHYTHAM-QR.png';
            a.click();
        }

        function showError(msg) {
            Swal.fire({ title: "تنبيه", text: msg, icon: "warning", confirmButtonText: "حسناً" });
        }

        // تحديث رابط كروم
        window.onload = () => {
            const chromeBtn = document.getElementById('chrome-btn');
            const currentUrl = window.location.href.replace(/^https?:\/\//, '');
            chromeBtn.href = `intent://${currentUrl}#Intent;scheme=http;package=com.android.chrome;end`;
            initScanner();
        };
    </script>
</body>
</html>
