<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHYTHAM QR - ماسح رمز الاستجابة السريعة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #4c1d95 100%);
            min-height: 100vh;
            color: white;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
        }

        .scanner-box {
            position: relative;
            overflow: hidden;
            border-radius: 1rem;
            border: 2px solid rgba(139, 92, 246, 0.5);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }

        .scanner-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #8b5cf6;
            box-shadow: 0 0 15px #8b5cf6;
            animation: scan 2s linear infinite;
            z-index: 10;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .btn-primary {
            background: linear-gradient(90deg, #6366f1 0%, #a855f7 100%);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        #reader__dashboard_section_csr button {
            background: #6366f1 !important;
            color: white !important;
            border: none !important;
            padding: 8px 16px !important;
            border-radius: 8px !important;
            cursor: pointer !important;
        }

        #reader video {
            object-fit: cover !important;
            border-radius: 1rem !important;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-2xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-8 animate-fade-in">
            <h1 class="text-4xl md:text-6xl font-bold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">
                ALHYTHAM QR
            </h1>
            <p class="text-gray-400 text-lg">الماسح الضوئي الاحترافي للأكواد</p>
        </header>

        <!-- Main Card -->
        <div class="glass-card p-6 shadow-2xl">
            <!-- Controls Top -->
            <div class="flex flex-wrap gap-3 justify-center mb-6">
                <button onclick="reloadCamera()" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 transition-colors border border-gray-600">
                    <i class="fas fa-sync-alt"></i>
                    <span>إعادة تحميل الكاميرا</span>
                </button>
                <button onclick="openInChrome()" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 transition-colors border border-gray-600">
                    <i class="fab fa-chrome text-blue-400"></i>
                    <span>فتح في Chrome</span>
                </button>
            </div>

            <!-- Scanner Area -->
            <div class="scanner-box bg-black mb-6 aspect-video flex items-center justify-center relative">
                <div id="reader" class="w-full h-full"></div>
                <div id="scanLine" class="scanner-line hidden"></div>
                <div id="placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500">
                    <i class="fas fa-camera text-5xl mb-4"></i>
                    <p>جاري تشغيل الكاميرا...</p>
                </div>
            </div>

            <!-- Image Upload -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-400 mb-2 text-center">أو امسح من صورة</label>
                <div class="flex items-center justify-center w-full">
                    <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-600 border-dashed rounded-xl cursor-pointer bg-gray-800/50 hover:bg-gray-800 transition-all">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                            <i class="fas fa-cloud-upload-alt text-3xl text-purple-400 mb-2"></i>
                            <p class="text-sm text-gray-400">اضغط لرفع صورة QR Code</p>
                        </div>
                        <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="scanImage(this)" />
                    </label>
                </div>
            </div>

            <!-- Result Section -->
            <div id="resultContainer" class="hidden space-y-4 animate-in fade-in slide-in-from-bottom duration-500">
                <div class="p-4 bg-gray-900/80 rounded-xl border border-purple-500/30">
                    <label class="block text-xs font-bold text-purple-400 uppercase mb-2">النتيجة:</label>
                    <div id="resultText" class="text-lg break-all font-mono"></div>
                </div>
                
                <div class="flex gap-3">
                    <button onclick="copyResult()" class="flex-1 btn-primary py-3 rounded-xl font-bold flex items-center justify-center gap-2">
                        <i class="fas fa-copy"></i>
                        نسخ النتيجة
                    </button>
                    <a id="openLinkBtn" target="_blank" class="hidden flex-1 bg-green-600 hover:bg-green-500 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-colors">
                        <i class="fas fa-external-link-alt"></i>
                        فتح الرابط
                    </a>
                </div>
            </div>
        </div>

        <!-- Footer Info -->
        <footer class="mt-8 text-center text-gray-500 text-sm">
            <p>&copy; 2026 ALHYTHAM QR - جميع الحقوق محفوظة</p>
        </footer>
    </div>

    <!-- Hidden Canvas for Image Processing -->
    <canvas id="hiddenCanvas" class="hidden"></canvas>

    <script>
        let html5QrCode;
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };

        async function initCamera() {
            try {
                if (html5QrCode) {
                    await html5QrCode.stop();
                }
                
                html5QrCode = new Html5Qrcode("reader");
                const cameras = await Html5Qrcode.getCameras();
                
                if (cameras && cameras.length > 0) {
                    document.getElementById('placeholder').classList.add('hidden');
                    document.getElementById('scanLine').classList.remove('hidden');
                    
                    // البحث عن الكاميرا الخلفية
                    let backCamera = cameras.find(c => c.label.toLowerCase().includes('back') || c.label.toLowerCase().includes('rear'));
                    const cameraId = backCamera ? backCamera.id : cameras[0].id;

                    await html5QrCode.start(
                        cameraId, 
                        config,
                        (decodedText) => {
                            handleResult(decodedText);
                        },
                        (errorMessage) => {
                            // تجاهل أخطاء المسح المستمرة
                        }
                    );
                } else {
                    alert("لم يتم العثور على كاميرا");
                }
            } catch (err) {
                console.error("Camera Error:", err);
                document.getElementById('placeholder').innerHTML = `
                    <i class="fas fa-exclamation-triangle text-red-500 text-5xl mb-4"></i>
                    <p class="text-red-400">خطأ في تشغيل الكاميرا: ${err.message}</p>
                `;
            }
        }

        function handleResult(text) {
            const resultContainer = document.getElementById('resultContainer');
            const resultText = document.getElementById('resultText');
            const openLinkBtn = document.getElementById('openLinkBtn');

            resultContainer.classList.remove('hidden');
            resultText.innerText = text;

            // التحقق إذا كان رابط
            const urlPattern = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/;
            if (urlPattern.test(text)) {
                openLinkBtn.href = text.startsWith('http') ? text : 'https://' + text;
                openLinkBtn.classList.remove('hidden');
            } else {
                openLinkBtn.classList.add('hidden');
            }

            // الاهتزاز إذا كان متاحاً
            if (navigator.vibrate) {
                navigator.vibrate(200);
            }
        }

        function copyResult() {
            const text = document.getElementById('resultText').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("تم النسخ بنجاح!");
            });
        }

        function reloadCamera() {
            initCamera();
        }

        function openInChrome() {
            const url = window.location.href;
            if (navigator.userAgent.match(/iPhone|iPad|iPod/i)) {
                window.location.href = `googlechromes://${url.replace(/^https?:\/\//, '')}`;
            } else {
                window.location.href = `intent://${url.replace(/^https?:\/\//, '')}#Intent;scheme=https;package=com.android.chrome;end`;
            }
        }

        function scanImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.getElementById('hiddenCanvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const code = jsQR(imageData.data, imageData.width, imageData.height);
                        
                        if (code) {
                            handleResult(code.data);
                        } else {
                            alert("لم يتم العثور على رمز QR في هذه الصورة");
                        }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // بدء التشغيل
        window.addEventListener('DOMContentLoaded', initCamera);
    </script>
</body>
</html>
