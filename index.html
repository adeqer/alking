<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALHYTHAM QR - Elite Gold 3D Edition</title>
    
    <link rel="manifest" href="data:application/json;base64,ewogICJnameIjogIkFMSFlUSEFNIFFSIiwKICAic2hvcnRfbmFtZSI6ICJBTEhZVEhBTSBRUiIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMTAxMDEyIiwKICAidGhlbWVfY29sb3IiOiAiI0Q0QUYzNyIKfQ==">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #F1C40F;
            --gold-dark: #996515;
            --bg-dark: #0a0a0a;
            --bg-card: #141416;
            --text: #ffffff;
            --text-dim: #a0a0a5;
            --border: rgba(212, 175, 55, 0.2);
            --font: 'Outfit', 'Cairo', sans-serif;
            --3d-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 5px 15px rgba(212, 175, 55, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font);
            background: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(212, 175, 55, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(26, 26, 27, 0.8) 0%, transparent 100%);
        }

        /* 3D Rainbow Animated Title */
        @keyframes rainbow-gold {
            0% { filter: hue-rotate(0deg) brightness(1.2) drop-shadow(0 0 10px var(--gold)); }
            50% { filter: hue-rotate(180deg) brightness(1.5) drop-shadow(0 0 20px var(--gold-light)); }
            100% { filter: hue-rotate(360deg) brightness(1.2) drop-shadow(0 0 10px var(--gold)); }
        }

        .gold-rainbow-title {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700 0%, #D4AF37 50%, #B8860B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow-gold 5s linear infinite;
            letter-spacing: -1px;
            display: inline-block;
            transform: perspective(500px) rotateX(10deg);
        }

        .main-container {
            width: 100%;
            max-width: 440px;
            height: 98vh;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: var(--3d-shadow);
            transform: perspective(1000px) rotateX(0deg);
            z-index: 10;
        }

        /* Nav */
        .nav-bar {
            display: flex;
            background: rgba(0,0,0,0.5);
            margin: 0 20px 15px;
            padding: 8px;
            border-radius: 24px;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .nav-item {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-family: inherit;
            font-weight: 800;
            font-size: 11px;
            border-radius: 18px;
            cursor: pointer;
            transition: 0.4s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .nav-item.active {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: #000;
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }

        /* 3D Content Cards */
        .content {
            flex: 1;
            padding: 0 24px 20px;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .content::-webkit-scrollbar { display: none; }

        .panel { display: none; flex-direction: column; }
        .panel.active { display: flex; animation: slide3D 0.6s cubic-bezier(0.23, 1, 0.32, 1); }

        @keyframes slide3D {
            from { opacity: 0; transform: perspective(1000px) translate3D(0, 50px, -100px) rotateX(-15deg); }
            to { opacity: 1; transform: perspective(1000px) translate3D(0, 0, 0) rotateX(0deg); }
        }

        /* Scanner */
        .scanner-viewport {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: #000;
            border-radius: 32px;
            overflow: hidden;
            border: 2px solid var(--gold);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        #video { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }

        .overlay-mask {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 32px;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.6);
            pointer-events: none;
        }

        .gold-scan-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
            box-shadow: 0 0 20px var(--gold);
            animation: lineGlide 3s infinite ease-in-out;
        }

        @keyframes lineGlide { 0% { top: 10%; } 50% { top: 90%; } 100% { top: 10%; } }

        /* Zoom Control 3D */
        .zoom-control-3d {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 200px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0;
            z-index: 20;
        }

        .zoom-slider {
            -webkit-appearance: none;
            width: 130px;
            height: 6px;
            background: #333;
            transform: rotate(-90deg) translateX(-10px);
            border-radius: 10px;
            outline: none;
        }

        .zoom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: var(--gold);
            border: 2px solid #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 15px var(--gold);
        }

        /* Buttons Elite */
        .btn-elite {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: #000;
            border: none;
            padding: 18px;
            border-radius: 20px;
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-elite:active { transform: scale(0.95) translateY(2px); }
        .btn-elite:hover { box-shadow: 0 15px 35px rgba(212, 175, 55, 0.4); }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--gold);
            padding: 14px;
            border-radius: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-outline:hover { background: rgba(212, 175, 55, 0.05); }

        /* Results 3D Card */
        .result-card-3d {
            background: #1c1c1f;
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            margin-top: 25px;
            text-align: center;
            transform: perspective(1000px) rotateX(0deg);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }

        /* Toast */
        #toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--gold);
            color: #000;
            padding: 15px 30px;
            border-radius: 20px;
            font-weight: 900;
            z-index: 2000;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.5);
        }
        #toast.show { transform: translateX(-50%) translateY(0); }

        /* Action Modal Elite */
        .action-modal {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            backdrop-filter: blur(10px);
            animation: modalFade 0.4s ease;
        }
        @keyframes modalFade { from { opacity: 0; } to { opacity: 1; } }

        .modal-content-3d {
            background: var(--bg-card);
            border: 2px solid var(--gold);
            border-radius: 36px;
            padding: 35px 25px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.2);
            transform: perspective(1000px) rotateX(0deg);
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Elite Header -->
        <div style="padding: 40px 0 30px; text-align: center;">
            <div class="gold-rainbow-title">ALHYTHAM QR</div>
            <div style="font-size: 11px; color: var(--gold); letter-spacing: 4px; font-weight: 800; opacity: 0.8; margin-top: 5px">
                GOLD 3D EXCELLENCE 🏆
            </div>
        </div>

        <div class="content">
            <!-- SCAN PANEL -->
            <div id="p-scan" class="panel active">
                <div class="scanner-viewport">
                    <video id="video" playsinline autoplay></video>
                    <div class="overlay-mask">
                        <div class="gold-scan-line"></div>
                    </div>
                    <!-- 3D Zoom Slider -->
                    <div class="zoom-control-3d">
                        <span style="font-size: 18px">🔍</span>
                        <input type="range" class="zoom-slider" id="zoomCtrl" min="1" max="4" step="0.1" value="1">
                        <span style="font-size: 18px">📍</span>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px;">
                    <button class="btn-outline" onclick="toggleTorch()">💡 فلاش ذهبي</button>
                    <button class="btn-outline" onclick="cycleCam()">🔄 تبديل عدسة</button>
                    <button class="btn-elite" style="grid-column: span 2" onclick="document.getElementById('pickIn').click()">
                        🖼️ فحص صورة من الاستوديو
                    </button>
                </div>

                <div class="result-card-3d">
                    <div style="color: var(--gold); font-weight: 900; margin-bottom: 8px; font-size: 13px">📡 الرصد التلقائي</div>
                    <div id="resText" style="opacity: 0.8; font-weight: 600">وجه العدسة نحو الهدف 🏛️</div>
                </div>
            </div>

            <!-- AUDIT PANEL -->
            <div id="p-audit" class="panel">
                <h3 style="color: var(--gold); margin-bottom: 20px; text-align: center">🔍 مدقق الصور النخبوي</h3>
                <div class="result-card-3d">
                    <canvas id="auditCanvas" style="width:100%; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 20px;"></canvas>
                    <div style="text-align: right; margin-bottom: 15px">
                        <label style="font-size: 11px; color: var(--text-dim)">تقوية التباين 📊</label>
                        <input type="range" id="audContrast" style="width:100%" min="0" max="250" value="100">
                    </div>
                    <button class="btn-elite" onclick="runAudit()">تحليل تقني مكثف ⚙️</button>
                </div>
            </div>

            <!-- GENERATE PANEL -->
            <div id="p-gen" class="panel">
                <div class="result-card-3d">
                    <label style="display:block; text-align:right; margin-bottom:10px; color:var(--gold); font-weight:700">محتوى الكود ✨</label>
                    <textarea id="genIn" style="width:100%; background:#000; border:1px solid var(--border); border-radius:16px; padding:15px; color:#fff; font-family:inherit" rows="4" placeholder="أدخل الرابط أو النص..."></textarea>
                    <button class="btn-elite" style="margin-top: 20px" onclick="makeQR()">توليد الكود الذهبي 🔮</button>
                </div>
                <div id="qrBox" style="background:#fff; padding:20px; border-radius:24px; margin:25px auto; width:fit-content; border: 5px solid var(--gold)"></div>
                <button id="saveBtn" class="btn-outline" style="width:100%; display:none" onclick="saveMe()">حفظ في الصور 📷</button>
            </div>

            <!-- HISTORY PANEL -->
            <div id="p-hist" class="panel">
                <div style="display:flex; gap:12px; margin-bottom:20px">
                    <button class="btn-outline" style="flex:1" onclick="exportData('csv')">CSV 📄</button>
                    <button class="btn-outline" style="flex:1" onclick="exportData('json')">JSON 💻</button>
                </div>
                <div id="histList"></div>
                <button class="btn-outline" style="margin-top:20px; color:var(--error); width:100%" onclick="killHist()">تصفير الأرشيف 🗑️</button>
            </div>
        </div>

        <!-- Elite Navigation -->
        <div class="nav-bar">
            <button class="nav-item active" onclick="goTab('scan', this)">
                <span style="font-size: 18px">🤳</span>
                <span>المسح</span>
            </button>
            <button class="nav-item" onclick="goTab('audit', this)">
                <span style="font-size: 18px">🕵️</span>
                <span>تدقيق</span>
            </button>
            <button class="nav-item" onclick="goTab('gen', this)">
                <span style="font-size: 18px">🔮</span>
                <span>توليد</span>
            </button>
            <button class="nav-item" onclick="goTab('hist', this)">
                <span style="font-size: 18px">🕒</span>
                <span>السجل</span>
            </button>
        </div>

        <!-- Action Overlay -->
        <div id="overlay" class="action-modal">
            <div class="modal-content-3d">
                <div style="font-size: 60px; margin-bottom: 20px">🏆</div>
                <h2 id="o-title" style="color: var(--gold); margin-bottom: 10px">نتيجة مكتشفة</h2>
                <p id="o-data" style="opacity: 0.8; word-break: break-all; margin-bottom: 30px"></p>
                <button id="o-btn" class="btn-elite" style="margin-bottom: 12px">إجراء ذكي 🚀</button>
                <button class="btn-outline" style="width:100%" onclick="hideOverlay()">إغلاق ❌</button>
            </div>
        </div>
    </div>

    <!-- Hidden Helpers -->
    <input type="file" id="pickIn" hidden accept="image/*" onchange="loadToAudit(this)">
    <div id="toast"></div>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        const coder = new ZXing.BrowserQRCodeReader();
        let stream = null;
        let deviceId = null;
        let isSpinning = true;
        let history = JSON.parse(localStorage.getItem('al_gold_hist') || '[]');

        function msg(m) {
            const t = document.getElementById('toast');
            t.innerText = m; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function goTab(t, b) {
            document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
            document.getElementById(`p-${t}`).classList.add('active');
            b.classList.add('active');
            if(t === 'hist') drawHist();
        }

        async function init() {
            try {
                const devs = await coder.listVideoInputDevices();
                deviceId = devs[devs.length-1].deviceId;
                if(stream) stream.getTracks().forEach(t => t.stop());
                
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { deviceId, facingMode: 'environment' }
                });
                
                const vid = document.getElementById('video');
                vid.srcObject = stream;
                
                // Hybrid Zoom Logic
                const track = stream.getVideoTracks()[0];
                const caps = track.getCapabilities ? track.getCapabilities() : {};
                const zSlider = document.getElementById('zoomCtrl');
                
                if(caps.zoom) {
                    zSlider.min = caps.zoom.min; zSlider.max = caps.zoom.max; zSlider.step = caps.zoom.step;
                    zSlider.oninput = (e) => {
                        track.applyConstraints({advanced: [{zoom: e.target.value}]});
                    };
                } else {
                    // Fallback to CSS Digital Zoom
                    zSlider.min = 1; zSlider.max = 3; zSlider.step = 0.1;
                    zSlider.oninput = (e) => {
                        vid.style.transform = `scale(${e.target.value})`;
                    };
                    console.log("Hardware zoom not supported, using CSS fallback.");
                }

                coder.decodeFromVideoDevice(deviceId, 'video', (res, err) => {
                    if(res && isSpinning) alertRes(res.text);
                });
            } catch(e) { msg("خطأ في تشغيل الكاميرا ❌"); }
        }

        function alertRes(t) {
            isSpinning = false;
            confetti({ particleCount: 200, spread: 80, colors: ['#D4AF37', '#F1C40F', '#ffffff'], origin: { y: 0.6 } });
            if(navigator.vibrate) navigator.vibrate(200);
            playTone();

            saveHist(t);
            const ov = document.getElementById('overlay');
            const tit = document.getElementById('o-title');
            const dat = document.getElementById('o-data');
            const btn = document.getElementById('o-btn');

            ov.style.display = 'flex';
            dat.innerText = t;

            if(t.startsWith('WIFI:')) {
                tit.innerText = "🌐 شبكة WiFi ملكية";
                btn.innerText = "اتصال ذكي 📡";
                btn.onclick = () => {
                    const p = t.match(/P:([^;]+)/);
                    if(p) navigator.clipboard.writeText(p[1]);
                    msg("تم نسخ كلمة السر! جاري التحويل...");
                    window.location.href = "App-Prefs:root=WIFI";
                };
            } else if(t.startsWith('http')) {
                tit.innerText = "🔗 رابط نخبوي";
                btn.innerText = "استكشاف الموقع 🌍";
                btn.onclick = () => window.open(t, '_blank');
            } else {
                tit.innerText = "📜 نص نادِر";
                btn.innerText = "نسخ النص 📋";
                btn.onclick = () => { navigator.clipboard.writeText(t); msg("تم النسخ بنجاح ✅"); };
            }
        }

        function hideOverlay() {
            document.getElementById('overlay').style.display = 'none';
            setTimeout(() => { isSpinning = true; }, 500);
        }

        // Audit Engine Luxe
        let auditImg = null;
        function loadToAudit(inp) {
            if(!inp.files[0]) return;
            goTab('audit', document.querySelectorAll('.nav-item')[1]);
            const can = document.getElementById('auditCanvas');
            const ctx = can.getContext('2d');
            const f = new FileReader();
            f.onload = (e) => {
                auditImg = new Image();
                auditImg.onload = () => {
                    can.width = auditImg.width; can.height = auditImg.height;
                    ctx.drawImage(auditImg, 0, 0);
                    msg("تم استيراد الصورة للتدقيق 🏛️");
                };
                auditImg.src = e.target.result;
            };
            f.readAsDataURL(inp.files[0]);
        }

        async function runAudit() {
            if(!auditImg) return;
            const can = document.getElementById('auditCanvas');
            const ctx = can.getContext('2d');
            const cont = document.getElementById('audContrast').value / 100;
            
            ctx.filter = `contrast(${cont}) grayscale(1) brightness(1.2)`;
            ctx.drawImage(auditImg, 0, 0);
            
            msg("جاري التشفير الملكي... 🧬");
            try {
                const res = await coder.decodeFromCanvas(can);
                alertRes(res.text);
            } catch(e) { msg("تعذر القراءة، ارفع التباين 🧐"); }
        }

        // Gen & Hist
        function makeQR() {
            const v = document.getElementById('genIn').value;
            if(!v) return;
            const b = document.getElementById('qrBox'); b.innerHTML = "";
            new QRCode(b, { text: v, width: 250, height: 250 });
            document.getElementById('saveBtn').style.display = 'block';
            confetti({ particleCount: 60, colors: ['#D4AF37'] });
        }

        function saveMe() {
            const i = document.querySelector('#qrBox img');
            const a = document.createElement('a'); a.download = 'ALHYTHAM_GOLD.png'; a.href = i.src; a.click();
        }

        function saveHist(t) {
            history.unshift({ t, d: new Date().toLocaleString('ar-EG'), id: Date.now() });
            if(history.length > 50) history.pop();
            localStorage.setItem('al_gold_hist', JSON.stringify(history));
        }

        function drawHist() {
            const l = document.getElementById('histList');
            if(history.length === 0) { l.innerHTML = "<p style='text-align:center; opacity:0.5'>الأرشيف فارغ 🏛️</p>"; return; }
            l.innerHTML = history.map(i => `
                <div class="result-card-3d" style="padding:15px; margin-bottom:10px; text-align:right" onclick="copyHist('${i.t}')">
                    <div style="font-size:10px; color:var(--gold)">${i.d}</div>
                    <div style="font-size:13px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">${i.t}</div>
                </div>
            `).join('');
        }

        function copyHist(t) { navigator.clipboard.writeText(t); msg("تم النسخ يا فندم 📋"); }
        function killHist() { if(confirm("مسح الأرشيف؟")) { history = []; localStorage.removeItem('al_gold_hist'); drawHist(); } }

        function exportData(f) {
            const d = f === 'json' ? JSON.stringify(history) : history.map(i => `${i.d},${i.t}`).join('\n');
            const b = new Blob([d], {type:'text/plain'});
            const u = URL.createObjectURL(b);
            const a = document.createElement('a'); a.download = `ALHYTHAM_GOLD.${f}`; a.href = u; a.click();
        }

        function playTone() {
            const a = new AudioContext(); const o = a.createOscillator(); const g = a.createGain();
            o.connect(g); g.connect(a.destination); o.frequency.value = 1500; g.gain.value = 0.05;
            o.start(); o.stop(a.currentTime + 0.1);
        }

        function toggleTorch() {
            const t = stream.getVideoTracks()[0];
            if(t.getCapabilities().torch) {
                const s = t.getSettings().torch;
                t.applyConstraints({advanced: [{torch: !s}]});
            } else msg("الفلاش غير مدعوم ❌");
        }

        function cycleCam() { init(); msg("تبديل العدسة 🔄"); }

        window.onload = init;
    </script>
</body>
</html>
