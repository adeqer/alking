<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHYTHAM QR - ماسح الأكواد الاحترافي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
            min-height: 100vh;
            color: #f8fafc;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .gradient-text {
            background: linear-gradient(135deg, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .scanner-box {
            position: relative;
            overflow: hidden;
            border-radius: 1rem;
            border: 2px solid rgba(96, 165, 250, 0.3);
        }
        .scanner-box::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #60a5fa;
            box-shadow: 0 0 15px #60a5fa;
            animation: scan 2s linear infinite;
        }
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
        #reader video {
            border-radius: 0.75rem;
            object-fit: cover;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .hidden { display: none; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-2xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-8 animate-fade-in">
            <h1 class="text-4xl md:text-5xl font-bold mb-2 gradient-text">ALHYTHAM QR</h1>
            <p class="text-slate-400 text-sm md:text-base">الماسح الضوئي الأسرع والأكثر أماناً</p>
        </header>

        <!-- Main Container -->
        <main class="glass-card rounded-3xl p-6 md:p-8 space-y-6">
            
            <!-- Tabs -->
            <div class="flex bg-slate-800/50 p-1 rounded-xl">
                <button id="tab-camera" class="flex-1 py-2 px-4 rounded-lg bg-blue-600 text-white font-medium transition-all flex items-center justify-center gap-2">
                    <i data-lucide="camera" class="w-5 h-5"></i>
                    الكاميرا
                </button>
                <button id="tab-file" class="flex-1 py-2 px-4 rounded-lg text-slate-400 font-medium transition-all flex items-center justify-center gap-2">
                    <i data-lucide="image" class="w-5 h-5"></i>
                    رفع صورة
                </button>
            </div>

            <!-- Camera Section -->
            <div id="camera-section" class="space-y-4">
                <div class="scanner-box bg-black aspect-square md:aspect-video flex items-center justify-center">
                    <div id="reader" class="w-full h-full"></div>
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <button id="switch-camera" class="flex items-center justify-center gap-2 bg-slate-700 hover:bg-slate-600 py-3 rounded-xl transition-colors">
                        <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                        تبديل الكاميرا
                    </button>
                    <button id="reload-camera" class="flex items-center justify-center gap-2 bg-slate-700 hover:bg-slate-600 py-3 rounded-xl transition-colors">
                        <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                        إعادة تحميل
                    </button>
                </div>
            </div>

            <!-- File Section -->
            <div id="file-section" class="hidden space-y-4">
                <div id="drop-zone" class="border-2 border-dashed border-slate-600 rounded-2xl p-10 text-center hover:border-blue-500 transition-colors cursor-pointer bg-slate-800/30">
                    <input type="file" id="file-input" accept="image/*" class="hidden">
                    <i data-lucide="upload-cloud" class="w-12 h-12 mx-auto mb-4 text-slate-500"></i>
                    <p class="text-slate-300 font-medium">اضغط هنا أو اسحب الصورة للمسح</p>
                    <p class="text-slate-500 text-xs mt-2">يدعم PNG, JPG, JPEG</p>
                </div>
                <canvas id="file-canvas" class="hidden"></canvas>
            </div>

            <!-- Result Section -->
            <div id="result-container" class="hidden animate-in fade-in slide-in-from-bottom-4 duration-500">
                <div class="bg-slate-800/80 rounded-2xl p-5 border border-blue-500/30">
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-blue-400 text-sm font-bold flex items-center gap-1">
                            <i data-lucide="check-circle" class="w-4 h-4"></i>
                            تم العثور على نتيجة:
                        </span>
                        <button id="copy-btn" class="text-slate-400 hover:text-white transition-colors p-1">
                            <i data-lucide="copy" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <div id="result-text" class="text-lg break-all font-mono bg-black/20 p-3 rounded-lg mb-4"></div>
                    
                    <div class="flex flex-col gap-2">
                        <a id="open-link" href="#" target="_blank" class="hidden btn-primary text-center py-3 rounded-xl font-bold flex items-center justify-center gap-2">
                            <i data-lucide="external-link" class="w-5 h-5"></i>
                            فتح الرابط
                        </a>
                        <button id="reset-btn" class="w-full bg-slate-700 hover:bg-slate-600 py-3 rounded-xl transition-colors flex items-center justify-center gap-2">
                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                            مسح جديد
                        </button>
                    </div>
                </div>
            </div>

            <!-- Chrome Button -->
            <button id="open-chrome" class="w-full border border-slate-600 hover:bg-slate-800 py-3 rounded-xl transition-colors flex items-center justify-center gap-2 text-slate-300">
                <i data-lucide="chrome" class="w-5 h-5"></i>
                فتح في Chrome
            </button>

        </main>

        <!-- Footer -->
        <footer class="mt-8 text-center text-slate-500 text-sm">
            <p>&copy; 2024 ALHYTHAM QR. جميع الحقوق محفوظة.</p>
        </footer>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Elements
        const tabCamera = document.getElementById('tab-camera');
        const tabFile = document.getElementById('tab-file');
        const cameraSection = document.getElementById('camera-section');
        const fileSection = document.getElementById('file-section');
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const resultContainer = document.getElementById('result-container');
        const resultText = document.getElementById('result-text');
        const openLink = document.getElementById('open-link');
        const copyBtn = document.getElementById('copy-btn');
        const resetBtn = document.getElementById('reset-btn');
        const switchCameraBtn = document.getElementById('switch-camera');
        const reloadCameraBtn = document.getElementById('reload-camera');
        const openChromeBtn = document.getElementById('open-chrome');

        let html5QrCode;
        let currentFacingMode = "environment";

        // Tab Switching
        tabCamera.addEventListener('click', () => {
            tabCamera.classList.add('bg-blue-600', 'text-white');
            tabCamera.classList.remove('text-slate-400');
            tabFile.classList.remove('bg-blue-600', 'text-white');
            tabFile.classList.add('text-slate-400');
            cameraSection.classList.remove('hidden');
            fileSection.classList.add('hidden');
            startCamera();
        });

        tabFile.addEventListener('click', () => {
            tabFile.classList.add('bg-blue-600', 'text-white');
            tabFile.classList.remove('text-slate-400');
            tabCamera.classList.remove('bg-blue-600', 'text-white');
            tabCamera.classList.add('text-slate-400');
            fileSection.classList.remove('hidden');
            cameraSection.classList.add('hidden');
            stopCamera();
        });

        // Camera Logic
        function startCamera() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    initCamera();
                }).catch(() => {
                    initCamera();
                });
            } else {
                initCamera();
            }
        }

        function initCamera() {
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            
            html5QrCode.start(
                { facingMode: currentFacingMode },
                config,
                (decodedText) => {
                    handleResult(decodedText);
                    html5QrCode.pause();
                },
                (errorMessage) => {
                    // Ignore errors
                }
            ).catch(err => {
                console.error("Error starting camera", err);
            });
        }

        function stopCamera() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop();
            }
        }

        switchCameraBtn.addEventListener('click', () => {
            currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
            startCamera();
        });

        reloadCameraBtn.addEventListener('click', () => {
            startCamera();
        });

        // File Logic
        dropZone.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', e => {
            const file = e.target.files[0];
            if (file) scanFile(file);
        });

        function scanFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.getElementById('file-canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);
                    if (code) {
                        handleResult(code.data);
                    } else {
                        alert("لم يتم العثور على QR Code في هذه الصورة.");
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Result Handling
        function handleResult(text) {
            resultText.innerText = text;
            resultContainer.classList.remove('hidden');
            
            // Check if URL
            try {
                const url = new URL(text);
                openLink.href = text;
                openLink.classList.remove('hidden');
            } catch (_) {
                openLink.classList.add('hidden');
            }

            // Scroll to result
            resultContainer.scrollIntoView({ behavior: 'smooth' });
        }

        resetBtn.addEventListener('click', () => {
            resultContainer.classList.add('hidden');
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.resume();
            } else if (!cameraSection.classList.contains('hidden')) {
                startCamera();
            }
        });

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(resultText.innerText).then(() => {
                const originalIcon = copyBtn.innerHTML;
                copyBtn.innerHTML = '<i data-lucide="check" class="w-5 h-5 text-green-500"></i>';
                lucide.createIcons();
                setTimeout(() => {
                    copyBtn.innerHTML = originalIcon;
                    lucide.createIcons();
                }, 2000);
            });
        });

        // Open in Chrome
        openChromeBtn.addEventListener('click', () => {
            const url = window.location.href;
            if (navigator.userAgent.match(/iPhone|iPad|iPod/i)) {
                window.location.href = `googlechrome://${url.replace(/^https?:\/\//, '')}`;
            } else {
                window.location.href = `intent://${url.replace(/^https?:\/\//, '')}#Intent;scheme=https;package=com.android.chrome;end`;
            }
        });

        // Start camera on load
        window.addEventListener('load', startCamera);
    </script>
</body>
</html>
