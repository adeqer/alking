<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALHYTHAM QR - الماسح الضوئي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        
        :root {
            --primary: #8b5cf6;
            --secondary: #6366f1;
            --bg-dark: #0f172a;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent),
                              radial-gradient(circle at bottom left, rgba(139, 92, 246, 0.15), transparent);
            min-height: 100vh;
            color: white;
            margin: 0;
            overflow-x: hidden;
        }

        /* إصلاح أي عناصر غريبة قد تظهر من المكتبة */
        #reader * {
            border: none !important;
            text-decoration: none !important;
        }
        
        #reader__status_span {
            display: none !important;
        }

        #reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            border-radius: 1rem !important;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .scanner-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 400px;
            margin: 0 auto;
            border-radius: 1.25rem;
            overflow: hidden;
            background: #000;
            border: 3px solid rgba(139, 92, 246, 0.3);
        }

        .scan-region-highlight {
            border: 2px solid var(--primary) !important;
            border-radius: 1rem !important;
        }

        .scanner-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(to right, transparent, var(--primary), transparent);
            box-shadow: 0 0 15px var(--primary);
            animation: scan 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            z-index: 20;
            pointer-events: none;
        }

        @keyframes scan {
            0%, 100% { top: 5%; opacity: 0.2; }
            50% { top: 95%; opacity: 1; }
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }

        .btn-main {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            box-shadow: 0 10px 15px -3px rgba(139, 92, 246, 0.3);
        }

        /* إخفاء أي أزرار افتراضية للمكتبة قد تسبب تشويش */
        #reader__dashboard_section_csr button, 
        #reader__dashboard_section_fsit button {
            display: none !important;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="w-full max-w-lg">
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400">
                ALHYTHAM QR
            </h1>
            <p class="text-slate-400 text-sm mt-1">المستقبل في مسح الأكواد</p>
        </div>

        <!-- Main Interface -->
        <div class="glass-card p-5 md:p-8">
            <!-- Camera Display -->
            <div class="scanner-container mb-6 shadow-inner">
                <div id="reader"></div>
                <div id="scanLine" class="scanner-line"></div>
                <div id="loadingOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 z-10">
                    <div class="w-10 h-10 border-4 border-purple-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                    <p class="text-slate-400 text-sm">جاري التحميل...</p>
                </div>
            </div>

            <!-- Controls -->
            <div class="grid grid-cols-2 gap-3 mb-6">
                <button onclick="reloadCamera()" class="btn-action py-3 rounded-xl flex items-center justify-center gap-2 text-sm font-medium">
                    <i class="fas fa-sync-alt text-purple-400"></i>
                    تحديث الكاميرا
                </button>
                <button onclick="openInChrome()" class="btn-action py-3 rounded-xl flex items-center justify-center gap-2 text-sm font-medium">
                    <i class="fab fa-chrome text-blue-400"></i>
                    فتح في Chrome
                </button>
            </div>

            <!-- Image Upload -->
            <div class="relative mb-6">
                <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="scanImage(this)" />
                <button onclick="document.getElementById('fileInput').click()" class="w-full py-4 border-2 border-dashed border-slate-700 rounded-xl hover:border-purple-500 hover:bg-purple-500/5 transition-all flex flex-col items-center gap-1">
                    <i class="fas fa-image text-xl text-slate-500"></i>
                    <span class="text-xs text-slate-400 font-medium">اختر صورة من الجهاز</span>
                </button>
            </div>

            <!-- Result Box -->
            <div id="resultBox" class="hidden transform transition-all duration-300 scale-95 opacity-0">
                <div class="bg-slate-950/50 rounded-2xl p-4 border border-purple-500/20 mb-4">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[10px] font-bold text-purple-400 uppercase tracking-widest">النتيجة المكتشفة</span>
                        <i class="fas fa-check-circle text-green-500 text-xs"></i>
                    </div>
                    <p id="resultContent" class="text-sm font-mono break-all leading-relaxed text-slate-200"></p>
                </div>
                
                <div class="flex gap-2">
                    <button onclick="copyToClipboard()" class="flex-1 btn-main py-3.5 rounded-xl font-bold text-sm flex items-center justify-center gap-2">
                        <i class="fas fa-copy"></i>
                        نسخ
                    </button>
                    <a id="linkAction" target="_blank" class="hidden flex-1 bg-emerald-600 hover:bg-emerald-500 py-3.5 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition-colors">
                        <i class="fas fa-external-link-alt"></i>
                        زيارة
                    </a>
                </div>
            </div>
        </div>

        <p class="text-center text-slate-600 text-[10px] mt-6 uppercase tracking-widest">Powered by ALHYTHAM Tech</p>
    </div>

    <canvas id="hiddenCanvas" class="hidden"></canvas>

    <script>
        let scanner;
        const resultBox = document.getElementById('resultBox');
        const resultContent = document.getElementById('resultContent');
        const linkAction = document.getElementById('linkAction');
        const loadingOverlay = document.getElementById('loadingOverlay');

        async function startScanner() {
            try {
                loadingOverlay.style.display = 'flex';
                if (scanner) {
                    await scanner.stop();
                }

                scanner = new Html5Qrcode("reader");
                const cameras = await Html5Qrcode.getCameras();
                
                if (cameras && cameras.length > 0) {
                    // تفضيل الكاميرا الخلفية
                    const backCamera = cameras.find(c => /back|rear|environment/i.test(c.label));
                    const selectedId = backCamera ? backCamera.id : cameras[0].id;

                    await scanner.start(
                        selectedId,
                        { fps: 15, qrbox: { width: 250, height: 250 } },
                        (text) => showResult(text),
                        () => {} // صامت للأخطاء المتكررة
                    );
                    loadingOverlay.style.display = 'none';
                }
            } catch (err) {
                console.error(err);
                loadingOverlay.innerHTML = `<p class="text-red-400 text-xs p-4 text-center">خطأ: تأكد من منح إذن الكاميرا</p>`;
            }
        }

        function showResult(text) {
            resultContent.innerText = text;
            resultBox.classList.remove('hidden');
            setTimeout(() => {
                resultBox.classList.add('scale-100', 'opacity-100');
            }, 10);

            const isUrl = /^(https?:\/\/|www\.)[^\s]+$/i.test(text);
            if (isUrl) {
                linkAction.href = text.startsWith('http') ? text : 'https://' + text;
                linkAction.classList.remove('hidden');
            } else {
                linkAction.classList.add('hidden');
            }

            if (navigator.vibrate) navigator.vibrate(100);
        }

        function copyToClipboard() {
            navigator.clipboard.writeText(resultContent.innerText).then(() => {
                const btn = event.currentTarget;
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> تم النسخ';
                setTimeout(() => btn.innerHTML = originalText, 2000);
            });
        }

        function reloadCamera() {
            startScanner();
        }

        function openInChrome() {
            const url = window.location.href.replace(/^https?:\/\//, '');
            window.location.href = `intent://${url}#Intent;scheme=https;package=com.android.chrome;end`;
        }

        function scanImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.getElementById('hiddenCanvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);
                        const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const code = jsQR(data.data, data.width, data.height);
                        if (code) showResult(code.data);
                        else alert("لم يتم العثور على رمز QR");
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        document.addEventListener('DOMContentLoaded', startScanner);
    </script>
</body>
</html>
