<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHYTHAM QR PRO - المنصة المتكاملة</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #3b82f6;
            --secondary: #8b5cf6;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .nav-tab.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .gradient-text {
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #reader {
            border: none !important;
            border-radius: 1.5rem;
            overflow: hidden;
        }

        #reader__scan_region {
            background: transparent !important;
        }

        #reader__dashboard_section_csr button {
            background: #334155 !important;
            color: white !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            padding: 8px 16px !important;
            border-radius: 10px !important;
            font-size: 14px !important;
            transition: all 0.3s !important;
        }

        #reader__dashboard_section_csr button:hover {
            background: var(--primary) !important;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-2xl mx-auto space-y-8">
        <!-- Header -->
        <header class="text-center space-y-2 animate-fade-in">
            <div class="inline-block p-3 rounded-2xl bg-blue-500/10 mb-2">
                <i class="fas fa-qrcode text-4xl text-blue-500"></i>
            </div>
            <h1 class="text-5xl font-extrabold tracking-tight">
                <span class="gradient-text">ALHYTHAM</span> <span class="text-white">QR PRO</span>
            </h1>
            <p class="text-slate-400 font-light">الجيل القادم من أدوات الـ QR الاحترافية</p>
        </header>

        <!-- Navigation Tabs -->
        <nav class="glass p-2 rounded-2xl flex gap-2 animate-fade-in" style="animation-delay: 0.1s">
            <button onclick="switchTab('scan')" id="tab-scan" class="nav-tab active flex-1 py-3 rounded-xl transition-all font-bold flex items-center justify-center gap-2">
                <i class="fas fa-expand"></i> مسح
            </button>
            <button onclick="switchTab('create')" id="tab-create" class="nav-tab flex-1 py-3 rounded-xl transition-all font-bold flex items-center justify-center gap-2 text-slate-400">
                <i class="fas fa-plus-circle"></i> إنشاء
            </button>
            <button onclick="switchTab('history')" id="tab-history" class="nav-tab flex-1 py-3 rounded-xl transition-all font-bold flex items-center justify-center gap-2 text-slate-400">
                <i class="fas fa-history"></i> السجل
            </button>
        </nav>

        <!-- Main Content Sections -->
        <main class="space-y-6">
            
            <!-- Section: Scan -->
            <section id="section-scan" class="tab-content animate-fade-in">
                <div class="glass p-4 rounded-3xl relative overflow-hidden">
                    <div id="reader" class="w-full"></div>
                    
                    <div class="grid grid-cols-2 gap-4 mt-6">
                        <button onclick="location.reload()" class="flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-white py-4 rounded-2xl transition-all border border-slate-700">
                            <i class="fas fa-sync-alt text-blue-400"></i>
                            <span>تحديث الكاميرا</span>
                        </button>
                        <a id="chrome-intent" href="#" class="flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-white py-4 rounded-2xl transition-all border border-slate-700">
                            <i class="fab fa-chrome text-blue-400"></i>
                            <span>فتح في كروم</span>
                        </a>
                    </div>
                </div>

                <!-- Result Card -->
                <div id="scan-result-card" class="hidden mt-6 glass p-6 rounded-3xl border-r-4 border-blue-500 animate-fade-in">
                    <div class="flex justify-between items-start mb-4">
                        <h3 class="text-xl font-bold text-blue-400">النتيجة المكتشفة</h3>
                        <span class="text-xs bg-blue-500/20 text-blue-300 px-2 py-1 rounded-lg" id="scan-time">الآن</span>
                    </div>
                    <div id="scan-result-text" class="bg-slate-900/50 p-4 rounded-2xl break-all text-sm mb-6 font-mono border border-slate-700/50 text-left dir-ltr"></div>
                    <div class="flex gap-3">
                        <button onclick="copyText('scan-result-text')" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-xl transition-all font-bold">
                            <i class="fas fa-copy ml-2"></i> نسخ
                        </button>
                        <a id="scan-result-link" href="#" target="_blank" class="hidden flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl transition-all font-bold text-center">
                            <i class="fas fa-external-link-alt ml-2"></i> زيارة
                        </a>
                    </div>
                </div>
            </section>

            <!-- Section: Create -->
            <section id="section-create" class="tab-content hidden animate-fade-in">
                <div class="glass p-8 rounded-3xl space-y-6">
                    <div class="space-y-4">
                        <label class="block text-sm font-medium text-slate-400">أدخل النص أو الرابط المراد تحويله:</label>
                        <textarea id="qr-input" rows="3" class="w-full bg-slate-900/50 border border-slate-700 rounded-2xl p-4 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-right" placeholder="اكتب هنا..."></textarea>
                    </div>
                    
                    <div class="flex gap-4">
                        <button onclick="generateQR()" class="flex-1 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white py-4 rounded-2xl font-bold transition-all shadow-lg shadow-blue-500/20">
                            <i class="fas fa-magic ml-2"></i> توليد الكود
                        </button>
                    </div>

                    <div id="generated-qr-container" class="hidden flex flex-col items-center space-y-6 pt-6 border-t border-slate-700/50">
                        <div id="qrcode" class="p-4 bg-white rounded-2xl shadow-2xl"></div>
                        <button onclick="downloadQR()" class="w-full bg-slate-800 hover:bg-slate-700 text-white py-3 rounded-xl border border-slate-700 transition-all">
                            <i class="fas fa-download ml-2 text-blue-400"></i> تحميل الصورة
                        </button>
                    </div>
                </div>
            </section>

            <!-- Section: History -->
            <section id="section-history" class="tab-content hidden animate-fade-in">
                <div class="glass rounded-3xl overflow-hidden">
                    <div class="p-6 border-b border-slate-700/50 flex justify-between items-center">
                        <h3 class="font-bold text-xl">سجل العمليات</h3>
                        <button onclick="clearHistory()" class="text-red-400 hover:text-red-300 text-sm">
                            <i class="fas fa-trash-alt ml-1"></i> مسح الكل
                        </button>
                    </div>
                    <div id="history-list" class="max-h-[400px] overflow-y-auto">
                        <!-- History items will be injected here -->
                        <div class="p-12 text-center text-slate-500">
                            <i class="fas fa-folder-open text-4xl mb-3 block opacity-20"></i>
                            لا يوجد سجل حالياً
                        </div>
                    </div>
                </div>
            </section>

        </main>

        <!-- Footer -->
        <footer class="text-center space-y-4 pb-8 animate-fade-in" style="animation-delay: 0.2s">
            <div class="flex justify-center gap-6 text-slate-500">
                <i class="fab fa-html5 text-2xl hover:text-orange-500 transition-colors"></i>
                <i class="fab fa-css3-alt text-2xl hover:text-blue-500 transition-colors"></i>
                <i class="fab fa-js text-2xl hover:text-yellow-500 transition-colors"></i>
            </div>
            <div class="text-slate-500 text-sm">
                <p class="font-bold text-slate-400">ALHYTHAM QR PRO &copy; 2026</p>
                <p class="mt-1 opacity-60">تم التطوير بأحدث تقنيات الويب لضمان السرعة والأمان</p>
            </div>
        </footer>
    </div>

    <script>
        // --- State Management ---
        let history = JSON.parse(localStorage.getItem('qr_history') || '[]');
        let scanner = null;

        // --- Tab Switching ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-tab').forEach(el => {
                el.classList.remove('active', 'text-white');
                el.classList.add('text-slate-400');
            });

            document.getElementById(`section-${tabId}`).classList.remove('hidden');
            const activeTab = document.getElementById(`tab-${tabId}`);
            activeTab.classList.add('active', 'text-white');
            activeTab.classList.remove('text-slate-400');

            if (tabId === 'scan') {
                startScanner();
            } else {
                stopScanner();
            }

            if (tabId === 'history') renderHistory();
        }

        // --- Scanner Logic ---
        function startScanner() {
            if (scanner) return;
            
            scanner = new Html5QrcodeScanner("reader", { 
                fps: 15, 
                qrbox: {width: 250, height: 250},
                aspectRatio: 1.0
            });

            scanner.render((decodedText) => {
                if (navigator.vibrate) navigator.vibrate(100);
                showScanResult(decodedText);
                addToHistory(decodedText, 'scan');
            }, (err) => {});
        }

        function stopScanner() {
            if (scanner) {
                scanner.clear().then(() => {
                    scanner = null;
                }).catch(err => console.error(err));
            }
        }

        function showScanResult(text) {
            const card = document.getElementById('scan-result-card');
            const textEl = document.getElementById('scan-result-text');
            const linkBtn = document.getElementById('scan-result-link');
            
            card.classList.remove('hidden');
            textEl.innerText = text;
            document.getElementById('scan-time').innerText = new Date().toLocaleTimeString('ar-EG');

            if (text.startsWith('http')) {
                linkBtn.href = text;
                linkBtn.classList.remove('hidden');
            } else {
                linkBtn.classList.add('hidden');
            }
            
            card.scrollIntoView({ behavior: 'smooth' });
        }

        // --- Generator Logic ---
        let qrcodeInstance = null;
        function generateQR() {
            const input = document.getElementById('qr-input').value;
            if (!input) {
                Swal.fire({ icon: 'error', title: 'خطأ', text: 'يرجى إدخال نص أولاً', confirmButtonColor: '#3b82f6' });
                return;
            }

            const container = document.getElementById('generated-qr-container');
            const qrDiv = document.getElementById('qrcode');
            
            qrDiv.innerHTML = '';
            qrcodeInstance = new QRCode(qrDiv, {
                text: input,
                width: 200,
                height: 200,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            container.classList.remove('hidden');
            addToHistory(input, 'create');
            
            Swal.fire({ icon: 'success', title: 'تم التوليد', timer: 1500, showConfirmButton: false });
        }

        function downloadQR() {
            const img = document.querySelector('#qrcode img');
            if (!img) return;
            const link = document.createElement('a');
            link.download = `ALHYTHAM-QR-${Date.now()}.png`;
            link.href = img.src;
            link.click();
        }

        // --- History Logic ---
        function addToHistory(content, type) {
            const item = {
                id: Date.now(),
                content,
                type,
                time: new Date().toLocaleString('ar-EG')
            };
            history.unshift(item);
            if (history.length > 20) history.pop();
            localStorage.setItem('qr_history', JSON.stringify(history));
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            if (history.length === 0) {
                list.innerHTML = `<div class="p-12 text-center text-slate-500"><i class="fas fa-folder-open text-4xl mb-3 block opacity-20"></i>لا يوجد سجل حالياً</div>`;
                return;
            }

            list.innerHTML = history.map(item => `
                <div class="history-item p-4 border-b border-slate-700/30 transition-all flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full flex items-center justify-center ${item.type === 'scan' ? 'bg-blue-500/10 text-blue-400' : 'bg-purple-500/10 text-purple-400'}">
                        <i class="fas ${item.type === 'scan' ? 'fa-expand' : 'fa-plus'}"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-mono truncate dir-ltr text-left">${item.content}</p>
                        <p class="text-[10px] text-slate-500 mt-1">${item.time}</p>
                    </div>
                    <button onclick="copyRawText('${item.content}')" class="text-slate-400 hover:text-white p-2">
                        <i class="fas fa-copy"></i>
                    </button>
                </div>
            `).join('');
        }

        function clearHistory() {
            Swal.fire({
                title: 'هل أنت متأكد؟',
                text: "سيتم حذف جميع العمليات المسجلة!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#334155',
                confirmButtonText: 'نعم، احذف',
                cancelButtonText: 'إلغاء'
            }).then((result) => {
                if (result.isConfirmed) {
                    history = [];
                    localStorage.removeItem('qr_history');
                    renderHistory();
                }
            });
        }

        // --- Utilities ---
        function copyText(elementId) {
            const text = document.getElementById(elementId).innerText;
            copyRawText(text);
        }

        function copyRawText(text) {
            navigator.clipboard.writeText(text).then(() => {
                Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'تم النسخ!', showConfirmButton: false, timer: 2000 });
            });
        }

        // Initialize Chrome Intent
        document.addEventListener('DOMContentLoaded', () => {
            const chromeLink = document.getElementById('chrome-intent');
            const currentUrl = window.location.href.replace(/^https?:\/\//, '');
            chromeLink.href = `intent://${currentUrl}#Intent;scheme=http;package=com.android.chrome;end`;
            startScanner();
        });
    </script>
</body>
</html>
