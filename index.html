<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#05070a">
    <title>ALHYTHAM QR | Fast & Cross-Browser</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --bg: #05070a; --surface: rgba(18, 22, 35, 0.85); --border: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6; --primary-glow: rgba(59, 130, 246, 0.4); --success: #10b981;
            --text: #f8fafc; --muted: #94a3b8; --radius: 20px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body {
            font-family: 'Cairo', sans-serif; background: radial-gradient(1000px 600px at 50% -10%, #0f172a 0%, var(--bg) 65%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
        }
        header { text-align: center; padding: 1.8rem 1rem 0.8rem; }
        header h1 { font-size: 1.9rem; font-weight: 700; background: linear-gradient(135deg, #fff, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { color: var(--muted); font-size: 0.9rem; margin-top: 0.3rem; }

        main { flex: 1; padding: 1rem; max-width: 680px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 1.2rem; }
        .glass { background: var(--surface); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.2rem; box-shadow: 0 12px 28px -4px rgba(0, 0, 0, 0.6); }

        /* 🚀 Scanner Optimized for Speed & Cross-Browser */
        .scanner-wrap { position: relative; width: 100%; aspect-ratio: 4/3; min-height: 280px; border-radius: 16px; overflow: hidden; background: #0a0d14; }
        #reader { width: 100% !important; height: 100% !important; position: relative; z-index: 2; }
        #reader video {
            width: 100% !important; height: 100% !important; object-fit: cover !important;
            transform: translate3d(0,0,0); /* GPU Acceleration */
            will-change: transform;
            image-rendering: -webkit-optimize-contrast;
        }
        #reader__dashboard, #reader__scan_region > button, .html5-qrcode-anchor-scan-type-change { display: none !important; }

        .frame { position: absolute; top: 50%; left: 50%; width: 70%; aspect-ratio: 1/1; transform: translate(-50%, -50%); z-index: 3; pointer-events: none; }
        .corner { position: absolute; width: 28px; height: 28px; border: 3px solid var(--primary); box-shadow: 0 0 10px var(--primary-glow); }
        .tl { top:0; left:0; border-right:0; border-bottom:0; border-radius: 6px 0 0 0; }
        .tr { top:0; right:0; border-left:0; border-bottom:0; border-radius: 0 6px 0 0; }
        .bl { bottom:0; left:0; border-right:0; border-top:0; border-radius: 0 0 0 6px; }
        .br { bottom:0; right:0; border-left:0; border-top:0; border-radius: 0 0 6px 0; }
        .laser { position: absolute; top: 0; left: 10%; width: 80%; height: 2px; background: var(--primary); box-shadow: 0 0 8px var(--primary); animation: scan 1.8s ease-in-out infinite; }
        @keyframes scan { 0%,100% { top: 15%; opacity:0; } 50% { top: 85%; opacity:1; } }
        
        .status-badge { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.65); padding: 0.35rem 0.8rem; border-radius: 20px; font-size: 0.8rem; color: #e2e8f0; z-index: 4; display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #475569; transition: 0.3s; }
        .dot.live { background: var(--success); box-shadow: 0 0 8px var(--success); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-top: 1rem; }
        button, .file-label { padding: 0.85rem; border: none; border-radius: 12px; font-family: inherit; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: 0.25s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid var(--border); }
        button:hover, .file-label:hover { background: rgba(255,255,255,0.12); transform: translateY(-2px); }
        .btn-primary { background: var(--primary); color: #fff; border: none; box-shadow: 0 4px 14px var(--primary-glow); }
        .btn-primary:hover { background: #2563eb; }
        #file-input { display: none; }

        .history { display: none; }
        .history.active { display: block; animation: up 0.3s ease; }
        @keyframes up { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
        .hist-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
        .hist-header h3 { font-size: 1rem; }
        .clear-btn { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 0.3rem 0.7rem; font-size: 0.8rem; }
        .clear-btn:hover { color: #ef4444; border-color: #ef4444; }
        .log { list-style: none; max-height: 180px; overflow-y: auto; }
        .log li { padding: 0.6rem 0.8rem; background: rgba(255,255,255,0.03); border-radius: 8px; margin-bottom: 0.5rem; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }
        .log li a { color: var(--primary); text-decoration: none; word-break: break-all; flex: 1; margin-left: 8px; }
        .log li span { color: var(--muted); font-size: 0.75rem; white-space: nowrap; }

        footer { text-align: center; padding: 1.5rem 1rem; color: var(--muted); font-size: 0.75rem; border-top: 1px solid var(--border); margin-top: auto; }
        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-15px); background: var(--success); color: #022c22; padding: 0.7rem 1rem; border-radius: 30px; font-weight: 600; font-size: 0.9rem; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4); z-index: 999; opacity: 0; transition: 0.3s; pointer-events: none; }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <header>
        <h1>ALHYTHAM QR</h1>
        <p>مسح سريع • توجيه تلقائي • متوافق مع جميع المتصفحات</p>
    </header>

    <main>
        <div class="glass">
            <div class="scanner-wrap">
                <div id="reader"></div>
                <div class="status-badge"><div class="dot" id="cam-dot"></div><span id="cam-status">جاري التهيئة...</span></div>
                <div class="frame">
                    <div class="corner tl"></div><div class="corner tr"></div>
                    <div class="corner bl"></div><div class="corner br"></div>
                    <div class="laser"></div>
                </div>
            </div>
            <div class="controls">
                <button id="switch-btn" class="btn-primary">🔄 تبديل الكاميرا</button>
                <label for="file-input" class="file-label">🖼️ مسح من صورة</label>
                <input type="file" id="file-input" accept="image/*">
                <button id="pause-btn" style="grid-column: span 2; background: rgba(255,255,255,0.04);">⏸ إيقاف مؤقت</button>
            </div>
        </div>

        <div id="history-box" class="glass history">
            <div class="hist-header">
                <h3>📜 سجل المسح المحلي</h3>
                <div style="display:flex; gap:0.5rem;">
                    <button id="export-btn" class="clear-btn" style="color:var(--success); border-color:var(--success);">💾 تصدير</button>
                    <button id="clear-hist" class="clear-btn">🗑️ مسح</button>
                </div>
            </div>
            <ul class="log" id="log-list"></ul>
        </div>
    </main>

    <footer>Powered by ALHYTHAM Tech • © 2026</footer>
    <div id="toast"></div>

    <script>
        const reader = document.getElementById('reader');
        const switchBtn = document.getElementById('switch-btn');
        const fileInput = document.getElementById('file-input');
        const pauseBtn = document.getElementById('pause-btn');
        const camDot = document.getElementById('cam-dot');
        const camStatus = document.getElementById('cam-status');
        const historyBox = document.getElementById('history-box');
        const logList = document.getElementById('log-list');
        const clearHist = document.getElementById('clear-hist');
        const exportBtn = document.getElementById('export-btn');
        const toast = document.getElementById('toast');

        let html5QrCode = null;
        let currentFacing = "environment";
        let isScanning = false;

        function init() { if (!html5QrCode) html5QrCode = new Html5Qrcode("reader"); }

        function playBeep() {
            try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = 1200; g.gain.value = 0.1; o.start(); o.stop(c.currentTime + 0.1); } catch(e){}
        }
        function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2500); }

        function processResult(decodedText) {
            let url = decodedText.trim();
            if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
            try { navigator.clipboard.writeText(url); } catch(e){}
            playBeep(); if (navigator.vibrate) navigator.vibrate(100);

            const history = JSON.parse(localStorage.getItem('qr_history') || '[]');
            history.unshift({ url, time: new Date().toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}) });
            if (history.length > 50) history.pop();
            localStorage.setItem('qr_history', JSON.stringify(history));
            renderHistory();

            camStatus.textContent = '✅ جاري التوجيه...';
            camDot.classList.remove('live');
            showToast('تم النسخ والتوجيه التلقائي');
            window.location.replace(url);
        }

        function handleCameraError(err) {
            console.warn("Camera init failed:", err);
            camStatus.textContent = '⚠️ تعذر الوصول للكاميرا';
            camDot.classList.remove('live');

            // 🔄 Auto-Redirect to Chrome on failure (Android)
            if (/Android/i.test(navigator.userAgent)) {
                const fallbackUrl = window.location.href;
                const intentUrl = `intent://${window.location.host}${window.location.pathname}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(fallbackUrl)};end`;
                window.location.href = intentUrl;
                showToast('جارٍ التحويل إلى Chrome...');
            } else {
                showToast('يرجى فتح الموقع عبر متصفح Chrome أو Safari');
            }
        }

        function startCamera(facing) {
            init();
            currentFacing = facing;
            isScanning = true;
            camStatus.textContent = '🔍 جاري المسح السريع...';
            camDot.classList.add('live');

            const config = {
                fps: 24, // ⚡ سرعة مثالية بين السلاسة والأداء
                qrbox: { width: 230, height: 230 }, // 🎯 مربع أصغر = معالجة أسرع
                aspectRatio: 1.0,
                useBarCodeDetectorIfSupported: true, // 🚀 استخدام API الأصلي للأسرع
                videoConstraints: {
                    facingMode: facing,
                    width: { ideal: 1920, min: 1280 }, // ✅ متوافق مع Safari/Firefox/Chrome
                    height: { ideal: 1080, min: 720 },
                    advanced: [
                        { focusMode: "continuous" },
                        { exposureMode: "continuous" }
                    ]
                }
            };

            html5QrCode.start({ facingMode: facing }, config, processResult, () => {})
                .catch(handleCameraError);
        }

        function stopCamera() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    isScanning = false;
                    camDot.classList.remove('live');
                    camStatus.textContent = '⏸ متوقف مؤقتاً';
                }).catch(() => {});
            }
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('qr_history') || '[]');
            if (history.length === 0) { historyBox.classList.remove('active'); return; }
            historyBox.classList.add('active');
            logList.innerHTML = history.map(h => `<li><a href="${h.url}" target="_blank" rel="noopener">${h.url}</a><span>${h.time}</span></li>`).join('');
        }

        document.addEventListener('DOMContentLoaded', () => { startCamera('environment'); renderHistory(); });

        switchBtn.addEventListener('click', () => {
            if (!isScanning) { startCamera('environment'); return; }
            const next = currentFacing === "environment" ? "user" : "environment";
            stopCamera(); setTimeout(() => startCamera(next), 400);
        });

        pauseBtn.addEventListener('click', () => {
            if (!isScanning) { startCamera(currentFacing); pauseBtn.textContent = '⏸ إيقاف مؤقت'; pauseBtn.style.background = 'rgba(255,255,255,0.04)'; }
            else { stopCamera(); pauseBtn.textContent = '▶️ استئناف'; pauseBtn.style.background = 'var(--primary)'; }
        });

        fileInput.addEventListener('change', (e) => {
            const f = e.target.files[0]; if (!f) return;
            stopCamera(); camStatus.textContent = '🔍 تحليل...'; init();
            html5QrCode.scanFile(f, true).then(processResult).catch(() => { camStatus.textContent = '❌ فشل القراءة'; showToast('تأكد من وضوح الباركود'); });
        });

        clearHist.addEventListener('click', () => { localStorage.removeItem('qr_history'); renderHistory(); showToast('تم مسح السجل'); });
        exportBtn.addEventListener('click', () => {
            const history = JSON.parse(localStorage.getItem('qr_history') || '[]');
            if (!history.length) return showToast('السجل فارغ');
            const txt = history.map(h => `[${h.time}] ${h.url}`).join('\n');
            const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type:'text/plain'}));
            a.download = `ALHYTHAM_QR_${new Date().toISOString().slice(0,10)}.txt`; a.click(); showToast('تم التصدير');
        });

        window.addEventListener('beforeunload', () => { if(isScanning) stopCamera(); });
    </script>
</body>
</html>
