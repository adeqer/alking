<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="true">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0e27">
    <title>ALHYTHAM.NET - ماسح الكود الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        :root {
            --gold-primary: #d4af37;
            --gold-light: #f4e4c1;
            --gold-dark: #aa8c2c;
            --dark-bg: #0a0e27;
            --dark-card: #1a1f3a;
            --text-light: #e8e8e8;
            --text-dark: #0a0e27;
            --accent: #ffd700;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1f3a 50%, #0f1429 100%);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            -webkit-user-select: none;
            user-select: none;
        }

        /* خلفية متحركة */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            padding: 15px;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* رأس الصفحة */
        .header {
            text-align: center;
            margin-bottom: 20px;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold-primary) 0%, var(--gold-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 12px;
            color: var(--gold-light);
            letter-spacing: 2px;
            font-weight: 300;
        }

        /* بطاقة الكاميرا */
        .camera-container {
            background: var(--dark-card);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(212, 175, 55, 0.15),
                        0 0 40px rgba(212, 175, 55, 0.1);
            border: 2px solid rgba(212, 175, 55, 0.3);
            animation: scaleIn 0.8s ease-out;
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 550px;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* تأثير الضوء على البطاقة */
        .camera-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 30%, rgba(212, 175, 55, 0.1) 50%, transparent 70%);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translate(-100%, -100%) rotate(45deg); }
            100% { transform: translate(100%, 100%) rotate(45deg); }
        }

        .camera-box {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid var(--gold-primary);
            z-index: 1;
            box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.2);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            -webkit-transform: scaleX(-1);
            transform: scaleX(-1);
        }

        /* حالة عدم توفر الكاميرا */
        .camera-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-size: 16px;
            color: var(--gold-light);
            flex-direction: column;
            gap: 10px;
        }

        .camera-placeholder span {
            font-size: 32px;
        }

        /* شريط الحالة */
        .status-bar {
            margin-top: 12px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            text-align: center;
            font-size: 12px;
            color: var(--gold-light);
            min-height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite;
            word-wrap: break-word;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .status-bar.success {
            background: rgba(76, 175, 80, 0.2);
            border-color: #4caf50;
            color: #4caf50;
            animation: none;
        }

        .status-bar.error {
            background: rgba(244, 67, 54, 0.2);
            border-color: #f44336;
            color: #f44336;
        }

        /* الأزرار */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 550px;
            margin-bottom: 15px;
        }

        .btn {
            padding: 14px 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            -webkit-user-select: none;
            user-select: none;
        }

        /* تأثير 3D للأزرار */
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn:active::before {
            opacity: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold-primary) 0%, var(--gold-light) 100%);
            color: var(--text-dark);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4),
                        0 5px 15px rgba(212, 175, 55, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        .btn-primary:active {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3),
                        inset 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #2a2f4a 0%, #1a1f3a 100%);
            color: var(--gold-light);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5),
                        0 5px 15px rgba(212, 175, 55, 0.2),
                        inset 0 1px 0 rgba(212, 175, 55, 0.3);
            border: 2px solid rgba(212, 175, 55, 0.4);
            transform: translateY(-3px);
        }

        .btn-secondary:active {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2),
                        inset 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        /* أيقونة الزر */
        .btn span {
            font-size: 16px;
        }

        /* التذييل */
        .footer {
            text-align: center;
            font-size: 11px;
            color: rgba(212, 175, 55, 0.6);
            letter-spacing: 0.5px;
        }

        .footer a {
            color: var(--gold-primary);
            text-decoration: none;
        }

        /* الـ Canvas المخفي */
        #qr-canvas {
            display: none;
        }

        /* تأثير النجاح */
        @keyframes successPulse {
            0% {
                box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7),
                            inset 0 0 20px rgba(212, 175, 55, 0.2);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(76, 175, 80, 0),
                            inset 0 0 20px rgba(212, 175, 55, 0.2);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(76, 175, 80, 0),
                            inset 0 0 20px rgba(212, 175, 55, 0.2);
            }
        }

        .camera-box.success {
            animation: successPulse 0.6s;
        }

        /* استجابة الهاتف */
        @media (max-height: 600px) {
            .logo {
                font-size: 32px;
            }

            .subtitle {
                font-size: 10px;
            }

            .camera-container {
                margin-bottom: 12px;
                padding: 10px;
            }

            .btn {
                padding: 12px 14px;
                font-size: 11px;
            }

            .status-bar {
                padding: 8px;
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }

            .logo {
                font-size: 36px;
            }

            .subtitle {
                font-size: 11px;
            }
        }

        /* إخفاء عناصر غير ضرورية */
        .permission-prompt {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--dark-card);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid var(--gold-primary);
            z-index: 1000;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .permission-prompt.show {
            display: block;
            animation: slideUp 0.3s ease-out;
        }

        .permission-prompt h3 {
            color: var(--gold-primary);
            margin-bottom: 10px;
        }

        .permission-prompt p {
            color: var(--text-light);
            margin-bottom: 15px;
            font-size: 14px;
        }

        .permission-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .permission-buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Cairo', sans-serif;
        }

        .permission-buttons .btn-allow {
            background: linear-gradient(135deg, var(--gold-primary) 0%, var(--gold-light) 100%);
            color: var(--text-dark);
        }

        .permission-buttons .btn-deny {
            background: #333;
            color: var(--text-light);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الرأس -->
        <div class="header">
            <div class="logo">ALHYTHAM</div>
            <div class="subtitle">ماسح الكود الذكي</div>
        </div>

        <!-- الكاميرا -->
        <div class="camera-container">
            <div class="camera-box" id="camera-box">
                <video id="v" autoplay playsinline muted webkit-playsinline></video>
                <div class="camera-placeholder" id="placeholder" style="display: none;">
                    <span>📷</span>
                    <div>جاري تحميل الكاميرا...</div>
                </div>
            </div>
            <div class="status-bar" id="status">
                <span id="status-text">جاري تفعيل الكاميرا...</span>
            </div>
        </div>

        <!-- الأزرار -->
        <div class="controls">
            <button class="btn btn-primary" onclick="reloadCamera();" id="reload-btn">
                <span>🔄</span> تحديث
            </button>
            <button class="btn btn-secondary" onclick="requestCameraPermission();" id="permission-btn">
                <span>🔐</span> صلاحيات
            </button>
        </div>

        <!-- التذييل -->
        <div class="footer">
            © 2026 ALHYTHAM.NET
        </div>
    </div>

    <!-- الـ Canvas المخفي -->
    <canvas id="qr-canvas"></canvas>

    <!-- مكتبة قراءة QR Code -->
    <script src="https://cdn.jsdelivr.net/npm/jsqrcode@0.0.10/dist/jsqrcode.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>

    <script>
        const video = document.getElementById('v');
        const canvas = document.getElementById('qr-canvas');
        const context = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        const statusText = document.getElementById('status-text');
        const cameraBox = document.getElementById('camera-box');
        const placeholder = document.getElementById('placeholder');
        const reloadBtn = document.getElementById('reload-btn');
        const permissionBtn = document.getElementById('permission-btn');

        let isScanning = false;
        let lastScannedCode = '';
        let codeReader = null;

        // تهيئة مكتبة ZXing
        try {
            const ZXing = window.ZXing;
            if (ZXing) {
                codeReader = new ZXing.BrowserMultiFormatReader();
            }
        } catch (e) {
            console.log('ZXing library not available');
        }

        // طلب صلاحيات الكاميرا تلقائياً
        function requestCameraPermission() {
            startCamera();
        }

        // إعادة تحميل الكاميرا
        function reloadCamera() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            isScanning = false;
            lastScannedCode = '';
            startCamera();
        }

        // بدء الكاميرا مع محاولات متعددة
        async function startCamera() {
            try {
                statusText.textContent = '⏳ جاري تفعيل الكاميرا...';
                statusDiv.className = 'status-bar';
                placeholder.style.display = 'none';

                // محاولة الحصول على الكاميرا الخلفية أولاً
                const constraints = {
                    video: {
                        facingMode: { ideal: 'environment' },
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        aspectRatio: { ideal: 4/3 }
                    },
                    audio: false
                };

                let stream = null;

                try {
                    // محاولة الكاميرا الخلفية
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (err) {
                    console.log('Back camera not available, trying any camera');
                    // محاولة أي كاميرا متاحة
                    try {
                        stream = await navigator.mediaDevices.getUserMedia({
                            video: true,
                            audio: false
                        });
                    } catch (err2) {
                        throw err2;
                    }
                }

                video.srcObject = stream;
                video.setAttribute('playsinline', 'true');
                video.setAttribute('webkit-playsinline', 'true');
                video.setAttribute('muted', 'true');
                video.play();

                statusText.textContent = '✓ الكاميرا جاهزة - وجه الكود نحو الكاميرا';
                statusDiv.className = 'status-bar success';
                reloadBtn.disabled = false;
                permissionBtn.disabled = false;

                // بدء المسح
                setTimeout(() => {
                    isScanning = true;
                    scanQRCode();
                }, 500);

            } catch (err) {
                console.error('خطأ في الوصول للكاميرا:', err);
                statusText.textContent = '❌ تعذر الوصول للكاميرا - تحقق من الأذونات';
                statusDiv.className = 'status-bar error';
                placeholder.style.display = 'flex';
                placeholder.innerHTML = '<span>📷</span><div>تعذر فتح الكاميرا<br>تحقق من الأذونات</div>';
                reloadBtn.disabled = false;
                permissionBtn.disabled = false;
            }
        }

        // مسح QR Code باستخدام ZXing
        async function scanQRCode() {
            if (!isScanning) return;

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                try {
                    canvas.height = video.videoHeight;
                    canvas.width = video.videoWidth;
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);

                    // محاولة استخدام ZXing
                    if (codeReader) {
                        try {
                            const result = await codeReader.decodeFromCanvas(canvas);
                            if (result && result.text && result.text !== lastScannedCode) {
                                lastScannedCode = result.text;
                                onQRCodeScanned(result.text);
                            }
                        } catch (e) {
                            // لم يتم العثور على QR Code
                        }
                    } else {
                        // محاولة استخدام jsqrcode كبديل
                        try {
                            const code = decodeQRCode(canvas);
                            if (code && code !== lastScannedCode) {
                                lastScannedCode = code;
                                onQRCodeScanned(code);
                            }
                        } catch (e) {
                            // لم يتم العثور على QR Code
                        }
                    }
                } catch (e) {
                    // خطأ في المعالجة
                }
            }

            requestAnimationFrame(scanQRCode);
        }

        // فك تشفير QR Code باستخدام jsqrcode
        function decodeQRCode(canvas) {
            try {
                if (typeof QRCode !== 'undefined') {
                    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                    return QRCode.decode(imageData);
                }
            } catch (e) {
                // لا توجد مكتبة
            }
            return null;
        }

        // معالجة النتيجة
        function onQRCodeScanned(code) {
            statusText.textContent = `✓ تم المسح: ${code.substring(0, 25)}${code.length > 25 ? '...' : ''}`;
            statusDiv.className = 'status-bar success';
            cameraBox.classList.add('success');

            console.log('QR Code Scanned:', code);

            // إذا كان رابطاً، افتحه
            if (code.startsWith('http://') || code.startsWith('https://')) {
                setTimeout(() => {
                    window.location.href = code;
                }, 1000);
            } else {
                // إذا كان كود، اعرضه في التنبيه
                console.log('الكود الممسوح:', code);
            }

            // إعادة تعيين بعد 2 ثانية
            setTimeout(() => {
                lastScannedCode = '';
                cameraBox.classList.remove('success');
                statusText.textContent = '✓ الكاميرا جاهزة - وجه الكود نحو الكاميرا';
                statusDiv.className = 'status-bar success';
            }, 2000);
        }

        // بدء التطبيق
        window.addEventListener('load', () => {
            // محاولة الوصول للكاميرا تلقائياً عند التحميل
            startCamera();
        });

        // إيقاف الكاميرا عند إغلاق الصفحة
        window.addEventListener('beforeunload', () => {
            isScanning = false;
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
        });

        // التعامل مع تغيير الرؤية
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                isScanning = false;
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                }
            } else {
                startCamera();
            }
        });

        // منع الشاشة من الإغلاق (إن أمكن)
        if ('wakeLock' in navigator) {
            navigator.wakeLock.request('screen').catch(err => {
                console.log('Wake Lock not available');
            });
        }
    </script>
</body>
</html>
