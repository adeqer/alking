<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALHYTHAM QR - النسخة المستقرة</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Using a more stable version of the library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .glass {
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #reader {
            width: 100% !important;
            border: none !important;
            border-radius: 20px;
            overflow: hidden;
        }
        #reader video {
            object-fit: cover !important;
            border-radius: 20px;
        }
        .nav-active {
            color: #3b82f6;
            border-top: 2px solid #3b82f6;
        }
        /* Custom Switch */
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333; transition: .4s; border-radius: 20px;
        }
        .slider:before {
            position: absolute; content: ""; height: 14px; width: 14px;
            left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #3b82f6; }
        input:checked + .slider:before { transform: translateX(20px); }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="p-4 flex justify-between items-center glass sticky top-0 z-50">
        <h1 class="text-xl font-black text-blue-500">ALHYTHAM QR</h1>
        <button onclick="location.reload()" class="text-zinc-400"><i class="fas fa-sync-alt"></i></button>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-4 overflow-y-auto pb-24">
        
        <!-- Scanner Section -->
        <div id="section-scan" class="tab-content space-y-4">
            <div class="relative bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-800">
                <div id="reader"></div>
                
                <!-- Controls -->
                <div class="absolute bottom-4 left-4 right-4 flex justify-between items-center z-10">
                    <div class="flex gap-2">
                        <button onclick="switchCamera()" class="w-12 h-12 rounded-xl glass flex items-center justify-center"><i class="fas fa-camera-rotate"></i></button>
                        <button onclick="toggleFlash()" class="w-12 h-12 rounded-xl glass flex items-center justify-center"><i class="fas fa-bolt"></i></button>
                    </div>
                    <label class="w-12 h-12 rounded-xl bg-blue-600 flex items-center justify-center cursor-pointer">
                        <i class="fas fa-image"></i>
                        <input type="file" accept="image/*" class="hidden" onchange="handleFileUpload(this)">
                    </label>
                </div>
            </div>

            <!-- Settings -->
            <div class="glass p-4 rounded-2xl flex justify-between items-center">
                <span class="text-sm font-bold">الفتح التلقائي للروابط</span>
                <label class="switch">
                    <input type="checkbox" id="auto-open" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <!-- Result -->
            <div id="result-box" class="hidden glass p-5 rounded-2xl border-r-4 border-blue-500">
                <p class="text-xs text-blue-500 font-bold mb-2">النتيجة:</p>
                <p id="result-text" class="text-sm break-all mb-4 font-mono text-left dir-ltr"></p>
                <div class="flex gap-2">
                    <button onclick="copyResult()" class="flex-1 bg-zinc-800 py-2 rounded-lg text-sm">نسخ</button>
                    <a id="result-link" href="#" target="_blank" class="hidden flex-1 bg-blue-600 py-2 rounded-lg text-sm text-center">فتح</a>
                </div>
            </div>
        </div>

        <!-- Create Section -->
        <div id="section-create" class="tab-content hidden space-y-4">
            <div class="glass p-6 rounded-2xl space-y-4">
                <textarea id="qr-input" rows="3" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-4 outline-none text-right" placeholder="أدخل النص هنا..."></textarea>
                <button onclick="generateQR()" class="w-full bg-blue-600 py-3 rounded-xl font-bold">توليد كود QR</button>
                <div id="qr-output" class="flex flex-col items-center gap-4 hidden pt-4">
                    <div id="qrcode" class="p-3 bg-white rounded-xl"></div>
                    <button onclick="downloadQR()" class="text-sm text-blue-400">تحميل الصورة</button>
                </div>
            </div>
        </div>

        <!-- History Section -->
        <div id="section-history" class="tab-content hidden space-y-2">
            <div id="history-list"></div>
        </div>

    </main>

    <!-- Footer Nav -->
    <nav class="fixed bottom-0 left-0 right-0 h-16 glass flex items-center justify-around z-50">
        <button onclick="showTab('scan')" id="nav-scan" class="flex flex-col items-center gap-1 nav-active flex-1 py-2">
            <i class="fas fa-expand"></i><span class="text-[10px]">ماسح</span>
        </button>
        <button onclick="showTab('create')" id="nav-create" class="flex flex-col items-center gap-1 text-zinc-500 flex-1 py-2">
            <i class="fas fa-plus"></i><span class="text-[10px]">إنشاء</span>
        </button>
        <button onclick="showTab('history')" id="nav-history" class="flex flex-col items-center gap-1 text-zinc-500 flex-1 py-2">
            <i class="fas fa-history"></i><span class="text-[10px]">سجل</span>
        </button>
    </nav>

    <script>
        let scanner = null;
        let currentCameraId = null;
        let cameras = [];
        let isFlashOn = false;

        // --- Core Logic ---
        async function startScanner() {
            if (scanner) return;
            scanner = new Html5Qrcode("reader");
            try {
                cameras = await Html5Qrcode.getCameras();
                if (cameras.length > 0) {
                    currentCameraId = cameras.find(c => c.label.toLowerCase().includes('back'))?.id || cameras[0].id;
                    await scanner.start(currentCameraId, { fps: 10, qrbox: 250 }, onScanSuccess);
                } else {
                    Swal.fire("خطأ", "لم يتم العثور على كاميرا", "error");
                }
            } catch (e) {
                console.error(e);
                Swal.fire("تنبيه", "يرجى السماح بالوصول للكاميرا", "info");
            }
        }

        function onScanSuccess(text) {
            if (navigator.vibrate) navigator.vibrate(100);
            
            // Auto Open Logic
            if (document.getElementById('auto-open').checked && text.startsWith('http')) {
                window.location.href = text;
                return;
            }

            document.getElementById('result-box').classList.remove('hidden');
            document.getElementById('result-text').innerText = text;
            const link = document.getElementById('result-link');
            if (text.startsWith('http')) {
                link.href = text;
                link.classList.remove('hidden');
            } else {
                link.classList.add('hidden');
            }
            saveToHistory(text);
        }

        async function switchCamera() {
            if (!scanner || cameras.length < 2) return;
            await scanner.stop();
            const idx = cameras.findIndex(c => c.id === currentCameraId);
            currentCameraId = cameras[(idx + 1) % cameras.length].id;
            await scanner.start(currentCameraId, { fps: 10, qrbox: 250 }, onScanSuccess);
        }

        async function toggleFlash() {
            if (!scanner) return;
            try {
                isFlashOn = !isFlashOn;
                await scanner.applyVideoConstraints({ advanced: [{ torch: isFlashOn }] });
            } catch (e) {
                Swal.fire({ toast: true, title: "الكشاف غير مدعوم", icon: "info", showConfirmButton: false, timer: 1500 });
            }
        }

        // --- File Upload (Fixed) ---
        async function handleFileUpload(input) {
            if (!input.files.length) return;
            const file = input.files[0];
            
            // Use a separate instance for file scanning to avoid conflicts
            const fileScanner = new Html5Qrcode("reader");
            Swal.fire({ title: 'جاري الفحص...', didOpen: () => Swal.showLoading() });
            
            try {
                // If camera is running, we must stop it first
                if (scanner && scanner.isScanning) await scanner.stop();
                
                const result = await fileScanner.scanFile(file, true);
                Swal.close();
                onScanSuccess(result);
                
                // Restart camera after file scan
                if (scanner) startScanner();
            } catch (err) {
                Swal.fire("خطأ", "لم يتم العثور على كود في الصورة", "error");
                if (scanner) startScanner();
            }
        }

        // --- UI Logic ---
        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active', 'text-blue-500'));
            document.querySelectorAll('nav button').forEach(b => b.classList.add('text-zinc-500'));

            document.getElementById(`section-${id}`).classList.remove('hidden');
            document.getElementById(`nav-${id}`).classList.add('nav-active', 'text-blue-500');
            document.getElementById(`nav-${id}`).classList.remove('text-zinc-500');

            if (id === 'scan') startScanner();
            if (id === 'history') renderHistory();
        }

        function generateQR() {
            const val = document.getElementById('qr-input').value;
            if (!val) return;
            const out = document.getElementById('qrcode');
            out.innerHTML = '';
            new QRCode(out, { text: val, width: 150, height: 150 });
            document.getElementById('qr-output').classList.remove('hidden');
        }

        function saveToHistory(text) {
            let h = JSON.parse(localStorage.getItem('h') || '[]');
            h.unshift({ text, date: new Date().toLocaleString('ar-EG') });
            localStorage.setItem('h', JSON.stringify(h.slice(0, 20)));
        }

        function renderHistory() {
            const h = JSON.parse(localStorage.getItem('h') || '[]');
            const list = document.getElementById('history-list');
            list.innerHTML = h.map(i => `
                <div class="glass p-3 rounded-xl mb-2 flex justify-between items-center">
                    <div class="truncate flex-1 mr-2 text-xs font-mono text-left dir-ltr">${i.text}</div>
                    <button onclick="navigator.clipboard.writeText('${i.text}')" class="text-blue-500 text-xs">نسخ</button>
                </div>
            `).join('') || '<p class="text-center text-zinc-600 py-10">السجل فارغ</p>';
        }

        function copyResult() {
            navigator.clipboard.writeText(document.getElementById('result-text').innerText);
            Swal.fire({ toast: true, title: "تم النسخ", icon: "success", showConfirmButton: false, timer: 1000 });
        }

        function downloadQR() {
            const img = document.querySelector('#qrcode img');
            const a = document.createElement('a');
            a.href = img.src;
            a.download = 'qr.png';
            a.click();
        }

        // Init
        window.onload = () => startScanner();
    </script>
</body>
</html>
