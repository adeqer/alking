<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALHYTHAM QR ELITE - النسخة النهائية</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --accent: #3b82f6;
            --bg: #000000;
            --card: #0a0a0a;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: #ffffff;
            overflow-x: hidden;
        }

        .elite-glass {
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.3);
        }

        #reader {
            border: none !important;
            border-radius: 32px;
            overflow: hidden;
            background: #000;
        }

        #reader video { object-fit: cover !important; }

        /* Custom Switch */
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #222; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 20px; width: 20px;
            left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* Animations */
        @keyframes scan-line { 0% { top: 0%; } 100% { top: 100%; } }
        .scan-anim::after {
            content: ""; position: absolute; left: 0; width: 100%; height: 3px;
            background: var(--accent); box-shadow: 0 0 20px var(--accent);
            animation: scan-line 2.5s linear infinite; z-index: 10;
        }

        .btn-hover:active { transform: scale(0.95); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="p-6 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center shadow-2xl shadow-blue-900/40">
                <i class="fas fa-qrcode text-2xl"></i>
            </div>
            <div>
                <h1 class="text-2xl font-black tracking-tight leading-none">ALHYTHAM <span class="text-blue-500">QR</span></h1>
                <span class="text-[10px] text-zinc-500 font-bold uppercase tracking-widest">Elite Edition</span>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="location.reload()" class="w-11 h-11 rounded-2xl bg-zinc-900 flex items-center justify-center border border-zinc-800">
                <i class="fas fa-redo-alt text-zinc-400"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 px-6 pb-32 space-y-6">
        
        <!-- Scanner Section -->
        <section id="section-scan" class="tab-content space-y-6">
            <div class="relative rounded-[40px] overflow-hidden shadow-2xl border border-zinc-800 bg-zinc-900">
                <div id="reader" class="w-full aspect-square scan-anim"></div>
                
                <!-- Overlay Controls -->
                <div class="absolute bottom-6 left-6 right-6 flex justify-between items-center z-20">
                    <div class="flex gap-3">
                        <button onclick="toggleCamera()" class="w-14 h-14 rounded-2xl elite-glass flex items-center justify-center text-white btn-hover">
                            <i class="fas fa-camera-rotate text-lg"></i>
                        </button>
                        <button onclick="toggleFlash()" id="flash-btn" class="w-14 h-14 rounded-2xl elite-glass flex items-center justify-center text-white btn-hover">
                            <i class="fas fa-bolt text-lg"></i>
                        </button>
                    </div>
                    
                    <!-- Image Upload Button -->
                    <label class="w-14 h-14 rounded-2xl bg-blue-600 flex items-center justify-center text-white btn-hover cursor-pointer shadow-lg shadow-blue-900/40">
                        <i class="fas fa-image text-lg"></i>
                        <input type="file" id="qr-file-input" accept="image/*" class="hidden" onchange="scanImage(this)">
                    </label>
                </div>
            </div>

            <!-- Quick Settings -->
            <div class="elite-glass p-5 rounded-3xl flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-blue-500/10 rounded-xl flex items-center justify-center">
                        <i class="fas fa-link text-blue-500"></i>
                    </div>
                    <div>
                        <p class="text-sm font-black">الفتح التلقائي</p>
                        <p class="text-[10px] text-zinc-500">فتح الروابط فوراً عند المسح</p>
                    </div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="auto-open-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <!-- Result Card (Hidden) -->
            <div id="result-card" class="hidden elite-glass p-6 rounded-[32px] border-r-4 border-blue-500 animate-in fade-in slide-in-from-bottom-4 duration-500">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-xs font-black text-blue-500 uppercase tracking-widest">النتيجة المكتشفة</span>
                    <span id="result-time" class="text-[10px] text-zinc-500"></span>
                </div>
                <p id="result-text" class="text-lg font-bold break-all mb-6 text-left dir-ltr leading-relaxed"></p>
                <div class="flex gap-3">
                    <button onclick="copyResult()" class="flex-1 bg-zinc-800 hover:bg-zinc-700 py-4 rounded-2xl font-black transition-all">نسخ</button>
                    <a id="result-link" href="#" target="_blank" class="hidden flex-1 bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-black text-center transition-all">زيارة</a>
                </div>
            </div>
        </section>

        <!-- Create Section -->
        <section id="section-create" class="tab-content hidden space-y-6">
            <div class="elite-glass p-8 rounded-[40px] space-y-6">
                <div class="space-y-2">
                    <label class="text-sm font-black text-zinc-400 mr-2">محتوى الكود</label>
                    <textarea id="qr-input" rows="4" class="w-full bg-zinc-900/50 border border-zinc-800 rounded-3xl p-6 outline-none focus:border-blue-500 transition-all text-right text-lg" placeholder="اكتب هنا..."></textarea>
                </div>
                <button onclick="generateQR()" class="w-full bg-blue-600 hover:bg-blue-500 py-5 rounded-3xl font-black text-xl shadow-xl shadow-blue-900/30 transition-all">توليد الكود</button>
                
                <div id="qr-output-container" class="hidden flex flex-col items-center gap-8 pt-8 border-t border-zinc-800">
                    <div id="qrcode" class="p-6 bg-white rounded-[32px] shadow-2xl"></div>
                    <button onclick="downloadQR()" class="w-full bg-zinc-800 py-4 rounded-2xl font-black border border-zinc-700">تحميل الصورة</button>
                </div>
            </div>
        </section>

        <!-- History Section -->
        <section id="section-history" class="tab-content hidden space-y-4">
            <div class="flex justify-between items-center px-4">
                <h3 class="font-black text-2xl">السجل</h3>
                <button onclick="clearHistory()" class="text-red-500 font-bold text-sm">مسح الكل</button>
            </div>
            <div id="history-list" class="space-y-3">
                <!-- Items -->
            </div>
        </section>

    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-8 left-8 right-8 h-20 elite-glass rounded-[32px] flex items-center px-2 z-50 shadow-2xl">
        <button onclick="switchTab('scan')" id="nav-scan" class="nav-btn active flex-1 h-16 rounded-[24px] flex flex-col items-center justify-center gap-1 transition-all">
            <i class="fas fa-expand-alt"></i>
            <span class="text-[10px] font-black">ماسح</span>
        </button>
        <button onclick="switchTab('create')" id="nav-create" class="nav-btn flex-1 h-16 rounded-[24px] flex flex-col items-center justify-center gap-1 text-zinc-500 transition-all">
            <i class="fas fa-magic"></i>
            <span class="text-[10px] font-black">إنشاء</span>
        </button>
        <button onclick="switchTab('history')" id="nav-history" class="nav-btn flex-1 h-16 rounded-[24px] flex flex-col items-center justify-center gap-1 text-zinc-500 transition-all">
            <i class="fas fa-layer-group"></i>
            <span class="text-[10px] font-black">سجل</span>
        </button>
    </nav>

    <script>
        let html5QrCode = null;
        let currentCameraId = null;
        let cameras = [];
        let isFlashOn = false;
        let history = JSON.parse(localStorage.getItem('alhytham_elite_history') || '[]');

        // --- Tab Management ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(el => {
                el.classList.remove('active', 'text-white');
                el.classList.add('text-zinc-500');
            });

            document.getElementById(`section-${tabId}`).classList.remove('hidden');
            const activeNav = document.getElementById(`nav-${tabId}`);
            activeNav.classList.add('active', 'text-white');
            activeNav.classList.remove('text-zinc-500');

            if (tabId === 'scan') {
                initScanner();
            } else {
                stopScanner();
            }
            if (tabId === 'history') renderHistory();
        }

        // --- Scanner Logic ---
        async function initScanner() {
            if (html5QrCode && html5QrCode.isScanning) return;
            html5QrCode = new Html5QrCode("reader");
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                stream.getTracks().forEach(track => track.stop());
                cameras = await Html5QrCode.getCameras();
                if (cameras && cameras.length > 0) {
                    const backCamera = cameras.find(c => c.label.toLowerCase().includes('back') || c.label.toLowerCase().includes('environment'));
                    currentCameraId = backCamera ? backCamera.id : cameras[0].id;
                    startCamera(currentCameraId);
                }
            } catch (err) {
                Swal.fire("تنبيه", "يرجى السماح بالوصول للكاميرا للمسح المباشر", "info");
            }
        }

        function startCamera(cameraId) {
            html5QrCode.start(cameraId, { fps: 25, qrbox: { width: 280, height: 280 } }, onScanSuccess, onScanFailure)
            .catch(err => console.error(err));
        }

        function onScanSuccess(decodedText) {
            if (navigator.vibrate) navigator.vibrate(150);
            
            const autoOpen = document.getElementById('auto-open-toggle').checked;
            addToHistory(decodedText);

            if (autoOpen && (decodedText.startsWith('http://') || decodedText.startsWith('https://'))) {
                window.location.href = decodedText;
                return;
            }

            const card = document.getElementById('result-card');
            const textEl = document.getElementById('result-text');
            const linkBtn = document.getElementById('result-link');
            
            card.classList.remove('hidden');
            textEl.innerText = decodedText;
            document.getElementById('result-time').innerText = new Date().toLocaleTimeString('ar-EG');

            if (decodedText.startsWith('http')) {
                linkBtn.href = decodedText;
                linkBtn.classList.remove('hidden');
            } else {
                linkBtn.classList.add('hidden');
            }
            card.scrollIntoView({ behavior: 'smooth' });
        }

        function onScanFailure(error) {}

        // --- Image Scan Logic ---
        async function scanImage(input) {
            if (!input.files || input.files.length === 0) return;
            const file = input.files[0];
            
            Swal.fire({ title: 'جاري التحليل...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            
            const tempScanner = new Html5QrCode("reader");
            try {
                const decodedText = await tempScanner.scanFile(file, true);
                Swal.close();
                onScanSuccess(decodedText);
            } catch (err) {
                Swal.fire("خطأ", "لم يتم العثور على كود QR في هذه الصورة", "error");
            }
        }

        async function toggleCamera() {
            if (!html5QrCode || cameras.length < 2) return;
            await html5QrCode.stop();
            const currentIndex = cameras.findIndex(c => c.id === currentCameraId);
            currentCameraId = cameras[(currentIndex + 1) % cameras.length].id;
            startCamera(currentCameraId);
        }

        async function toggleFlash() {
            if (!html5QrCode || !html5QrCode.isScanning) return;
            try {
                isFlashOn = !isFlashOn;
                await html5QrCode.applyVideoConstraints({ advanced: [{ torch: isFlashOn }] });
                document.getElementById('flash-btn').classList.toggle('text-yellow-500');
            } catch (e) {
                Swal.fire({ toast: true, title: "الكشاف غير مدعوم", icon: "info", showConfirmButton: false, timer: 1500 });
            }
        }

        function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().catch(console.error);
            }
        }

        // --- Generator ---
        function generateQR() {
            const input = document.getElementById('qr-input').value;
            if (!input) return Swal.fire("تنبيه", "أدخل نصاً أولاً", "warning");
            const qrDiv = document.getElementById('qrcode');
            qrDiv.innerHTML = '';
            new QRCode(qrDiv, { text: input, width: 250, height: 250, correctLevel: QRCode.CorrectLevel.H });
            document.getElementById('qr-output-container').classList.remove('hidden');
            Swal.fire({ icon: 'success', title: 'تم التوليد', timer: 1000, showConfirmButton: false });
        }

        function downloadQR() {
            const img = document.querySelector('#qrcode img');
            const link = document.createElement('a');
            link.download = 'ALHYTHAM-QR.png';
            link.href = img.src;
            link.click();
        }

        // --- History ---
        function addToHistory(content) {
            history.unshift({ content, time: new Date().toLocaleString('ar-EG') });
            if (history.length > 30) history.pop();
            localStorage.setItem('alhytham_elite_history', JSON.stringify(history));
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            if (history.length === 0) {
                list.innerHTML = '<div class="p-20 text-center text-zinc-700 font-bold">لا يوجد سجل</div>';
                return;
            }
            list.innerHTML = history.map(item => `
                <div class="elite-glass p-5 rounded-3xl flex justify-between items-center border border-zinc-900">
                    <div class="min-w-0 flex-1">
                        <p class="text-sm font-bold truncate dir-ltr text-left text-zinc-300">${item.content}</p>
                        <p class="text-[10px] text-zinc-600 mt-1 font-black">${item.time}</p>
                    </div>
                    <button onclick="copyRaw('${item.content}')" class="w-10 h-10 rounded-xl bg-zinc-900 flex items-center justify-center text-zinc-500"><i class="fas fa-copy"></i></button>
                </div>
            `).join('');
        }

        function clearHistory() {
            Swal.fire({ title: 'مسح السجل؟', icon: 'warning', showCancelButton: true, confirmButtonText: 'نعم', cancelButtonText: 'إلغاء' })
            .then(r => { if(r.isConfirmed) { history = []; localStorage.removeItem('alhytham_elite_history'); renderHistory(); }});
        }

        function copyResult() { copyRaw(document.getElementById('result-text').innerText); }
        function copyRaw(text) {
            navigator.clipboard.writeText(text);
            Swal.fire({ toast: true, title: "تم النسخ", icon: "success", showConfirmButton: false, timer: 1000 });
        }

        document.addEventListener('DOMContentLoaded', () => { initScanner(); });
    </script>
</body>
</html>
