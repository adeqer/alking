<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHYTHAM QR - الاحترافي</title>
    <!-- استخدام نفس المكتبات التي يعتمد عليها الموقع المرجعي لضمان الاستقرار -->
    <script src="https://webqr.com/llqrcode.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        #outdiv {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            border: 2px solid #8b5cf6;
            border-radius: 15px;
            overflow: hidden;
            background: #111;
            position: relative;
            aspect-ratio: 4/3;
        }

        video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }

        .scanner-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #8b5cf6;
            box-shadow: 0 0 15px #8b5cf6;
            animation: scan 2s linear infinite;
            z-index: 10;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            transition: all 0.3s;
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        #result {
            display: none;
        }
    </style>
</head>
<body class="p-4 flex flex-col items-center justify-center min-h-screen">

    <div class="w-full max-w-md text-center">
        <h1 class="text-4xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">
            ALHYTHAM QR
        </h1>
        <p class="text-gray-400 mb-8 text-sm">التوجيه التلقائي المباشر للروابط</p>

        <div class="glass-card p-6 shadow-2xl relative">
            <div id="outdiv">
                <video id="v" autoplay playsinline></video>
                <div class="scanner-line"></div>
            </div>

            <div class="flex gap-3 mt-6">
                <button onclick="location.reload()" class="flex-1 bg-gray-800 hover:bg-gray-700 py-3 rounded-xl font-bold flex items-center justify-center gap-2 border border-gray-600">
                    <i class="fas fa-sync-alt"></i>
                    تحديث
                </button>
                <a href="intent://#Intent;scheme=https;package=com.android.chrome;end" id="chromeLink" class="flex-1 bg-gray-800 hover:bg-gray-700 py-3 rounded-xl font-bold flex items-center justify-center gap-2 border border-gray-600">
                    <i class="fab fa-chrome text-blue-400"></i>
                    Chrome
                </a>
            </div>
            
            <div class="mt-4">
                <label class="cursor-pointer bg-purple-600/20 hover:bg-purple-600/30 text-purple-400 py-2 px-4 rounded-lg border border-purple-500/30 text-sm block">
                    <i class="fas fa-image mr-2"></i> مسح من صورة
                    <input type="file" class="hidden" onchange="handleFile(this)">
                </label>
            </div>
        </div>

        <p class="mt-8 text-gray-600 text-xs tracking-widest uppercase">Powered by ALHYTHAM Tech</p>
    </div>

    <canvas id="qr-canvas" class="hidden"></canvas>
    <div id="result"></div>

    <script>
        let gCtx = null;
        let v = document.getElementById("v");
        let gCanvas = document.getElementById("qr-canvas");
        let gStream = null;

        function initCanvas(w, h) {
            gCanvas.width = w;
            gCanvas.height = h;
            gCtx = gCanvas.getContext("2d");
            gCtx.clearRect(0, 0, w, h);
        }

        function captureToCanvas() {
            if (v.paused || v.ended) return;
            try {
                gCtx.drawImage(v, 0, 0);
                try {
                    qrcode.decode();
                } catch (e) {
                    setTimeout(captureToCanvas, 500);
                }
            } catch (e) {
                setTimeout(captureToCanvas, 500);
            }
        }

        function handleFile(input) {
            if (input.files && input.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    qrcode.decode(e.target.result);
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        qrcode.callback = function(data) {
            if (data && data !== "error decoding QR Code") {
                if (navigator.vibrate) navigator.vibrate(200);
                
                // التوجيه التلقائي المباشر
                let url = data;
                if (!url.startsWith("http") && (url.includes(".") || url.includes("localhost"))) {
                    url = "https://" + url;
                }
                
                try {
                    new URL(url);
                    window.location.href = url;
                } catch (e) {
                    alert("النتيجة: " + data);
                    location.reload();
                }
            } else {
                setTimeout(captureToCanvas, 500);
            }
        };

        async function setupCamera() {
            try {
                const constraints = {
                    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
                };
                gStream = await navigator.mediaDevices.getUserMedia(constraints);
                v.srcObject = gStream;
                v.onloadedmetadata = function() {
                    initCanvas(v.videoWidth, v.videoHeight);
                    captureToCanvas();
                };
            } catch (err) {
                console.error("Camera Error:", err);
                document.getElementById("outdiv").innerHTML = `<div class="p-8 text-center text-red-500 text-sm">خطأ: يرجى منح إذن الكاميرا وتحديث الصفحة</div>`;
            }
        }

        window.onload = function() {
            document.getElementById("chromeLink").href = `intent://${window.location.href.replace(/^https?:\/\//, '')}#Intent;scheme=https;package=com.android.chrome;end`;
            setupCamera();
        };
    </script>
</body>
</html>
