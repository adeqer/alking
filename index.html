<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="ماسح QR ذكي فائق الدقة، توجيه تلقائي فوري، رفع صور، سجل متطور، بدون تأخير.">
  <title>ALHYTHAM.NET | الماسح الذكي Ultra HD</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg: #0b1120;
      --surface: #151e32;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #818cf8;
      --primary-hover: #6366f1;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --border: #1e293b;
      --radius: 16px;
      --shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.3);
      --glass: rgba(21, 30, 50, 0.85);
      --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background var(--transition), color var(--transition);
    }

    header {
      padding: 1rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--glass);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-weight: 800;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #818cf8, #06b6d4);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      gap: 0.6rem;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      border: 1px solid var(--border);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: var(--transition);
      box-shadow: var(--shadow);
    }

    .icon-btn:hover {
      transform: scale(1.05);
      border-color: var(--primary);
      background: rgba(129, 140, 248, 0.1);
    }

    main {
      flex: 1;
      padding: 1.2rem;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .scanner-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    #reader {
      width: 100%;
      min-height: 300px;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      position: relative;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      border-radius: 12px;
      image-rendering: -webkit-optimize-contrast;
    }

    .scan-overlay {
      position: absolute;
      inset: 20px;
      border: 3px solid rgba(129, 140, 248, 0.5);
      border-radius: 10px;
      pointer-events: none;
      z-index: 2;
      box-shadow: inset 0 0 20px rgba(129, 140, 248, 0.2);
    }

    .scan-overlay::before,
    .scan-overlay::after {
      content: "";
      position: absolute;
      width: 25px;
      height: 25px;
      border: 3px solid var(--primary);
      transition: var(--transition);
    }

    .scan-overlay::before {
      top: -5px;
      right: -5px;
      border-width: 3px 3px 0 0;
      border-radius: 0 8px 0 0;
    }

    .scan-overlay::after {
      bottom: -5px;
      left: -5px;
      border-width: 0 0 3px 3px;
      border-radius: 0 0 0 8px;
    }

    .scan-line {
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      box-shadow: 0 0 15px var(--primary);
      animation: scan 2s linear infinite;
      border-radius: 2px;
      z-index: 3;
    }

    @keyframes scan {
      0%, 100% {
        top: 20%;
        opacity: 0.3;
      }
      50% {
        top: 80%;
        opacity: 1;
      }
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }
      50% {
        box-shadow: 0 0 0 10px rgba(16, 185, 129, 0);
      }
    }

    .scan-success {
      animation: pulse 0.6s ease-out;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 0.8rem;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 1rem;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      transition: var(--transition);
      box-shadow: var(--shadow);
    }

    .control-btn:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
      background: rgba(129, 140, 248, 0.1);
    }

    .control-btn i {
      font-size: 1.3rem;
    }

    .control-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: transparent;
    }

    .upload-section {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      border: 2px dashed var(--border);
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .upload-section:hover {
      border-color: var(--primary);
      background: rgba(129, 140, 248, 0.05);
    }

    .upload-section.dragover {
      border-color: var(--primary);
      background: rgba(129, 140, 248, 0.1);
    }

    .upload-section i {
      font-size: 2.5rem;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    #file-input {
      display: none;
    }

    .result-panel {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: none;
      animation: slideUp 0.4s ease;
    }

    .result-panel.show {
      display: block;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      gap: 1rem;
    }

    .result-type {
      font-size: 0.75rem;
      padding: 0.4rem 0.8rem;
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
      border-radius: 20px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .result-content {
      word-break: break-all;
      background: rgba(0, 0, 0, 0.3);
      padding: 1rem;
      border-radius: 10px;
      font-family: "Courier New", monospace;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 1rem;
    }

    .result-actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 0.8rem;
    }

    .result-btn {
      background: rgba(129, 140, 248, 0.2);
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 0.8rem;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: var(--transition);
    }

    .result-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    .history-section {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      max-height: 400px;
      overflow-y: auto;
    }

    .history-item {
      padding: 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: var(--transition);
      gap: 1rem;
    }

    .history-item:hover {
      border-color: var(--primary);
      background: rgba(129, 140, 248, 0.1);
      transform: translateX(-5px);
    }

    .history-item-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.9rem;
    }

    .history-item-time {
      color: var(--text-muted);
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .history-item-type {
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      background: rgba(129, 140, 248, 0.2);
      color: var(--primary);
      border-radius: 4px;
      font-weight: 600;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text);
      color: var(--bg);
      padding: 1rem 1.5rem;
      border-radius: 50px;
      opacity: 0;
      transition: var(--transition);
      z-index: 999;
      font-weight: 600;
      box-shadow: var(--shadow);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(129, 140, 248, 0.3);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    footer {
      text-align: center;
      padding: 1.5rem 1rem;
      color: var(--text-muted);
      font-size: 0.8rem;
      border-top: 1px solid var(--border);
      margin-top: auto;
    }

    @media (max-width: 600px) {
      main {
        padding: 0.8rem;
        gap: 0.8rem;
      }

      .controls {
        grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      }

      .result-actions {
        grid-template-columns: 1fr;
      }
    }

    .status-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 0.5rem;
      background: var(--danger);
      animation: blink 1s infinite;
    }

    .status-indicator.active {
      background: var(--success);
      animation: none;
    }

    @keyframes blink {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    .zoom-control {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 0.5rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .zoom-control input {
      width: 100px;
      cursor: pointer;
      accent-color: var(--primary);
    }

    .zoom-value {
      font-size: 0.85rem;
      color: var(--text-muted);
      min-width: 40px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <i class="fas fa-qrcode"></i>
      <span>ALHYTHAM.NET</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="reload-btn" title="إعادة تحميل الكاميرا">
        <i class="fas fa-sync-alt"></i>
      </button>
      <button class="icon-btn" id="theme-btn" title="تبديل الوضع">
        <i class="fas fa-moon"></i>
      </button>
    </div>
  </header>

  <main>
    <!-- قسم الكاميرا -->
    <div class="scanner-card">
      <div id="reader">
        <div class="scan-overlay">
          <div class="scan-line"></div>
        </div>
      </div>
    </div>

    <!-- أزرار التحكم -->
    <div class="controls">
      <button class="control-btn" id="switch-cam-btn" title="تبديل الكاميرا">
        <i class="fas fa-camera-rotate"></i>
        <span>تبديل</span>
      </button>
      <button class="control-btn" id="torch-btn" title="تشغيل الفلاش">
        <i class="fas fa-lightbulb"></i>
        <span>إضاءة</span>
      </button>
      <button class="control-btn" id="focus-btn" title="التركيز التلقائي">
        <i class="fas fa-crosshairs"></i>
        <span>تركيز</span>
      </button>
      <button class="control-btn" id="sound-btn" title="تشغيل الصوت">
        <i class="fas fa-volume-high"></i>
        <span>صوت</span>
      </button>
      <button class="control-btn" id="pause-btn" title="إيقاف المسح">
        <i class="fas fa-pause"></i>
        <span>إيقاف</span>
      </button>
    </div>

    <!-- قسم رفع الصور -->
    <div class="scanner-card">
      <div class="upload-section" id="upload-section">
        <i class="fas fa-cloud-upload-alt"></i>
        <h3>رفع صورة QR Code</h3>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">
          اسحب الصورة هنا أو اضغط للاختيار
        </p>
      </div>
      <input type="file" id="file-input" accept="image/*">
    </div>

    <!-- لوحة النتائج -->
    <div class="result-panel" id="result-panel">
      <div class="result-header">
        <div>
          <h3 style="margin-bottom: 0.5rem;">📦 النتيجة</h3>
          <span class="result-type" id="result-type">URL</span>
        </div>
        <button class="icon-btn" id="close-result" title="إغلاق">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="result-content" id="result-content"></div>
      <div class="result-actions">
        <button class="result-btn" id="open-result" title="فتح الرابط">
          <i class="fas fa-external-link-alt"></i>
          <span>فتح</span>
        </button>
        <button class="result-btn" id="copy-result" title="نسخ النتيجة">
          <i class="fas fa-copy"></i>
          <span>نسخ</span>
        </button>
        <button class="result-btn" id="share-result" title="مشاركة">
          <i class="fas fa-share-alt"></i>
          <span>مشاركة</span>
        </button>
      </div>
    </div>

    <!-- سجل المسح -->
    <div class="history-section">
      <div class="history-header">
        <span>🕒 سجل المسح</span>
        <button class="icon-btn" id="clear-history" style="padding: 0.4rem 0.8rem; font-size: 0.75rem;">
          <i class="fas fa-trash"></i>
        </button>
      </div>
      <div class="history-list" id="history-list">
        <div class="empty-state">
          <i class="fas fa-inbox"></i>
          <p>لا توجد عمليات مسح حتى الآن</p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    © 2026 ALHYTHAM.NET | الماسح الذكي Ultra HD
  </footer>

  <div class="toast" id="toast"></div>

  <!-- مكتبة QR Scanner من Nimiq -->
  <script src="https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>

  <script>
    // ============================================
    // إعدادات عامة
    // ============================================
    const config = {
      maxHistoryItems: 50,
      autoRedirectDelay: 500,
      soundFrequency: 880,
      soundDuration: 0.1,
      hapticPattern: [50, 100, 50],
    };

    // ============================================
    // متغيرات عامة
    // ============================================
    let scanner = null;
    let isScanning = true;
    let soundEnabled = true;
    let currentFacingMode = 'environment';
    let lastScannedResult = '';
    let scanHistory = [];
    let videoTrack = null;

    // ============================================
    // عناصر DOM
    // ============================================
    const $ = (id) => document.getElementById(id);
    const toast = $('toast');
    const reader = $('reader');
    const resultPanel = $('result-panel');
    const resultContent = $('result-content');
    const resultType = $('result-type');
    const historyList = $('history-list');

    // ============================================
    // دوال مساعدة
    // ============================================
    const showToast = (message) => {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    };

    const playSound = () => {
      if (!soundEnabled) return;
      try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        oscillator.frequency.value = config.soundFrequency;
        gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + config.soundDuration);
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + config.soundDuration);
      } catch (e) {
        console.log('Audio not supported');
      }
    };

    const triggerHaptic = () => {
      if (navigator.vibrate) {
        navigator.vibrate(config.hapticPattern);
      }
    };

    const getResultType = (result) => {
      if (result.startsWith('http://') || result.startsWith('https://')) {
        return 'URL';
      } else if (result.includes('@')) {
        return 'EMAIL';
      } else if (/^\d+$/.test(result)) {
        return 'PHONE';
      } else if (result.startsWith('BEGIN:VCARD')) {
        return 'VCARD';
      } else if (result.startsWith('BEGIN:VEVENT')) {
        return 'EVENT';
      } else {
        return 'TEXT';
      }
    };

    const autoRedirect = (result) => {
      const type = getResultType(result);
      setTimeout(() => {
        if (type === 'URL') {
          window.open(result, '_blank');
          showToast('✅ تم فتح الرابط تلقائياً');
        } else if (type === 'EMAIL') {
          window.location.href = `mailto:${result}`;
          showToast('✅ تم فتح البريد الإلكتروني');
        } else if (type === 'PHONE') {
          window.location.href = `tel:${result}`;
          showToast('✅ تم فتح الاتصال');
        }
      }, config.autoRedirectDelay);
    };

    // ============================================
    // إدارة السجل
    // ============================================
    const addToHistory = (result) => {
      const type = getResultType(result);
      const timestamp = new Date().toLocaleTimeString('ar-EG');
      const historyItem = { result, type, timestamp };

      scanHistory.unshift(historyItem);
      if (scanHistory.length > config.maxHistoryItems) {
        scanHistory.pop();
      }

      localStorage.setItem('qr_history', JSON.stringify(scanHistory));
      renderHistory();
    };

    const renderHistory = () => {
      if (scanHistory.length === 0) {
        historyList.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-inbox"></i>
            <p>لا توجد عمليات مسح حتى الآن</p>
          </div>
        `;
        return;
      }

      historyList.innerHTML = scanHistory.map((item, index) => `
        <div class="history-item" onclick="showHistoryItem(${index})">
          <div class="history-item-text" title="${item.result}">
            ${item.result.substring(0, 50)}${item.result.length > 50 ? '...' : ''}
          </div>
          <span class="history-item-type">${item.type}</span>
          <span class="history-item-time">${item.timestamp}</span>
        </div>
      `).join('');
    };

    const loadHistory = () => {
      const saved = localStorage.getItem('qr_history');
      if (saved) {
        scanHistory = JSON.parse(saved);
        renderHistory();
      }
    };

    window.showHistoryItem = (index) => {
      const item = scanHistory[index];
      resultContent.textContent = item.result;
      resultType.textContent = item.type;
      resultPanel.classList.add('show');
    };

    // ============================================
    // معالجة نتائج المسح
    // ============================================
    const handleScanResult = (result) => {
      if (result === lastScannedResult) return;

      lastScannedResult = result;
      isScanning = false;

      // تأثيرات بصرية وصوتية
      reader.classList.add('scan-success');
      playSound();
      triggerHaptic();

      // عرض النتيجة
      resultContent.textContent = result;
      resultType.textContent = getResultType(result);
      resultPanel.classList.add('show');

      // إضافة إلى السجل
      addToHistory(result);

      // التوجيه التلقائي
      autoRedirect(result);

      showToast('✅ تم المسح بنجاح');

      // إزالة التأثير وإعادة تشغيل المسح
      setTimeout(() => {
        reader.classList.remove('scan-success');
        isScanning = true;
        lastScannedResult = '';
      }, 2000);
    };

    // ============================================
    // تهيئة الكاميرا
    // ============================================
    const initializeScanner = async () => {
      try {
        // تحديد عنصر الفيديو
        const videoElement = document.createElement('video');
        reader.innerHTML = '';
        reader.appendChild(videoElement);

        // إضافة تراكب المسح
        const overlay = document.createElement('div');
        overlay.className = 'scan-overlay';
        overlay.innerHTML = '<div class="scan-line"></div>';
        reader.appendChild(overlay);

        // إنشاء الماسح
        scanner = new QrScanner(
          videoElement,
          (result) => {
            if (isScanning) {
              handleScanResult(result.data);
            }
          },
          {
            onDecodeError: (error) => {
              // تجاهل الأخطاء الصامتة
            },
            preferredCamera: currentFacingMode,
            highlightCodeOutline: false,
            maxScansPerSecond: 5,
          }
        );

        await scanner.start();
        videoTrack = videoElement.srcObject.getVideoTracks()[0];

        showToast('✅ تم تشغيل الكاميرا بنجاح');
      } catch (error) {
        console.error('Camera error:', error);
        showToast('❌ خطأ في الوصول إلى الكاميرا');
      }
    };

    // ============================================
    // معالجات الأزرار
    // ============================================
    $('reload-btn').onclick = () => {
      location.reload();
    };

    $('theme-btn').onclick = () => {
      document.body.classList.toggle('light-mode');
      const isDark = !document.body.classList.contains('light-mode');
      $('theme-btn').innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    };

    $('switch-cam-btn').onclick = async () => {
      currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
      if (scanner) {
        await scanner.stop();
      }
      await initializeScanner();
      showToast(`✅ تم التبديل إلى الكاميرا ${currentFacingMode === 'environment' ? 'الخلفية' : 'الأمامية'}`);
    };

    $('torch-btn').onclick = async () => {
      if (!videoTrack) return;
      try {
        const capabilities = videoTrack.getCapabilities();
        if (!capabilities.torch) {
          showToast('❌ الفلاش غير مدعوم');
          return;
        }
        const settings = videoTrack.getSettings();
        await videoTrack.applyConstraints({
          advanced: [{ torch: !settings.torch }]
        });
        $('torch-btn').classList.toggle('active', !settings.torch);
        showToast(!settings.torch ? '✅ تم تشغيل الفلاش' : '✅ تم إيقاف الفلاش');
      } catch (error) {
        showToast('❌ خطأ في التحكم بالفلاش');
      }
    };

    $('focus-btn').onclick = async () => {
      if (!videoTrack) return;
      try {
        const capabilities = videoTrack.getCapabilities();
        if (!capabilities.focusMode) {
          showToast('❌ التركيز التلقائي غير مدعوم');
          return;
        }
        await videoTrack.applyConstraints({
          advanced: [{ focusMode: 'continuous' }]
        });
        $('focus-btn').classList.toggle('active');
        showToast('✅ تم تفعيل التركيز التلقائي');
      } catch (error) {
        showToast('❌ خطأ في التركيز');
      }
    };

    $('sound-btn').onclick = () => {
      soundEnabled = !soundEnabled;
      $('sound-btn').classList.toggle('active', soundEnabled);
      showToast(soundEnabled ? '✅ تم تشغيل الصوت' : '✅ تم إيقاف الصوت');
    };

    $('pause-btn').onclick = () => {
      isScanning = !isScanning;
      $('pause-btn').classList.toggle('active', !isScanning);
      showToast(isScanning ? '✅ تم استئناف المسح' : '✅ تم إيقاف المسح');
    };

    // ============================================
    // رفع الصور
    // ============================================
    const uploadSection = $('upload-section');
    const fileInput = $('file-input');

    uploadSection.onclick = () => fileInput.click();

    uploadSection.ondragover = (e) => {
      e.preventDefault();
      uploadSection.classList.add('dragover');
    };

    uploadSection.ondragleave = () => {
      uploadSection.classList.remove('dragover');
    };

    uploadSection.ondrop = (e) => {
      e.preventDefault();
      uploadSection.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        fileInput.files = e.dataTransfer.files;
        handleFileUpload();
      }
    };

    fileInput.onchange = handleFileUpload;

    async function handleFileUpload() {
      const file = fileInput.files[0];
      if (!file) return;

      showToast('⏳ جاري معالجة الصورة...');

      try {
        const image = new Image();
        image.onload = async () => {
          const canvas = document.createElement('canvas');
          canvas.width = image.width;
          canvas.height = image.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(image, 0, 0);

          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const result = await QrScanner.scanImage(imageData);

          if (result) {
            handleScanResult(result.data);
          } else {
            showToast('❌ لم يتم العثور على QR code في الصورة');
          }
        };
        image.src = URL.createObjectURL(file);
      } catch (error) {
        console.error('Image processing error:', error);
        showToast('❌ خطأ في معالجة الصورة');
      }
    }

    // ============================================
    // معالجات لوحة النتائج
    // ============================================
    $('close-result').onclick = () => {
      resultPanel.classList.remove('show');
    };

    $('open-result').onclick = () => {
      const result = resultContent.textContent;
      const type = getResultType(result);

      if (type === 'URL') {
        window.open(result, '_blank');
      } else if (type === 'EMAIL') {
        window.location.href = `mailto:${result}`;
      } else if (type === 'PHONE') {
        window.location.href = `tel:${result}`;
      } else {
        window.open(`https://www.google.com/search?q=${encodeURIComponent(result)}`, '_blank');
      }

      showToast('✅ تم الفتح');
    };

    $('copy-result').onclick = () => {
      const result = resultContent.textContent;
      navigator.clipboard.writeText(result);
      showToast('📋 تم النسخ إلى الحافظة');
    };

    $('share-result').onclick = async () => {
      const result = resultContent.textContent;

      if (navigator.share) {
        try {
          await navigator.share({
            title: 'QR Code Result',
            text: result,
          });
          showToast('✅ تم المشاركة');
        } catch (error) {
          console.log('Share cancelled');
        }
      } else {
        navigator.clipboard.writeText(result);
        showToast('📋 تم النسخ (المشاركة غير مدعومة)');
      }
    };

    // ============================================
    // إدارة السجل
    // ============================================
    $('clear-history').onclick = () => {
      if (confirm('هل تريد حذف جميع عمليات المسح؟')) {
        scanHistory = [];
        localStorage.removeItem('qr_history');
        renderHistory();
        showToast('✅ تم حذف السجل');
      }
    };

    // ============================================
    // التهيئة الأولية
    // ============================================
    document.addEventListener('DOMContentLoaded', async () => {
      loadHistory();
      await initializeScanner();
    });

    // ============================================
    // معالجة إغلاق الصفحة
    // ============================================
    window.addEventListener('beforeunload', async () => {
      if (scanner) {
        await scanner.stop();
      }
    });
  </script>
</body>
</html>
