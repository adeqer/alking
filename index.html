<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALHYTHAM QR - النسخة المضمونة 100%</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- المكتبات الأساسية للمسح (نفس المستخدمة في الموقع المرجعي) -->
    <script src="https://rawgit.com/sitepoint-editors/jsqrcode/master/src/qr_packed.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root { --primary: #3b82f6; --bg: #000; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg); color: #fff; margin: 0; padding: 0; }
        .glass { background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        #v { width: 100%; height: 100%; object-fit: cover; border-radius: 24px; }
        #qr-canvas { display: none; }
        .nav-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); }
        .scan-container { position: relative; width: 100%; aspect-ratio: 1/1; background: #111; border-radius: 32px; overflow: hidden; border: 2px solid #222; }
        .scan-line { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--primary); box-shadow: 0 0 15px var(--primary); animation: scan 2s linear infinite; z-index: 5; }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="p-5 flex justify-between items-center glass sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <i class="fas fa-qrcode text-blue-500 text-2xl"></i>
            <h1 class="text-xl font-black">ALHYTHAM QR</h1>
        </div>
        <button onclick="location.reload()" class="text-zinc-400"><i class="fas fa-sync-alt"></i></button>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-4 pb-28 space-y-6">
        
        <!-- Scanner Section -->
        <section id="section-scan" class="tab-content space-y-5">
            <div class="scan-container">
                <div class="scan-line"></div>
                <video id="v" autoplay playsinline></video>
                <canvas id="qr-canvas"></canvas>
                
                <!-- Controls -->
                <div class="absolute bottom-5 left-5 right-5 flex justify-between items-center z-10">
                    <button onclick="initCamera()" class="w-12 h-12 rounded-2xl glass flex items-center justify-center text-white shadow-lg"><i class="fas fa-camera"></i></button>
                    <label class="w-12 h-12 rounded-2xl bg-blue-600 flex items-center justify-center text-white shadow-lg cursor-pointer">
                        <i class="fas fa-image"></i>
                        <input type="file" accept="image/*" class="hidden" onchange="handleFile(this)">
                    </label>
                </div>
            </div>

            <!-- Settings -->
            <div class="glass p-4 rounded-2xl flex justify-between items-center">
                <span class="text-sm font-bold">الفتح التلقائي للروابط</span>
                <input type="checkbox" id="auto-open" checked class="w-5 h-5 accent-blue-500">
            </div>

            <!-- Result Card -->
            <div id="result-card" class="hidden glass p-6 rounded-3xl border-r-4 border-blue-500">
                <p class="text-xs font-black text-blue-500 mb-2">النتيجة المكتشفة</p>
                <p id="result-text" class="text-lg font-mono break-all mb-6 text-left dir-ltr"></p>
                <div class="flex gap-3">
                    <button onclick="copyResult()" class="flex-1 bg-zinc-800 py-3 rounded-xl font-bold">نسخ</button>
                    <a id="result-link" href="#" target="_blank" class="hidden flex-1 bg-blue-600 py-3 rounded-xl font-bold text-center">زيارة</a>
                </div>
            </div>
        </section>

        <!-- Create Section -->
        <section id="section-create" class="tab-content hidden space-y-6">
            <div class="glass p-6 rounded-3xl space-y-4">
                <textarea id="qr-input" rows="4" class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl p-4 outline-none text-right" placeholder="أدخل النص هنا..."></textarea>
                <button onclick="generateQR()" class="w-full bg-blue-600 py-4 rounded-2xl font-black">توليد كود QR</button>
                <div id="qr-output" class="hidden flex flex-col items-center gap-4 pt-4">
                    <div id="qrcode" class="p-4 bg-white rounded-2xl"></div>
                    <button onclick="downloadQR()" class="text-blue-400 font-bold">تحميل الصورة</button>
                </div>
            </div>
        </section>

        <!-- History Section -->
        <section id="section-history" class="tab-content hidden space-y-3">
            <div id="history-list" class="space-y-2"></div>
        </section>

    </main>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 left-0 right-0 h-20 glass flex items-center justify-around z-50">
        <button onclick="showTab('scan')" id="nav-scan" class="nav-btn active flex-1 flex flex-col items-center gap-1 py-2">
            <i class="fas fa-expand"></i><span class="text-[10px] font-bold">ماسح</span>
        </button>
        <button onclick="showTab('create')" id="nav-create" class="nav-btn flex-1 flex flex-col items-center gap-1 py-2 text-zinc-500">
            <i class="fas fa-plus-circle"></i><span class="text-[10px] font-bold">إنشاء</span>
        </button>
        <button onclick="showTab('history')" id="nav-history" class="nav-btn flex-1 flex flex-col items-center gap-1 py-2 text-zinc-500">
            <i class="fas fa-history"></i><span class="text-[10px] font-bold">سجل</span>
        </button>
    </nav>

    <script>
        let v = document.getElementById("v");
        let gCanvas = document.getElementById("qr-canvas");
        let gCtx = gCanvas.getContext("2d");
        let scanning = false;

        // --- Camera Logic (Same as Reference Site) ---
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, 
                    audio: false 
                });
                v.srcObject = stream;
                scanning = true;
                requestAnimationFrame(scanLoop);
            } catch (e) {
                Swal.fire("تنبيه", "يرجى السماح بالوصول للكاميرا أو فتح الموقع في متصفح كروم.", "warning");
            }
        }

        function scanLoop() {
            if (scanning && v.readyState === v.HAVE_ENOUGH_DATA) {
                gCanvas.width = v.videoWidth;
                gCanvas.height = v.videoHeight;
                gCtx.drawImage(v, 0, 0, gCanvas.width, gCanvas.height);
                try {
                    qrcode.decode();
                } catch (e) {
                    setTimeout(scanLoop, 200);
                }
            } else {
                setTimeout(scanLoop, 200);
            }
        }

        // QR Code Library Callback
        qrcode.callback = (data) => {
            if (data.indexOf("error") === -1) {
                onScanSuccess(data);
            } else {
                setTimeout(scanLoop, 200);
            }
        };

        function onScanSuccess(text) {
            if (navigator.vibrate) navigator.vibrate(100);
            if (document.getElementById('auto-open').checked && text.startsWith('http')) {
                window.location.href = text;
                return;
            }
            document.getElementById('result-card').classList.remove('hidden');
            document.getElementById('result-text').innerText = text;
            const link = document.getElementById('result-link');
            if (text.startsWith('http')) {
                link.href = text;
                link.classList.remove('hidden');
            } else {
                link.classList.add('hidden');
            }
            saveHistory(text);
        }

        // --- File Upload Logic ---
        function handleFile(input) {
            if (!input.files.length) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    gCanvas.width = img.width;
                    gCanvas.height = img.height;
                    gCtx.drawImage(img, 0, 0);
                    try {
                        qrcode.decode();
                    } catch (err) {
                        Swal.fire("خطأ", "لم يتم العثور على كود في الصورة", "error");
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }

        // --- UI & Tabs ---
        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active', 'text-blue-500'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.add('text-zinc-500'));
            document.getElementById(`section-${id}`).classList.remove('hidden');
            document.getElementById(`nav-${id}`).classList.add('active', 'text-blue-500');
            document.getElementById(`nav-${id}`).classList.remove('text-zinc-500');
            if (id === 'history') renderHistory();
        }

        function generateQR() {
            const val = document.getElementById('qr-input').value;
            if (!val) return;
            const out = document.getElementById('qrcode');
            out.innerHTML = '';
            new QRCode(out, { text: val, width: 200, height: 200 });
            document.getElementById('qr-output').classList.remove('hidden');
        }

        function saveHistory(text) {
            let h = JSON.parse(localStorage.getItem('alhytham_h') || '[]');
            h.unshift({ text, date: new Date().toLocaleString('ar-EG') });
            localStorage.setItem('alhytham_h', JSON.stringify(h.slice(0, 20)));
        }

        function renderHistory() {
            const h = JSON.parse(localStorage.getItem('alhytham_h') || '[]');
            const list = document.getElementById('history-list');
            list.innerHTML = h.map(i => `
                <div class="glass p-4 rounded-2xl flex justify-between items-center">
                    <div class="truncate flex-1 text-xs font-mono text-left dir-ltr mr-3">${i.text}</div>
                    <button onclick="copyRaw('${i.text}')" class="text-blue-500"><i class="fas fa-copy"></i></button>
                </div>
            `).join('') || '<p class="text-center text-zinc-600 py-10">السجل فارغ</p>';
        }

        function copyResult() { copyRaw(document.getElementById('result-text').innerText); }
        function copyRaw(t) {
            navigator.clipboard.writeText(t);
            Swal.fire({ toast: true, title: "تم النسخ", icon: "success", showConfirmButton: false, timer: 1000 });
        }

        function downloadQR() {
            const img = document.querySelector('#qrcode img');
            const a = document.createElement('a');
            a.href = img.src;
            a.download = 'ALHYTHAM-QR.png';
            a.click();
        }

        window.onload = () => initCamera();
    </script>
</body>
</html>
