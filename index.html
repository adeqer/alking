<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALHYTHAM QR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --accent: #00ff88;
            --danger: #ff3366;
            --bg-dark: #060918;
            --bg-card: rgba(20, 25, 45, 0.85);
            --text-primary: #ffffff;
            --text-secondary: #b0b8d1;
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-glow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1a1f3a 0%, var(--bg-dark) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow-x: hidden;
        }

        .bg-animate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bg-animate span {
            position: absolute;
            display: block;
            width: 20px; height: 20px;
            background: rgba(0, 242, 254, 0.05);
            animation: move 25s linear infinite;
            bottom: -150px;
            border-radius: 50%;
        }

        @keyframes move {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; }
        }

        .main-container {
            width: 100%;
            max-width: 650px;
            z-index: 1;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 30px 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-logo {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px;
            font-size: 1.8rem;
            color: var(--bg-dark);
            box-shadow: var(--neon-glow);
        }

        .brand-title {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-size: 0.9rem;
        }

        .tab-btn.active {
            background: var(--primary);
            color: var(--bg-dark);
            box-shadow: var(--neon-glow);
        }

        .content-section { display: none; }
        .content-section.active { display: block; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Scanner Styling */
        .scanner-container {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 1;
            border: 2px solid var(--glass-border);
        }

        #cameraVideo { width: 100%; height: 100%; object-fit: cover; }

        .scan-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            pointer-events: none;
        }

        .scan-window {
            width: 70%; height: 70%;
            border: 2px solid var(--primary);
            border-radius: 20px;
            position: relative;
            box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.5);
        }

        .scan-line {
            position: absolute; width: 100%; height: 3px;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            animation: scanAnim 2.5s ease-in-out infinite;
        }

        @keyframes scanAnim { 0%, 100% { top: 0%; } 50% { top: 100%; } }

        .camera-controls {
            display: flex; justify-content: center; gap: 12px; margin-top: 15px;
        }

        .control-btn {
            width: 45px; height: 45px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .zoom-slider-container {
            margin-top: 15px; display: flex; align-items: center; gap: 10px; padding: 0 10px;
        }

        input[type=range] { flex: 1; accent-color: var(--primary); }

        /* Upload Area */
        .upload-area {
            border: 2px dashed var(--glass-border);
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.02);
        }

        /* History List */
        .history-list {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 10px;
            padding-right: 5px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .history-info { flex: 1; min-width: 0; }
        .history-text {
            font-size: 0.9rem;
            color: var(--primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }
        .history-date { font-size: 0.7rem; color: var(--text-secondary); }

        .history-actions { display: flex; gap: 5px; }
        .hist-btn {
            width: 32px; height: 32px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem;
        }
        .btn-open { background: var(--primary); color: var(--bg-dark); }
        .btn-del { background: var(--danger); color: white; }

        /* Toast & Overlays */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--primary); color: var(--bg-dark);
            padding: 10px 20px; border-radius: 50px; font-weight: 700;
            transition: transform 0.3s ease; z-index: 2000;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 9, 24, 0.95); z-index: 1000;
            display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .overlay.active { display: flex; }
        .overlay-content {
            max-width: 400px; background: var(--bg-card); padding: 30px; border-radius: 25px; border: 1px solid var(--primary); text-align: center;
        }

        .footer { text-align: center; margin-top: 20px; color: var(--text-secondary); font-size: 0.8rem; }

        /* ميزة جديدة: مؤشر التوجيه التلقائي */
        .auto-redirect-timer {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 10px; border-radius: 10px;
            font-size: 0.7rem; color: var(--accent);
            display: none;
        }
    </style>
</head>
<body>

    <div class="bg-animate" id="bgAnimate"></div>

    <div class="main-container">
        <div class="card">
            <div class="header">
                <div class="brand-logo"><i class="fas fa-qrcode"></i></div>
                <h1 class="brand-title">ALHYTHAM QR PRO</h1>
                <p style="font-size: 0.8rem; color: var(--text-secondary);">التوجيه التلقائي وسجل المحفوظات مفعل</p>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('camera')">
                    <i class="fas fa-camera"></i> مسح
                </button>
                <button class="tab-btn" onclick="switchTab('upload')">
                    <i class="fas fa-file-upload"></i> رفع
                </button>
                <button class="tab-btn" onclick="switchTab('history')">
                    <i class="fas fa-history"></i> السجل
                </button>
            </div>

            <!-- قسم الكاميرا -->
            <div id="cameraSection" class="content-section active">
                <div class="scanner-container">
                    <video id="cameraVideo" autoplay playsinline muted></video>
                    <div class="scan-overlay">
                        <div class="scan-window">
                            <div class="scan-line"></div>
                        </div>
                    </div>
                    <div id="redirectTimer" class="auto-redirect-timer">جاري التوجيه...</div>
                </div>

                <div class="camera-controls">
                    <button class="control-btn" onclick="toggleFlash()"><i class="fas fa-bolt" id="flashIcon"></i></button>
                    <button class="control-btn" onclick="switchCamera()"><i class="fas fa-sync-alt"></i></button>
                    <button class="control-btn" onclick="resetScanner()"><i class="fas fa-redo"></i></button>
                </div>

                <div class="zoom-slider-container">
                    <i class="fas fa-search-minus"></i>
                    <input type="range" id="zoomSlider" min="1" max="3" step="0.1" value="1" oninput="updateZoom(this.value)">
                    <i class="fas fa-search-plus"></i>
                </div>
            </div>

            <!-- قسم الرفع -->
            <div id="uploadSection" class="content-section">
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <i class="fas fa-cloud-upload-alt" style="font-size: 3rem; color: var(--primary); margin-bottom: 10px;"></i>
                    <h3>ارفع صورة الكود</h3>
                    <input type="file" id="fileInput" hidden accept="image/*" onchange="handleFileUpload(event)">
                </div>
                <div id="uploadResult" style="margin-top: 15px; display: none; text-align: center;">
                    <p id="uploadText" style="color: var(--accent); margin-bottom: 10px;"></p>
                    <img id="filePreview" style="max-width: 150px; border-radius: 10px;">
                </div>
            </div>

            <!-- قسم السجل -->
            <div id="historySection" class="content-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3>المحفوظات مؤخراً</h3>
                    <button onclick="clearHistory()" style="background: none; border: none; color: var(--danger); cursor: pointer; font-size: 0.8rem;">مسح الكل</button>
                </div>
                <div id="historyList" class="history-list">
                    <!-- سيتم ملؤه بواسطة JS -->
                </div>
            </div>

            <div class="footer">
                &copy; 2026 ALHYTHAM PRO | V2.0
            </div>
        </div>
    </div>

    <!-- واجهة المتصفح -->
    <div id="browserOverlay" class="overlay">
        <div class="overlay-content">
            <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: var(--danger); margin-bottom: 15px;"></i>
            <h2>تحتاج لمتصفح كروم</h2>
            <p style="color: var(--text-secondary); margin-bottom: 20px;">الكاميرا لا تعمل هنا. افتح الموقع في جوجل كروم للتشغيل.</p>
            <button class="tab-btn active" style="width: 100%; margin-bottom: 10px;" onclick="openInChrome()">فتح في كروم</button>
            <button class="tab-btn" style="width: 100%;" onclick="location.reload()">إعادة محاولة</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <canvas id="qrCanvas" style="display:none;"></canvas>

    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script>
        let currentStream = null;
        let isScanning = false;
        let facingMode = 'environment';
        let track = null;
        let history = JSON.parse(localStorage.getItem('qr_history') || '[]');

        function createBg() {
            const container = document.getElementById('bgAnimate');
            for(let i=0; i<15; i++) {
                const span = document.createElement('span');
                const size = Math.random() * 40 + 10;
                span.style.width = size + 'px'; span.style.height = size + 'px';
                span.style.left = Math.random() * 100 + '%';
                span.style.animationDelay = Math.random() * 20 + 's';
                container.appendChild(span);
            }
        }

        async function initCamera() {
            if (currentStream) currentStream.getTracks().forEach(t => t.stop());
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                const video = document.getElementById('cameraVideo');
                video.srcObject = currentStream;
                track = currentStream.getVideoTracks()[0];
                video.onloadedmetadata = () => { video.play(); startScanning(); };
                
                const caps = track.getCapabilities();
                const slider = document.getElementById('zoomSlider');
                if (caps.zoom) {
                    slider.min = caps.zoom.min; slider.max = caps.zoom.max;
                    slider.step = caps.zoom.step; slider.value = caps.zoom.min;
                }
            } catch (err) { showBrowserOverlay(); }
        }

        function startScanning() {
            isScanning = true;
            const codeReader = new ZXing.BrowserQRCodeReader();
            const video = document.getElementById('cameraVideo');
            const scan = async () => {
                if (!isScanning) return;
                try {
                    const result = await codeReader.decodeFromVideoElement(video);
                    if (result) {
                        handleQRResult(result.text);
                        return;
                    }
                } catch (e) {}
                requestAnimationFrame(scan);
            };
            scan();
        }

        function handleQRResult(text) {
            isScanning = false;
            if (navigator.vibrate) navigator.vibrate(200);
            
            // حفظ في السجل
            saveToHistory(text);
            
            showToast("تم المسح بنجاح!");

            if (text.startsWith('http')) {
                document.getElementById('redirectTimer').style.display = 'block';
                setTimeout(() => {
                    window.location.href = text;
                }, 1500); // تأخير بسيط ليرى المستخدم النتيجة
            } else {
                // إذا لم يكن رابطاً، نعرضه ونسمح بنسخه
                alert("النتيجة: " + text);
                isScanning = true;
                startScanning();
            }
        }

        function saveToHistory(text) {
            const item = {
                id: Date.now(),
                text: text,
                date: new Date().toLocaleString('ar-EG')
            };
            history.unshift(item);
            if (history.length > 50) history.pop();
            localStorage.setItem('qr_history', JSON.stringify(history));
            updateHistoryUI();
        }

        function updateHistoryUI() {
            const list = document.getElementById('historyList');
            if (history.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:var(--text-secondary); margin-top:20px;">السجل فارغ</p>';
                return;
            }
            list.innerHTML = history.map(item => `
                <div class="history-item">
                    <div class="history-info">
                        <span class="history-text">${item.text}</span>
                        <span class="history-date">${item.date}</span>
                    </div>
                    <div class="history-actions">
                        <button class="hist-btn btn-open" onclick="openItem('${item.text}')" title="فتح"><i class="fas fa-external-link-alt"></i></button>
                        <button class="hist-btn btn-del" onclick="deleteItem(${item.id})" title="حذف"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function openItem(text) {
            if (text.startsWith('http')) window.open(text, '_blank');
            else {
                navigator.clipboard.writeText(text);
                showToast("تم نسخ النص!");
            }
        }

        function deleteItem(id) {
            history = history.filter(i => i.id !== id);
            localStorage.setItem('qr_history', JSON.stringify(history));
            updateHistoryUI();
        }

        function clearHistory() {
            if (confirm("هل تريد مسح كل السجل؟")) {
                history = [];
                localStorage.removeItem('qr_history');
                updateHistoryUI();
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            
            if (tab === 'camera') {
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
                document.getElementById('cameraSection').classList.add('active');
                initCamera();
            } else if (tab === 'upload') {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                document.getElementById('uploadSection').classList.add('active');
                isScanning = false;
            } else {
                document.querySelector('.tab-btn:nth-child(3)').classList.add('active');
                document.getElementById('historySection').classList.add('active');
                isScanning = false;
                updateHistoryUI();
            }
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.getElementById('filePreview');
                img.src = e.target.result;
                document.getElementById('uploadResult').style.display = 'block';
                document.getElementById('uploadText').innerText = "جاري المعالجة...";
                
                const codeReader = new ZXing.BrowserQRCodeReader();
                codeReader.decodeFromImageElement(img)
                    .then(result => {
                        document.getElementById('uploadText').innerText = "تم العثور على كود!";
                        handleQRResult(result.text);
                    })
                    .catch(() => {
                        document.getElementById('uploadText').innerText = "لم يتم العثور على كود";
                        document.getElementById('uploadText').style.color = "var(--danger)";
                    });
            };
            reader.readAsDataURL(file);
        }

        function updateZoom(val) {
            if (track && track.getCapabilities().zoom) track.applyConstraints({ advanced: [{ zoom: parseFloat(val) }] });
            else document.getElementById('cameraVideo').style.transform = `scale(${val})`;
        }

        function switchCamera() {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            initCamera();
        }

        async function toggleFlash() {
            if (track && track.getCapabilities().torch) {
                const on = track.getSettings().torch;
                await track.applyConstraints({ advanced: [{ torch: !on }] });
                document.getElementById('flashIcon').style.color = !on ? 'var(--primary)' : 'white';
            } else showToast("الفلاش غير مدعوم");
        }

        function resetScanner() {
            document.getElementById('redirectTimer').style.display = 'none';
            initCamera();
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function showBrowserOverlay() { document.getElementById('browserOverlay').classList.add('active'); }

        function openInChrome() {
            const url = window.location.href.replace(/https?:\/\//, '');
            window.location.href = `intent://${url}#Intent;scheme=https;package=com.android.chrome;end`;
        }

        window.onload = () => { createBg(); initCamera(); updateHistoryUI(); };
    </script>
</body>
</html>
